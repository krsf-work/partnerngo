}
async function bbLib(){
  if(window._XLSXS) return window._XLSXS;
  try{
    const prev=window.XLSX;
    await new Promise((res,rej)=>{ const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
      s.integrity="sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb"; s.crossOrigin="anonymous";   // V75.6
      s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    window._XLSXS=window.XLSX; window.XLSX=prev;
    return window._XLSXS||prev;
  }catch(e){ return window.XLSX; }
}
function bbCell(ws,r,c,cell){ ws[XLSX.utils.encode_cell({r,c})]=cell; }
function bbMoney(v,s){ const c={t:"n",v:Math.round(+v||0),z:"#,##0"}; if(s)c.s=s; return c; }
/* formula cell WITH its computed value cached — without the cached value,
   Excel/most viewers show freshly-written formula cells as blank until a
   manual full recalc, which made Summary/All Trusts look empty */
function bbFml(f,s,v){ const c={t:"n",f,z:"#,##0"}; if(s)c.s=s; if(v!=null&&isFinite(v))c.v=Math.round(v); return c; }
/* per-column computed values for one Budget-vs-Actual data row:
   months, quarter roll-ups and the FY total, for budget AND actual */
function bbRowVals(plan,act){
  const v={};
  FY_MONTHS.forEach((m,i)=>{ v[BB_MCOL[i]]=(+plan[i]||0); v[BB_MCOL[i]+1]=(+act[i]||0); });
  BB_QCOL.forEach((c,qi)=>{
    v[c]  =(+plan[3*qi]||0)+(+plan[3*qi+1]||0)+(+plan[3*qi+2]||0);
    v[c+1]=(+act [3*qi]||0)+(+act [3*qi+1]||0)+(+act [3*qi+2]||0);
  });
  v[BB_YCOL]  =plan.reduce((a,x)=>a+(+x||0),0);
  v[BB_YCOL+1]=act .reduce((a,x)=>a+(+x||0),0);
  return v;
}

/* rows 2-3: month/quarter header pairs + Budget/Actual labels (shared by
   the All Trusts sheet and every trust sheet) */
function bbHeadRows(ws,merges,S){
  FY_MONTHS.forEach((mo,i)=>{
    const c=BB_MCOL[i], [y,mm]=mo.split("-");
    bbCell(ws,1,c,{t:"d",v:new Date(+y,+mm-1,1),z:"mmm-yy",s:S.th});
    merges.push({s:{r:1,c},e:{r:1,c:c+1}});
  });
  ["Q1","Q2","Q3","Q4"].forEach((q,i)=>{ const c=BB_QCOL[i];
    bbCell(ws,1,c,{t:"s",v:q,s:S.thQ}); merges.push({s:{r:1,c},e:{r:1,c:c+1}}); });
  bbCell(ws,1,BB_YCOL,{t:"s",v:BB_FY_SHORT,s:S.thQ});
  merges.push({s:{r:1,c:BB_YCOL},e:{r:1,c:BB_YCOL+1}});
  ["Sr No","Trust","Project","Site Name","Expense Type"].forEach((h,c)=>bbCell(ws,2,c,{t:"s",v:h,s:S.th}));
  for(let c=5;c<=BB_YCOL+1;c+=2){ bbCell(ws,2,c,{t:"s",v:"Budget",s:S.th}); bbCell(ws,2,c+1,{t:"s",v:"Actual",s:S.th}); }
}
function bbWide(){ const cols=[{wch:6},{wch:38},{wch:26},{wch:16},{wch:12}];
  for(let c=5;c<=BB_YCOL+1;c++) cols.push({wch:12}); return cols; }
/* quarter + year roll-up formulas for one row (budget and actual),
   with their computed values cached from `vals` */
function bbRollups(ws,r0,vals,S){
  const R=r0+1;
  BB_QCOL.forEach((c,qi)=>{
    const mc=BB_MCOL.slice(qi*3,qi*3+3);
    bbCell(ws,r0,c,  bbFml(mc.map(x=>bbCol(x)+R).join("+"),S,vals[c]));
    bbCell(ws,r0,c+1,bbFml(mc.map(x=>bbCol(x+1)+R).join("+"),S,vals[c+1]));
  });
  bbCell(ws,r0,BB_YCOL,  bbFml(BB_QCOL.map(x=>bbCol(x)+R).join("+"),S,vals[BB_YCOL]));
  bbCell(ws,r0,BB_YCOL+1,bbFml(BB_QCOL.map(x=>bbCol(x+1)+R).join("+"),S,vals[BB_YCOL+1]));
}

/* one sheet per trust: r4 Salary, r5 Total A, r6 Other, r7 Total B, r8 Total */
function bbTrustSheet(n,S){
  const b=DB.budgets[n.id]||emptyBudget(), m=bbMeta(n);
  const {sal,oth}=bbMonthActuals(n.id);
  const vSal=bbRowVals(b.salaryPlan||[],sal), vOth=bbRowVals(b.otherPlan||[],oth);
  const ws={}, merges=[];
  bbCell(ws,0,0,{t:"s",v:m.trust+" - Budget vs Actual Expense "+BB_FY,s:S.title});
  bbHeadRows(ws,merges,S);
  const line=(r0,type,plans,acts,vals)=>{
    bbCell(ws,r0,1,{t:"s",v:m.trust});
    if(m.objective) bbCell(ws,r0,2,{t:"s",v:m.objective});
    if(m.site)      bbCell(ws,r0,3,{t:"s",v:m.site});
    bbCell(ws,r0,4,{t:"s",v:type});
    FY_MONTHS.forEach((mo,i)=>{
      bbCell(ws,r0,BB_MCOL[i],bbMoney(plans[i]||0));
      if(acts[i]>0) bbCell(ws,r0,BB_MCOL[i]+1,bbMoney(acts[i]));
    });
    bbRollups(ws,r0,vals);
  };
  line(3,"Salary",b.salaryPlan||[],sal,vSal);
  line(5,"Other", b.otherPlan ||[],oth,vOth);
  const sumRow=(r0,srcR,label,sr,vals)=>{
    if(sr!=null) bbCell(ws,r0,0,{t:"n",v:sr});
    bbCell(ws,r0,2,{t:"s",v:label,s:S.lab});
    for(let c=5;c<=BB_YCOL+1;c++) bbCell(ws,r0,c,bbFml("SUM("+bbCol(c)+srcR+")",S.tot,vals[c]));
  };
  sumRow(4,4,"Salary - Total A",1,vSal);
  sumRow(6,6,"Other - Total B",2,vOth);
  bbCell(ws,7,2,{t:"s",v:"Total (A+B)",s:S.lab});
  for(let c=5;c<=BB_YCOL+1;c++) bbCell(ws,7,c,bbFml(bbCol(c)+"5+"+bbCol(c)+"7",S.tot,(vSal[c]||0)+(vOth[c]||0)));
  ws["!merges"]=merges; ws["!cols"]=bbWide();
  ws["!ref"]="A1:"+XLSX.utils.encode_cell({r:7,c:BB_YCOL+1});
  return ws;
}

/* the consolidated All Trusts sheet: 3 rows per trust + grand total */
function bbAllTrustsSheet(list,S){
  const ws={}, merges=[];
  bbCell(ws,0,0,{t:"s",v:"All Partner Trusts - Budget vs Actual Expense "+BB_FY,s:S.title});
  bbHeadRows(ws,merges,S);
  const gv={}; for(let c=5;c<=BB_YCOL+1;c++) gv[c]=0;
  list.forEach((n,i)=>{
    const b=DB.budgets[n.id]||emptyBudget(), m=bbMeta(n), q="'"+m.sheet.replace(/'/g,"''")+"'";
    const {sal,oth}=bbMonthActuals(n.id);
    const vSal=bbRowVals(b.salaryPlan||[],sal), vOth=bbRowVals(b.otherPlan||[],oth);
    const base=3+i*3;                       /* 0-based Salary row */
    const refRow=(r0,srcR,type,vals)=>{
      bbCell(ws,r0,1,{t:"s",v:m.atName});
      if(m.objective) bbCell(ws,r0,2,{t:"s",v:m.objective});
      if(m.site)      bbCell(ws,r0,3,{t:"s",v:m.site});
      bbCell(ws,r0,4,{t:"s",v:type});
      BB_MCOL.forEach(c=>{
        bbCell(ws,r0,c,  bbFml(q+"!"+bbCol(c)+srcR,null,vals[c]));
        bbCell(ws,r0,c+1,bbFml(q+"!"+bbCol(c+1)+srcR,null,vals[c+1]));
      });
      bbRollups(ws,r0,vals);
    };
    bbCell(ws,base,0,{t:"n",v:i+1});
    refRow(base,  4,"Salary",vSal);
    refRow(base+1,6,"Other", vOth);
    /* trust total row: every column = Salary+Other; AL/AM from the trust sheet */
    const tr=base+2, R=base+1;
    bbCell(ws,tr,2,{t:"s",v:m.atName+" - Total",s:S.lab});
    bbCell(ws,tr,4,{t:"s",v:"Total",s:S.lab});
    for(let c=5;c<BB_YCOL;c++) bbCell(ws,tr,c,bbFml(bbCol(c)+R+"+"+bbCol(c)+(R+1),S.tot,(vSal[c]||0)+(vOth[c]||0)));
    bbCell(ws,tr,BB_YCOL,  bbFml(q+"!AL8",S.tot,(vSal[BB_YCOL]||0)+(vOth[BB_YCOL]||0)));
    bbCell(ws,tr,BB_YCOL+1,bbFml(q+"!AM8",S.tot,(vSal[BB_YCOL+1]||0)+(vOth[BB_YCOL+1]||0)));
    for(let c=5;c<=BB_YCOL+1;c++) gv[c]+=(vSal[c]||0)+(vOth[c]||0);
  });
  const gr=3+list.length*3;
  bbCell(ws,gr,2,{t:"s",v:"GRAND TOTAL (All Trusts)",s:S.lab});
  const totRows=list.map((n,i)=>3+i*3+2+1);          /* 1-based trust-total rows */
  for(let c=5;c<=BB_YCOL+1;c++)
    bbCell(ws,gr,c,bbFml(totRows.map(r=>bbCol(c)+r).join("+"),S.grand,gv[c]));
  ws["!merges"]=merges; ws["!cols"]=bbWide();
  ws["!ref"]="A1:"+XLSX.utils.encode_cell({r:gr,c:BB_YCOL+1});
  return ws;
}

/* the front Summary sheet */
function bbSummarySheet(list,S){
  const ws={};
  const merges=[ {s:{r:0,c:0},e:{r:0,c:5}}, {s:{r:1,c:0},e:{r:1,c:5}},
                 {s:{r:3,c:0},e:{r:3,c:2}}, {s:{r:3,c:3},e:{r:3,c:5}} ];
  bbCell(ws,0,0,{t:"s",v:"Partnership Budget Summary — "+BB_FY,s:S.title});
  bbCell(ws,1,0,{t:"s",v:"Front summary · "+BB_FY+" budget · figures in ₹ (exported from the Partnership Dashboard on "+bbToday()+")",s:S.sub});
  bbCell(ws,3,0,{t:"s",v:"Partner NGOs — "+BB_FY,s:S.lab});
  bbCell(ws,3,3,{t:"s",v:BB_FY,s:S.lab});
  ["No.","Name of the Trust","Objective","Salary","Other Exp.","Total"].forEach((h,c)=>bbCell(ws,4,c,{t:"s",v:h,s:S.th}));
  let gSal=0, gOth=0;
  list.forEach((n,i)=>{
    const b=DB.budgets[n.id]||emptyBudget();
    const sB=(b.salaryPlan||[]).reduce((a,x)=>a+(+x||0),0);
    const oB=(b.otherPlan ||[]).reduce((a,x)=>a+(+x||0),0);
    gSal+=sB; gOth+=oB;
    const m=bbMeta(n), q="'"+m.sheet.replace(/'/g,"''")+"'", r=5+i;
    bbCell(ws,r,0,{t:"n",v:i+1});
    bbCell(ws,r,1,{t:"s",v:m.summaryName});
    if(m.objective) bbCell(ws,r,2,{t:"s",v:m.objective});
    bbCell(ws,r,3,bbFml("'All Trusts'!AL"+(4+i*3),null,sB));
    bbCell(ws,r,4,bbFml("'All Trusts'!AL"+(5+i*3),null,oB));
    bbCell(ws,r,5,bbFml(q+"!AL8",null,sB+oB));
  });
  const tr=5+list.length;
  bbCell(ws,tr,1,{t:"s",v:"Grand Total (All "+list.length+" NGOs)",s:S.lab});
  [gSal,gOth,gSal+gOth].forEach((gvv,j)=>{
    const L=["D","E","F"][j];
    bbCell(ws,tr,3+j,bbFml("SUM("+L+"6:"+L+(5+list.length)+")",S.grand,gvv));
  });
  ws["!merges"]=merges;
  ws["!cols"]=[{wch:5},{wch:38},{wch:24},{wch:14},{wch:14},{wch:15}];
  ws["!ref"]="A1:F"+(tr+1);
  return ws;
}

async function exportBudgetBook(){
  const list=bbExportList();
  if(!list.length){ toast("No budgets to export yet — set budget plans (or import the workbook) first"); return; }
  toast("Building the budget workbook…");
  const X=await bbLib(), S=bbStyles();
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,bbSummarySheet(list,S),"Summary");
  X.utils.book_append_sheet(wb,bbAllTrustsSheet(list,S),"All Trusts");
  const used=new Set(["summary","all trusts"]);
  /* trust tabs follow the original workbook's tab order (it can differ from
     the Summary row order) */
  const tabList=list.slice().sort((a,b)=>{
    const ka=(DB.budgets[a.id].book||{}).tabOrder||999, kb=(DB.budgets[b.id].book||{}).tabOrder||999;
    return ka-kb;
  });
  tabList.forEach(n=>{
    let nm=bbMeta(n).sheet, base=nm, k=2;
    while(used.has(nm.toLowerCase())) nm=bbSheetSafe(base.slice(0,27)+" "+(k++));
    used.add(nm.toLowerCase());
    /* NOTE: bbMeta().sheet must resolve to the same name the formulas use —
       duplicates only happen if two NGOs share a short code */
    X.utils.book_append_sheet(wb,bbTrustSheet(n,S),nm);
  });
  X.writeFile(wb,"Partnership Budget "+bbToday()+".xlsx");
  toast("Budget workbook downloaded");
}

/* ---------- import ---------- */
function bbNorm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function bbLev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length; if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(x,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function bbMatchNgo(t){
  const keys=[t.trust,t.summaryName,t.atName,t.sheet].filter(Boolean).map(bbNorm);
  let best=null, bestScore=0;
  DB.ngos.forEach(n=>{
    let score=0;
    [n.name,n.short].filter(Boolean).map(bbNorm).forEach(c=>{
      keys.forEach(k=>{
        if(!k||!c) return;
        if(k===c) score=Math.max(score,100);
        else if(k.length>=5&&c.length>=5&&(k.includes(c)||c.includes(k))) score=Math.max(score,80);
        else if(Math.min(k.length,c.length)>=5&&bbLev(k,c)<=2) score=Math.max(score,60);
      });
    });
    if(score>bestScore){ bestScore=score; best=n; }
  });
  return bestScore>=60?best:null;
}

async function bbParseBook(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const names=wb.SheetNames;
  const find=t=>names.find(s=>s.trim().toLowerCase()===t);
  const sumName=find("summary"), atName=find("all trusts");
  const skip=new Set([sumName,atName].filter(Boolean));
  const cv=(ws,a)=>{ const c=ws[a]; return c?c.v:undefined; };
  /* tie Summary rows to trust sheets through the F-column formula =Sheet!AL8 */
  const sumMeta={};
  if(sumName){
    const sws=wb.Sheets[sumName];
    for(let r=6;r<300;r++){
      const bv=cv(sws,"B"+r); if(bv==null) continue;
      if(/grand total/i.test(String(bv))) break;
      const f=(sws["F"+r]||{}).f||"";
      const mm=f.match(/^=?'?([^'!]+)'?!/);   /* SheetJS stores .f without the leading = */
      if(mm) sumMeta[mm[1].trim().toLowerCase()]={
        summaryName:String(bv).trim(),
        objective:String(cv(sws,"C"+r)||"").trim(),
        order:r-5 };
    }
  }
  /* the trust-name variant used on the All Trusts sheet, via its F refs */
  const atMeta={};
  if(atName){
    const aws=wb.Sheets[atName];
    for(let r=4;r<600;r++){
      const f=(aws["F"+r]||{}).f||"";
      const mm=f.match(/^=?'?([^'!]+)'?!F\d+$/);
      if(mm){ const key=mm[1].trim().toLowerCase();
        if(!atMeta[key]) atMeta[key]=String(cv(aws,"B"+r)||"").trim(); }
    }
  }
  const out=[]; let ord=0, tab=0;
  const num=v=>{ const x=typeof v==="number"?v:parseFloat(String(v??"").replace(/[^0-9.\-]/g,"")); return isNaN(x)?0:x; };
  names.forEach(sn=>{
    if(skip.has(sn)) return;
    const ws=wb.Sheets[sn];
    /* finalized trust-sheet layout: row 4 = Salary, row 6 = Other */
    if(String(cv(ws,"E4")||"").trim().toLowerCase()!=="salary") return;
    if(String(cv(ws,"E6")||"").trim().toLowerCase()!=="other")  return;
    const readRow=R=>BB_MCOL.map(c=>num(cv(ws,bbCol(c)+R)));
    const sal=readRow(4), oth=readRow(6);
    const key=sn.trim().toLowerCase(), sm=sumMeta[key]||{};
    out.push({ sheet:sn,
      trust:String(cv(ws,"B4")||cv(ws,"B6")||sn).trim(),
      objective:sm.objective||String(cv(ws,"C4")||"").trim(),
      site:String(cv(ws,"D4")||"").trim(),
      summaryName:sm.summaryName||"", atName:atMeta[key]||"",
      /* the Summary row order drives Summary/All Trusts rows; the workbook
         tab order can differ, so keep both for a faithful round-trip */
      order:sm.order!=null?sm.order:(++ord)+1000,
      tabOrder:++tab,
      salaryPlan:sal, otherPlan:oth,
      salTotal:sal.reduce((a,c)=>a+c,0), othTotal:oth.reduce((a,c)=>a+c,0) });
  });
  out.sort((a,b)=>a.order-b.order);
  return out;
}

async function bbPreviewImport(){
  const f=el("bbFile")&&el("bbFile").files[0]; if(!f) return;
  let trusts=null;
  try{ trusts=await bbParseBook(f); }catch(e){ console.error(e); }
  const box=el("bbPrev");
  if(!trusts||!trusts.length){
    box.innerHTML='<div class="fbanner amber">Couldn&rsquo;t read any trust sheets in the finalized layout (row 4 = Salary, row 6 = Other). Check the file and try again.</div>';
    el("bbApplyBtn").disabled=true; return;
  }
  window._bbImport=trusts;
  const matches=trusts.map(t=>bbMatchNgo(t));
  const opts=def=>['<option value="__skip"'+(def==="__skip"?" selected":"")+'>— skip —</option>',
    '<option value="__create"'+(def==="__create"?" selected":"")+'>➕ create as new NGO</option>']
    .concat(DB.ngos.map(n=>`<option value="${n.id}" ${def===n.id?'selected':''}>${esc(n.short)} — ${esc(n.name)}</option>`)).join("");
  const rows=trusts.map((t,i)=>{
    const m=matches[i], def=m?m.id:"__create";
    return `<tr>
      <td style="padding:5px 8px">${i+1}</td>
      <td style="padding:5px 8px"><b>${esc(t.trust)}</b><br><span style="font-size:11px;color:var(--ink-3)">sheet: ${esc(t.sheet)}</span></td>
      <td style="padding:5px 8px;text-align:right">${fmtRs(t.salTotal)}</td>
      <td style="padding:5px 8px;text-align:right">${fmtRs(t.othTotal)}</td>
      <td style="padding:5px 8px;text-align:right"><b>${fmtRs(t.salTotal+t.othTotal)}</b></td>
      <td style="padding:5px 8px"><select id="bbMap${i}" class="sel-inp" style="max-width:220px">${opts(def)}</select>
        ${m?'':'<div style="color:var(--amber);font-size:11px;margin-top:2px">no matching NGO — will be created</div>'}</td>
    </tr>`; }).join("");
  const grand=trusts.reduce((a,t)=>a+t.salTotal+t.othTotal,0);
  const inBook=new Set(matches.filter(Boolean).map(n=>n.id));
  const outside=DB.ngos.filter(n=>!inBook.has(n.id));
  box.innerHTML=`
    <div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px">
      <table style="border-collapse:collapse;width:100%;font-size:12.5px">
        <tr style="position:sticky;top:0;background:var(--bg-2);font-weight:700">
          <td style="padding:6px 8px">#</td><td style="padding:6px 8px">Trust (workbook)</td>
          <td style="padding:6px 8px;text-align:right">Salary</td><td style="padding:6px 8px;text-align:right">Other</td>
          <td style="padding:6px 8px;text-align:right">Total</td><td style="padding:6px 8px">Save to NGO</td></tr>
        ${rows}
      </table>
    </div>
    <div style="margin-top:10px;font-size:12.5px">Workbook grand total: <b>${fmtRsFull(grand)}</b> across ${trusts.length} trusts.
      Existing budget plans for the selected NGOs will be <b>replaced</b> (a backup of the previous plans is kept).</div>
    ${outside.length?`<div class="hint" style="margin-top:6px">In the app but not in this workbook (budgets kept unchanged; excluded from the export): ${outside.map(n=>esc(n.short)).join(", ")}</div>`:''}`;
  el("bbApplyBtn").disabled=false;
}

async function bbApplyImport(){
  const data=window._bbImport; if(!data||!data.length) return;
  /* keep a one-shot backup of the previous plans (restorable from a JSON backup too) */
  try{ DB.meta.budgetsBackup={at:TODAY_ISO, by:ME?ME.name:"—", data:JSON.parse(JSON.stringify(DB.budgets))}; }catch(e){}
  let applied=0, created=0;
  data.forEach((t,i)=>{
    const sel=el("bbMap"+i), v=sel?sel.value:"__skip";
    if(v==="__skip") return;
    let ngoId=v;
    if(v==="__create"){
      const rec={ id:genId("n"), name:t.trust, short:bbSheetSafe(t.sheet).slice(0,18)||t.trust.slice(0,18),
                  state:"—", vertical:/educat/i.test(t.objective)?"Education":"Livelihood",
                  lead:"—", since:TODAY_ISO.slice(0,7), partnership:"Active" };
      DB.ngos.push(rec); ngoId=rec.id; created++;
    }
    const monthlyPlan=FY_MONTHS.map((m,j)=>(t.salaryPlan[j]||0)+(t.otherPlan[j]||0));
    const salSum=t.salTotal, othSum=t.othTotal;
    const prev=DB.budgets[ngoId];
    const annual={}; BUDGET_CATS.forEach(c=>annual[c]=0);
    annual.Salary=salSum;
    const exNon=prev&&prev.annual?BUDGET_CATS.filter(c=>c!=="Salary").reduce((a,c)=>a+(+prev.annual[c]||0),0):0;
    if(exNon>0) BUDGET_CATS.filter(c=>c!=="Salary").forEach(c=>annual[c]=Math.round((+prev.annual[c]||0)/exNon*othSum));
    else annual.Programme=othSum;
    DB.budgets[ngoId]={ annual, totalAnnual:salSum+othSum, monthlyPlan,
      salaryPlan:t.salaryPlan, otherPlan:t.otherPlan,
      book:{ order:i+1, tabOrder:t.tabOrder||i+1, sheet:t.sheet, trust:t.trust,
             summaryName:t.summaryName||t.trust, atName:t.atName||t.trust,
             objective:t.objective||"", site:t.site||"" },
      editedBy:ME?ME.name:"—", editedAt:TODAY_ISO };
    applied++;
  });
  await saveDB(); closeModal(); render();
  toast("Imported budgets for "+applied+" NGO(s)"+(created?" · created "+created+" new NGO record(s)":""));
}

function ngoDebitsTab(ngoId){
  const n = ngoById(ngoId);
  const all = DB.debits.filter(d=>d.ngoId===ngoId);
  const total = all.reduce((s,d)=>s+d.amount,0);

  // category breakdown
  const byCat = {};
  BUDGET_CATS.forEach(c=>byCat[c]=0);
  all.forEach(d=>{ byCat[d.category]=(byCat[d.category]||0)+d.amount; });

  // month-wise breakdown
  const byMonth = FY_MONTHS.map(m=>{
    const rows = all.filter(d=>d.month===m);
    return {m, total:rows.reduce((s,d)=>s+d.amount,0), count:rows.length};
  });
  const maxMonth = Math.max(...byMonth.map(x=>x.total),1);

  const catColor = {Salary:"violet",Travel:"green",Programme:"blue","Other":"amber"};

  return `
  <div class="sec-head">
    <h2>Debit Notes</h2>
    <div class="sh-act">${canEditNgo(ngoId)?`<button class="btn accent sm" onclick="openDebitForm('${jsArg(ngoId)}')">+ Upload debit note</button>`:''}</div>
  </div>

  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card">
      <div class="stat-ico blue">₹</div>
      <div><div class="stat-l">Total Logged</div>
        <div class="stat-v">${fmtRs(total)}</div>
        <div class="stat-sub">${all.length} debit note${all.length===1?'':'s'}</div></div>
    </div>
    ${BUDGET_CATS.slice(0,3).map(c=>`
    <div class="stat-card">
      <div class="stat-ico ${catColor[c]||'blue'}">●</div>
      <div><div class="stat-l">${esc(c)}</div>
        <div class="stat-v">${fmtRs(byCat[c]||0)}</div>
        <div class="stat-sub">${pct(byCat[c]||0,total)}% of spend</div></div>
    </div>`).join("")}
  </div>

  <div class="grid-2" style="align-items:start;margin-bottom:16px">
    <div class="panel">
      <div class="panel-h"><h3>Month-wise expense</h3><span class="note">debit notes logged per month</span></div>
      <div class="panel-b">
        <div class="barchart" style="height:140px">
          ${byMonth.map(x=>`
            <div class="col">
              <div class="stack">
                <div class="seg" style="height:${x.total/maxMonth*100}%;background:var(--${x.m===CUR_MONTH?'accent':'blue'})"
                     title="${monthLabel(x.m)}: ${fmtRsFull(x.total)} (${x.count} notes)"></div>
              </div>
              <div class="lbl" style="${x.m===CUR_MONTH?'color:var(--accent)':''}">${monthLabel(x.m).split(" ")[0]}</div>
            </div>`).join("")}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Expense-wise breakdown</h3><span class="note">by category</span></div>
      <div class="panel-b">

/* document add / edit — records a compliance document and an optional Drive link */
const DOC_TYPES = ["MoU","Annual Proposal","Approved Budget","12A Certificate",
                   "80G Certificate","FCRA Certificate","Audited Financials","Other"];

/* =====================================================================
   TEAM MBO · IMPORT PARSING
   The leads' spreadsheets stack one month block per section, and the
   column order changes between blocks in the same file. Everything here
   is pure so it can be tested without a browser — see tests/parse.test.js.
   ===================================================================== */

const TM_MONTHS = ["january","february","march","april","may","june",
                   "july","august","september","october","november","december"];

function tmNormStatus(raw){
  const s = String(raw==null?"":raw).toLowerCase().replace(/\s+/g,"");
  if(!s) return "";
  if(s.startsWith("done") || s.startsWith("complete")) return "Done";
  if(s.includes("progress")) return "In Progress";
  /* "note done" is a real typo for "not done" in a live file */
  if(s.startsWith("not") || s.startsWith("note")) return "Not Done";
  return "";
}

/* Excel day 1 is 1900-01-01, with the well-known 1900 leap-year fudge,
   which makes day 0 equal 1899-12-30. */
function tmSerialToIso(n){
  const ms = Date.UTC(1899,11,30) + Math.round(n) * 86400000;
  return new Date(ms).toISOString().slice(0,10);
}

function tmIsoOf(y,m,d){
  if(m<1 || m>12 || d<1 || d>31) return "";
  const dt = new Date(Date.UTC(y,m-1,d));
  /* rejects 31 April and friends — the Date would roll into the next month */
  if(dt.getUTCMonth() !== m-1 || dt.getUTCDate() !== d) return "";
  return dt.toISOString().slice(0,10);
}

const TM_ORDINALS = { first:1, second:2, third:3, fourth:4, fifth:5 };

/* "First week of Jan", "2nd week of Feb" — one lead writes every deadline
   this way. Read as the LAST day of that week, because a deadline is the
   point by which the work is due: the first week of January means by the
   7th. A fifth week runs to the end of the month, whatever its length. */
function tmWeekOfMonth(text, defaultYear){
  const s = String(text==null?"":text).trim();
  const m = /^(\d)(?:st|nd|rd|th)?\s+week\s+of\s+([A-Za-z]+)\.?(?:\s+(\d{4}))?$/i.exec(s)
         || /^([A-Za-z]+)\s+week\s+of\s+([A-Za-z]+)\.?(?:\s+(\d{4}))?$/i.exec(s);
  if(!m) return "";

  const week = /^\d$/.test(m[1]) ? +m[1] : TM_ORDINALS[m[1].toLowerCase()];
  if(!week || week < 1 || week > 5) return "";

  const mi = TM_MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase().slice(0,3)));
  if(mi < 0) return "";

  const year = m[3] ? +m[3] : defaultYear;
  if(!year) return "";

  if(week === 5){
    /* last day of the month — day 0 of the next month */
    const last = new Date(Date.UTC(year, mi + 1, 0)).getUTCDate();
    return tmIsoOf(year, mi + 1, last);
  }
  return tmIsoOf(year, mi + 1, week * 7);
}

/* defaultYear is the year of the block the row sits in. One real file writes
   deadlines as "20th June" with no year at all; without a year to fall back
   on such a cell stays unreadable rather than being guessed. A year written
   in the cell always wins. */
function tmParseDate(cell, defaultYear){
  if(cell==null) return "";
  if(typeof cell === "number" && cell > 20000 && cell < 80000) return tmSerialToIso(cell);
  const s = String(cell).trim();
  if(!s || s === "-") return "";

  /* a serial that arrived as text, e.g. "45884.0" */
  if(/^\d{4,5}(\.0+)?$/.test(s)){
    const n = parseFloat(s);
    if(n > 20000 && n < 80000) return tmSerialToIso(n);
  }
  /* yyyy-mm-dd, as a spreadsheet exported from Google Sheets often gives */
  let m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(s);
  if(m) return tmIsoOf(+m[1], +m[2], +m[3]);

  /* d/m/yyyy or d-m-yyyy — day first */
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);
  if(m) return tmIsoOf(+m[3], +m[2], +m[1]);

  /* "28th Feb 2026", "31th July 2026", "30 June 2026" */
  m = /^(\d{1,2})\s*(?:st|nd|rd|th)?\s+([A-Za-z]+),?\s+(\d{4})$/.exec(s);
  if(m){
    const mi = TM_MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase().slice(0,3)));
    if(mi >= 0) return tmIsoOf(+m[3], mi+1, +m[1]);
  }
  /* "August 15 2026" */
  m = /^([A-Za-z]+)\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})$/.exec(s);
  if(m){
    const mi = TM_MONTHS.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0,3)));
    if(mi >= 0) return tmIsoOf(+m[3], mi+1, +m[2]);
  }

  /* "First week of Jan", "2nd week of Feb" */
  const wk = tmWeekOfMonth(s, defaultYear);
  if(wk) return wk;

  /* no year in the cell — take it from the block, e.g. "20th June" */
  if(defaultYear){
    m = /^(\d{1,2})\s*(?:st|nd|rd|th)?\s+([A-Za-z]+)\.?$/.exec(s);
    if(m){
      const mi = TM_MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase().slice(0,3)));
      if(mi >= 0) return tmIsoOf(defaultYear, mi+1, +m[1]);
    }
    m = /^([A-Za-z]+)\s+(\d{1,2})(?:st|nd|rd|th)?$/.exec(s);
    if(m){
      const mi = TM_MONTHS.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0,3)));
      if(mi >= 0) return tmIsoOf(defaultYear, mi+1, +m[2]);
    }
  }
  return "";
}

/* Some deadlines are already wrong in the source file: a lead typed
   "10/3/2026" meaning 10 March and Excel stored 3 October. Swap back only
   when the evidence is unambiguous — the day equals the block's month
   number, and swapping lands the date inside the block's month. Validated
   against every such date in two real files with no counter-examples. */
function tmRepairDate(iso, blockMonth){
  if(!iso || !blockMonth) return { iso: iso||"", fixed:false };
  const y = +iso.slice(0,4), m = +iso.slice(5,7), d = +iso.slice(8,10);
  if(m === blockMonth) return { iso, fixed:false };
  if(d !== blockMonth)  return { iso, fixed:false };
  const swapped = tmIsoOf(y, d, m);
  if(!swapped) return { iso, fixed:false };
  return { iso: swapped, fixed:true };
}

const TM_COLS = {
  timeEst:   ["timeestimate"],
  timeSpent: ["timespent"],
  objective: ["objective","goal"],
  /* "action" alone is a real header; so is "Action Item" and "July Action
     Item". Which of these counts is decided per sheet — see tmColMap. */
  title:     ["keyresult","keyresults","kr","activity","deliverable",
              "actionitem","action","actionpoint","task"],
  deadline:  ["deadline","timeline","when","targetdate","duedate"],
  status:    ["status"],
  priority:  ["priority"],
  comment:   ["comment","notes","remark"],
  /* "resourse" is a real misspelling in a live file */
  ref:       ["reference","resource","resourse"],
  owner:     ["whom","bywhom","who"],
  objNum:    ["srno","srnumber","no","sl","slno"]
};

/* Two passes: exact header matches first, then substring matches for headers
   carrying extra words ("July Action Item"). Without the exact-first pass,
   a substring match on a differently ordered sheet can capture the wrong
   column — which is the whole failure this per-block mapping exists to stop. */
function tmColMap(cells, kind){
  const map = {};
  const norm = raw => String(raw==null?"":raw).toLowerCase().replace(/[^a-z]/g,"");

  /* Which words may name the title column depends on the sheet. Without
     this, a key-result sheet that also has a column called "Action" would
     hand the title to it instead of to "Key result". */
  const cols = {};
  Object.keys(TM_COLS).forEach(k=>{ cols[k] = TM_COLS[k]; });
  if(kind === "kr")          cols.title = ["keyresult","keyresults","kr","activity","deliverable"];
  /* "Activity" heads the column on one real action sheet and the key-result
     column on another, so it belongs to both */
  else if(kind === "action") cols.title = ["actionitem","action","actionpoint","task","activity"];

  (cells||[]).forEach((raw, i) => {
    const n = norm(raw);
    if(!n) return;
    for(const field of Object.keys(cols)){
      if(map[field] !== undefined) continue;
      if(cols[field].some(x => n === x)){ map[field] = i; return; }
    }
  });
  (cells||[]).forEach((raw, i) => {
    const n = norm(raw);
    if(!n) return;
    if(Object.keys(map).some(f => map[f] === i)) return;
    for(const field of Object.keys(cols)){
      if(map[field] !== undefined) continue;
      /* Short tokens are exact-match only. "no" (from "Sr. No") is a
         substring of "Not Done", which made a data row look like a header
         row and swallowed the block it belonged to. */
      if(cols[field].some(x => x.length >= 4 && n.includes(x))){ map[field] = i; return; }
    }
  });
  return map;
}

function tmRowCells(row){ return Array.isArray(row) ? row : []; }
function tmNonEmpty(row){
  return tmRowCells(row).filter(c => c!=null && String(c).trim() !== "");
}

/* Find each month block: its heading, its own header row, and its row range.
   kind is "kr" (key results) or "action" (action items). */
/* Which month a heading names, or -1. Deliberately NOT \b: real headings are
   written "MBO_Some Name_September 2026" and "..._November_ 2025", and \b
   treats an underscore as a word character, so \bseptember\b never matches
   after one. */
function tmMonthIndex(text){
  const s = String(text==null?"":text);
  return TM_MONTHS.findIndex(mn =>
    new RegExp("(^|[^a-z])" + mn + "($|[^a-z])", "i").test(s));
}

/* Read a heading row into {month, year} or null.
   A heading is identified by its FIRST populated cell — that is what
   separates a real heading from a data row whose Comment column happens to
   read "...will send MBO by 5 January 2026". A real heading may still carry
   a stray jotting off to the right, so a small number of extra cells is
   tolerated; requiring exactly one silently swallowed a whole month. */
/* A month heading is short — the longest real one seen is 35 characters
   ("MBO_Some Name_November_ 2025"). A key result, by contrast, is a
   sentence, and one reading "...for MNREGA by March 2027" was being taken
   as the start of a new month, ending its block early and silently dropping
   every row beneath it. */
const TM_HEADING_MAX_CHARS = 60;

function tmReadHeading(row, kind){
  const cells = tmNonEmpty(row);
  if(!cells.length || cells.length > 3) return null;
  const first = cells[0];
  const text = String(first).trim();
  if(text.length > TM_HEADING_MAX_CHARS) return null;

  const mi = tmMonthIndex(text);
  if(mi >= 0){
    /* A key-result heading must carry a year. It used to have to say "MBO"
       too, but a third real file heads its blocks with a bare "June 2026".
       What keeps a data row from passing as a heading is not the word MBO —
       it is the cell-count limit above plus the header row that has to
       follow within three rows. */
    const yearM = /(^|[^0-9])(20\d{2})($|[^0-9])/.exec(text);
    if(kind === "kr" && !yearM) return null;
    return { month: mi + 1, year: yearM ? +yearM[2] : null };
  }

  /* a numeric heading: "06/2026" or "6-2026" */
  const numM = /^(0?[1-9]|1[0-2])\s*[\/\-.]\s*(20\d{2})$/.exec(text);
  if(numM) return { month: +numM[1], year: +numM[2] };

  /* One real action sheet divides its months with a bare Excel date instead
     of a month name. Only accept this on action sheets, where the row is a
     lone value and a header still has to follow. */
  if(kind === "action" && cells.length === 1){
    const iso = tmParseDate(first);
    if(iso) return { month: +iso.slice(5,7), year: +iso.slice(0,4) };
  }
  return null;
}

/* A header row names several columns. Matching on the title word alone is
   not enough: a key result reading "First key result" contains "key result"
   and would abort the block it belongs to. Require the row to map a title
   column AND at least two more known labels — a data row never does. */
/* A header row names several columns, one of them the title. There is no
   separate word test: tmColMap only sets `title` when a cell actually
   matched one of this sheet kind's title labels, so re-testing the text
   would just be a second, staler copy of that list — which is how "KR" came
   to be accepted as a column but rejected as a header.

   The three-label floor is what keeps a data row out: a key result reading
   "Write the first key result" matches the title label, but a real row never
   also matches two more column names. */
function tmIsHeaderRow(row, kind){
  const map = tmColMap(tmRowCells(row), kind);
  if(map.title === undefined) return false;
  return Object.keys(map).length >= 3;
}

/* Does a header row sit within the next three rows of `i`? Used both to
   confirm a heading starts a block and to confirm one ends the previous
   block, so the two rules cannot drift apart. */
function tmHasHeaderNear(rows, i, kind){
  for(let j = i + 1; j <= Math.min(i + 3, rows.length - 1); j++){
    if(tmIsHeaderRow(rows[j], kind)) return true;
  }
  return false;
}

/* The year written into a sheet's name: "MBO 2026" -> 2026,
   "OKR 2025-26" -> 2025. Used as a last resort for a file that names its
   months but never its years. */
function tmSheetYear(name){
  const m = /(20\d{2})/.exec(String(name==null?"":name));
  return m ? +m[1] : null;
}

/* Does this header row name the month itself — "March (Key Results)" — with
   no heading row above it? One real file is laid out entirely this way. */
function tmHeaderMonth(row, kind){
  const map = tmColMap(tmRowCells(row), kind);
  if(map.title === undefined) return -1;
  return tmMonthIndex(String(tmRowCells(row)[map.title] || ""));
}

function tmFindBlocks(rows, kind){
  const isHeaderRow = row => tmIsHeaderRow(row, kind);
  const blocks = [];
  let lastHeaderAbove = -1;

  for(let i = 0; i < (rows||[]).length; i++){
    /* Remember any header seen on the way down: one real sheet puts a single
       header at the very top and then divides months beneath it. */
    if(isHeaderRow(rows[i])) lastHeaderAbove = i;

    const head = tmReadHeading(rows[i], kind);
    if(!head) continue;

    /* Prefer a header just below the heading; otherwise reuse the one above.
       Without a header either way, this was prose, not a heading. */
    let headerRow = -1;
    for(let j = i + 1; j <= Math.min(i + 3, rows.length - 1); j++){
      if(isHeaderRow(rows[j])){ headerRow = j; break; }
    }
    if(headerRow === -1) headerRow = lastHeaderAbove;
    if(headerRow === -1) continue;

    /* Rows run from just after the heading (or the header, whichever is
       lower) until a blank row, the next real heading, or a header row.

       "Real heading" means one that would actually START a block — heading
       text AND a header row following it. Testing only tmReadHeading here
       made ending a block easier than starting one, so a row that could
       never have begun a block could still terminate one. */
    const firstRow = Math.max(headerRow, i) + 1;
    const map = tmColMap(tmRowCells(rows[headerRow]), kind);
    /* Text sitting in THIS block's own title column makes a row a data row,
       whatever else it says. That is what separates a key result reading
       "...by March 2027" from a heading reading "March 2027": the heading
       has nothing in the title column. Length and month-name tests both
       failed on real data; column position does not. */
    const isDataRow = row =>
      map.title !== undefined &&
      String(tmRowCells(row)[map.title] || "").trim() !== "" &&
      /* A lone value is a divider, not a row — one real action sheet marks
         each month with a bare date that lands in the title column. A data
         row always carries something besides its title. */
      tmNonEmpty(row).length > 1;

    let lastRow = firstRow - 1;
    for(let j = firstRow; j < rows.length; j++){
      if(tmNonEmpty(rows[j]).length === 0) break;
      if(isHeaderRow(rows[j])) break;
      /* Not tmHasHeaderNear() here: one real action sheet carries a single
         header at the very top and divides months beneath it, so its later
         dividers have no header following them. isDataRow is what does the
         work — a heading never has text in the title column. */
      if(!isDataRow(rows[j]) && tmReadHeading(rows[j], kind)) break;
      lastRow = j;
    }
    if(lastRow < firstRow) continue;

    blocks.push({
      month: head.month,
      year: head.year,
      headerRow,
      firstRow,
      lastRow
    });
    i = lastRow;
  }

  /* Only if nothing was found the normal way: a file whose header rows name
     their own month — "March (Key Results)" — and which has no heading rows
     at all. Kept as a fallback rather than a competing rule, because plenty
     of ordinary headers mention a month ("July Action Item") and would
     otherwise swallow the sheet in one block. */
  if(!blocks.length) return tmFindInlineMonthBlocks(rows, kind);
  return blocks;
}

function tmFindInlineMonthBlocks(rows, kind){
  const blocks = [];
  for(let i = 0; i < (rows||[]).length; i++){
    if(!tmIsHeaderRow(rows[i], kind)) continue;
    const month = tmHeaderMonth(rows[i], kind);
    if(month < 0) continue;

    const map = tmColMap(tmRowCells(rows[i]), kind);
    const titleCell = String(tmRowCells(rows[i])[map.title] || "");
    const yearM = /(^|[^0-9])(20\d{2})($|[^0-9])/.exec(titleCell);

    let last = i;
    for(let j = i + 1; j < rows.length; j++){
      if(tmNonEmpty(rows[j]).length === 0) break;
      if(tmIsHeaderRow(rows[j], kind)) break;
      last = j;
    }
    if(last === i) continue;

    blocks.push({ month: month + 1, year: yearM ? +yearM[2] : null,
                  headerRow: i, firstRow: i + 1, lastRow: last });
    i = last;
  }
  return blocks;
}

function tmCell(row, map, field){
  const i = map[field];
  if(i === undefined) return "";
  const v = tmRowCells(row)[i];
  return v==null ? "" : String(v).trim();
}
function tmRawCell(row, map, field){
  const i = map[field];
  if(i === undefined) return null;
  const v = tmRowCells(row)[i];
  return v==null ? null : v;
}
function tmPad(n){ return (n<10?"0":"") + n; }

/* Which sheets are worth reading. One real workbook keeps four stale draft
   copies of months that also live on the MBO sheet ("Sheet9", "Print"…);
   reading those would silently double those months. Only sheets that name
   themselves are trusted — anything else is skipped and reported. */
function tmSheetKind(name){
  const n = String(name==null?"":name);
  /* a to-do list is a different artefact and is deliberately not imported */
  if(/to\s*do/i.test(n)) return null;
  if(/action/i.test(n)) return "action";
  /* leads name this sheet MBO, OKR, OKRs or KRA */
  if(/(^|[^a-z])(mbo|okrs?|kra)($|[^a-z])/i.test(n)) return "kr";
  return null;
}

/* Read every month block on every named sheet into teamMbo records.
   sheets: [{ name, cells }] where cells is an array of row arrays.
   Returns { rows, months, flags } — flags are surfaced in the preview so
   nothing is repaired, skipped or dropped without the user seeing it. */
function tmReadSheets(sheets, ownerId, batchId, todayIso){
  const rows = [], flags = [], monthSet = {}, seen = [];

  /* V77.4: when no sheet is named MBO/OKR/Action Items, read any sheet
     that is laid out like an MBO (e.g. a file with just "Sheet1") */
  const anyNamed = (sheets||[]).some(sh => tmSheetKind(sh.name));
  (sheets||[]).forEach(sheet => {
    const kind = tmSheetKind(sheet.name) || (!anyNamed && tmFindBlocks(sheet.cells||[], "kr").length ? "kr" : null);
    const cells = sheet.cells || [];
    /* Recorded for every sheet, read or not, so a file that yields nothing
       can still show the user what was looked at and why it was passed
       over — otherwise a new layout is just a dead end. */
    seen.push({ name: sheet.name, kind: kind,
                blocks: kind ? tmFindBlocks(cells, kind).length : 0,
                rows: (cells||[]).length });

    if(!kind){
      /* say so only if it actually looked like it held MBO data, so a
         genuinely unrelated tab does not clutter the preview */
      if(tmFindBlocks(cells, "kr").length || tmFindBlocks(cells, "action").length){
        flags.push({ kind:"skippedsheet", month:null, title:"(a sheet)",
                     detail:`sheet "${sheet.name}" looks like it holds MBO rows but is not named `
                          + `"MBO" or "Action Items", so it was skipped — usually an old draft copy` });
      }
      return;
    }

    /* blocks run in date order down the sheet, so an undated heading can
       take its year from the block above it */
    let prevMonth = null, prevYear = null;

    tmFindBlocks(cells, kind).forEach(block => {
      const map = tmColMap(tmRowCells(cells[block.headerRow]), kind);
      if(map.title === undefined) return;

      let year = block.year;
      /* first try a date actually written inside the block */
      if(year === null){
        for(let r = block.firstRow; r <= block.lastRow; r++){
          const iso = tmParseDate(tmRawCell(cells[r], map, "deadline"));
          if(iso){ year = +iso.slice(0,4); break; }
        }
      }
      /* then fall back to the preceding block, rolling the year over when
         the month steps backwards (December → January) */
      if(year === null && prevYear !== null){
        year = block.month < prevMonth ? prevYear + 1 : prevYear;
      }
      /* last resort, the year in the sheet's own name — one real file names
         its months but never its years, and carries no dates either */
      if(year === null) year = tmSheetYear(sheet.name);
      if(year === null){
        flags.push({ kind:"noyear", month:null, title:"(a block heading)",
                     detail:`a ${TM_MONTHS[block.month-1]} block on "${sheet.name}" gives no year, `
                          + `no row in it has a readable date, and nothing precedes it — skipped` });
        return;
      }
      prevMonth = block.month; prevYear = year;

      const month = year + "-" + tmPad(block.month);
      let lastObjective = "", lastObjNum = "";

      for(let r = block.firstRow; r <= block.lastRow; r++){
        const row = cells[r];
        const title = tmCell(row, map, "title");
        if(!title) continue;

        const objRaw = tmCell(row, map, "objective");
        if(objRaw) lastObjective = objRaw;
        /* Sr numbers are written "1", "1.0" and even "4..". Parse as a number
           and keep the whole part — stripping non-digits would turn "1.0"
           into "10". */
        const numVal = parseFloat(tmCell(row, map, "objNum"));
        if(isFinite(numVal)) lastObjNum = String(Math.trunc(numVal));

        const rawDeadline = tmRawCell(row, map, "deadline");
        /* the block's year fills in for a deadline written without one */
        const parsed = tmParseDate(rawDeadline, year);
        const rep = tmRepairDate(parsed, block.month);

        const priRaw = tmCell(row, map, "priority");
        const priNum = /^\d+(\.0+)?$/.test(priRaw) ? parseInt(priRaw, 10) : null;
        const band = priNum === null && priRaw
          ? (/^h/i.test(priRaw) ? "High"
            : /^(mid|m)/i.test(priRaw) ? "Medium"
            : /^l/i.test(priRaw) ? "Low" : "")
          : "";

        const rec = {
          id: genId("tmbo"),
          ownerId: ownerId,
          month: month,
          type: kind,
          objNum: lastObjNum || "1",
          objective: kind === "action" ? "" : lastObjective,
          title: title,
          deadline: rep.iso,
          deadlineRaw: rawDeadline==null ? "" : String(rawDeadline).trim(),
          deadlineFixed: rep.fixed,
          rank: priNum,
          band: band,
          status: tmNormStatus(tmCell(row, map, "status")),
          timeEst: tmCell(row, map, "timeEst"),
          timeSpent: tmCell(row, map, "timeSpent"),
          comment: tmCell(row, map, "comment"),
          ref: tmCell(row, map, "ref"),
          importedAt: todayIso,
          importBatch: batchId
        };

        if(rep.fixed){
          flags.push({ kind:"repaired", month:month, title:title,
                       detail:`read as ${parsed}, corrected to ${rep.iso}` });
        } else if(rec.deadlineRaw && rec.deadlineRaw !== "-" && !rec.deadline){
          flags.push({ kind:"baddate", month:month, title:title,
                       detail:`could not read "${rec.deadlineRaw}"` });
        } else if(rec.deadline && Math.abs(+rec.deadline.slice(0,4) - year) > 5){
          flags.push({ kind:"wildyear", month:month, title:title,
                       detail:`year ${rec.deadline.slice(0,4)} is far from ${year} — check for a typo` });
        }

        monthSet[month] = true;
        rows.push(rec);
      }
    });
  });

  return { rows: rows, months: Object.keys(monthSet).sort(), flags: flags, seen: seen };
}

/* Their file holds every month, so the same file gets uploaded repeatedly.
   Drop this owner's rows for the months the file covers, then add the new
   ones — otherwise the list doubles on every upload. */
function tmReplaceMonths(existing, ownerId, months, incoming){
  const drop = {};
  (months||[]).forEach(m=>{ drop[m] = true; });
  /* V74: an action item added in the app is not in the sheet — keep it */
  const kept = (existing || []).filter(r =>
    !(r && r.ownerId === ownerId && drop[r.month] && r.source !== "app"));
  return kept.concat(incoming || []);
}

/* =====================================================================
   TEAM MBO · URGENCY
   ===================================================================== */

/* Live work first, then the historical backlog, then finished work.
   The split at 30 days is deliberate: across the two real workbooks only 5
   of 87 outstanding items were late by a month or less, and the oldest was
   398 days. A single "Overdue" heading reading 87 buries the handful that
   still need action. Nothing is hidden — the backlog is its own heading. */
const TM_BUCKETS = [
  { key:"overdue", label:"⚠ Overdue" },
  { key:"week",    label:"This week" },
  { key:"soon",    label:"Next 3 weeks" },
  { key:"later",   label:"Later" },
  { key:"undated", label:"No deadline given" },
  { key:"stale",   label:"Overdue more than a month" },
  { key:"done",    label:"Done" }
];
const TM_STALE_AFTER_DAYS = 30;

function tmDaysLate(rec, todayIso){
  if(!rec || !rec.deadline) return 0;
  return Math.round((new Date(todayIso+"T00:00:00Z") - new Date(rec.deadline+"T00:00:00Z")) / 86400000);
}

/* First match wins, and "done" is checked first so a completed item never
   shows up as overdue and an undated completed item lands in Done. */
function tmBucket(rec, todayIso){
  if(!rec) return "undated";
  if(rec.status === "Done") return "done";
  if(!rec.deadline) return "undated";
  const late = tmDaysLate(rec, todayIso);
  if(late > TM_STALE_AFTER_DAYS) return "stale";
  if(late > 0)    return "overdue";
  if(late >= -6)  return "week";
  if(late >= -27) return "soon";
  return "later";
}

/* shared with docsNavCount() so the "expiring soon" window (180 days,
   6 months) is defined in exactly one place */
function docExpiryDays(d){ return Math.round((new Date(d.expires)-new Date(TODAY_ISO))/86400000); }
function isDocExpiringSoon(d){ return !!d.expires && docExpiryDays(d)<180; }
function docsExpiringCount(ngoIds){
  return (DB.documents||[]).filter(d=>ngoIds.has(d.ngoId) && isDocExpiringSoon(d)).length;
}

/* =====================================================================
   INLINE SVG CHART HELPERS
   ===================================================================== */
function svgGroupedBars(rows, seriesNames, colors, money){
  const W=720, H=240, padL=58, padB=34, padT=16, padR=14;
  const plotW=W-padL-padR, plotH=H-padB-padT;
  const maxV = niceMax(Math.max(1, ...rows.flatMap(r=>r.series)));
  const groups = rows.length;
  const gw = plotW/groups;
  const barW = Math.min(14, gw/(seriesNames.length+1.4));
  const ticks=4;
  const fmtV = money? (v=>fmtRs(v)) : (v=>fmtN(v));
  const fmtFull = money? (v=>fmtRsFull(v)) : (v=>fmtN(v));
  const key = "gbars_"+Math.random().toString(36).slice(2,7);

  let grid="";
  for(let t=0;t<=ticks;t++){
    const y=padT+plotH-(plotH*t/ticks);
    const val=maxV*t/ticks;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
    grid+=`<text x="${padL-9}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--ink-3)">${fmtV(val)}</text>`;
  }
  let cols="";
  const tipData = rows.map((r,i)=>{
    const gx=padL+gw*i+gw/2;
    let inner=`<rect class="chart-vguide" x="${(gx-gw/2).toFixed(1)}" y="${padT}" width="${gw.toFixed(1)}" height="${plotH}" fill="var(--paper-2)"/>`;
    r.series.forEach((v,si)=>{
      const h=v/maxV*plotH;
      const x=gx-(barW*seriesNames.length+2)/2 + si*(barW+2);
      const y=padT+plotH-h;
      const op=r.dim?0.42:1;
      inner+=`<rect class="chart-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${Math.max(h,0).toFixed(1)}" rx="2" fill="${colors[si]}" opacity="${op}"/>`;
    });
    inner+=`<rect class="chart-hot" x="${(gx-gw/2).toFixed(1)}" y="${padT}" width="${gw.toFixed(1)}" height="${plotH}"
      onmousemove="chartHover(event,'${jsArg(key)}',${i})" onmouseleave="hideChartTip()"/>`;
    inner+=`<text x="${gx.toFixed(1)}" y="${H-padB+15}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-weight="600">${esc(r.label)}</text>`;
    cols+=`<g class="chart-col">${inner}</g>`;
    return { _tip:
      `<div class="tt-h">${esc(r.label)}${r.dim?' · not reported':''}</div>` +
      seriesNames.map((s,si)=>
        `<div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:${colors[si]}"></span>${esc(s)}</span><span class="tt-v">${fmtFull(r.series[si]||0)}</span></div>`
      ).join("")
    };
  });
  window._chartData[key] = tipData;
  const legend = seriesNames.map((s,i)=>
    `<span><span class="lg-sw" style="background:${colors[i]}"></span>${esc(s)}</span>`).join("");
  return `
    <div class="chart-legend">${legend}</div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="svg-chart" preserveAspectRatio="xMidYMid meet">
        ${grid}${cols}
      </svg>
    </div>`;
}

/* ---- shared chart helpers ---- */
/* round a max value up to a clean axis bound so tick labels read nicely */
function niceMax(v){
  if(v<=0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v/mag;
  const step = norm<=1?1: norm<=2?2: norm<=2.5?2.5: norm<=5?5:10;
  return step*mag;
}
/* the global chart tooltip — created once, positioned in JS */
function chartTip(){
  let t = document.getElementById("chartTip");
  if(!t){
    t = document.createElement("div");
    t.id = "chartTip"; t.className = "chart-tip";
    document.body.appendChild(t);
  }
  return t;
}
function showChartTip(ev, html){
  const t = chartTip();
  t.innerHTML = html;
  t.classList.add("show");
  const pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = t.getBoundingClientRect();
  if(x + r.width > window.innerWidth-8)  x = ev.clientX - r.width - pad;
  if(y + r.height > window.innerHeight-8) y = ev.clientY - r.height - pad;
  t.style.left = x+"px"; t.style.top = y+"px";
}
function hideChartTip(){
  const t = document.getElementById("chartTip");
  if(t) t.classList.remove("show");
}
/* stash chart row data so hover handlers can read it without giant inline strings */
window._chartData = window._chartData || {};
function chartHover(ev, key, idx){
  const rows = window._chartData[key];
  if(!rows || !rows[idx]) return;
  showChartTip(ev, rows[idx]._tip);
}

/* value-labelled grouped bars — interactive: hover a month for exact figures.
   rows: [{label, plan, actual, reported}]  */
function svgBudgetBars(rows){
  const W=760, H=300, padL=66, padB=44, padT=22, padR=18;
  const plotW=W-padL-padR, plotH=H-padB-padT;
  const maxV = niceMax(Math.max(1, ...rows.map(r=>Math.max(r.plan||0, r.reported?(r.actual||0):0))));
  const gw = plotW/rows.length;
  const barW = Math.min(16, gw/3.4);
  const gap = 3;
  const ticks=4;
  const key = "bbars_"+Math.random().toString(36).slice(2,7);

  let grid="";
  for(let t=0;t<=ticks;t++){
    const y=padT+plotH-(plotH*t/ticks);
    const val=maxV*t/ticks;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
    grid+=`<text x="${padL-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink-3)">${fmtRs(val)}</text>`;
  }

  let cols="";
  const tipData = rows.map((r,i)=>{
    const gx=padL+gw*i+gw/2;
    const ph=(r.plan||0)/maxV*plotH;
    const px=gx-barW-gap/2;
    const py=padT+plotH-ph;
    const over=r.reported && r.actual>r.plan;
    let inner=`<rect class="chart-vguide" x="${(gx-gw/2).toFixed(1)}" y="${padT}" width="${gw.toFixed(1)}" height="${plotH}" fill="var(--paper-2)"/>`;
    inner+=`<rect class="chart-bar" x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${barW}" height="${Math.max(ph,0).toFixed(1)}" rx="3" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1"/>`;
    if(r.reported){
      const ah=(r.actual||0)/maxV*plotH;
      const ax=gx+gap/2, ay=padT+plotH-ah;
      inner+=`<rect class="chart-bar" x="${ax.toFixed(1)}" y="${ay.toFixed(1)}" width="${barW}" height="${Math.max(ah,0).toFixed(1)}" rx="3" fill="var(--${over?'red':'accent'})"/>`;
    }
    // transparent full-height hotzone for reliable hover
    inner+=`<rect class="chart-hot" x="${(gx-gw/2).toFixed(1)}" y="${padT}" width="${gw.toFixed(1)}" height="${plotH}"
      onmousemove="chartHover(event,'${jsArg(key)}',${i})" onmouseleave="hideChartTip()"/>`;
    inner+=`<text x="${gx.toFixed(1)}" y="${H-padB+17}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)" font-weight="600">${esc(r.label)}</text>`;
    cols+=`<g class="chart-col">${inner}</g>`;
    // tooltip html
    const dvar = r.reported ? (r.actual-r.plan) : null;
    return { _tip:
      `<div class="tt-h">${esc(r.label)}</div>
       <div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:var(--blue-soft);border:1px solid var(--blue)"></span>Planned</span><span class="tt-v">${fmtRsFull(r.plan||0)}</span></div>
       ${r.reported
         ? `<div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:var(--${over?'red':'accent'})"></span>Actual</span><span class="tt-v">${fmtRsFull(r.actual||0)}</span></div>
            <div class="tt-d" style="color:${dvar>0?'#ff9b8a':'#9be3c4'}">${dvar>=0?'+':''}${fmtRsFull(dvar)} ${dvar>0?'over plan':'under plan'}</div>`
         : `<div class="tt-d">Not yet reported</div>`}`
    };
  });
  window._chartData[key] = tipData;

  return `
    <div class="chart-legend">
      <span><span class="lg-sw" style="background:var(--blue-soft);border:1px solid var(--blue)"></span>Planned</span>
      <span><span class="lg-sw" style="background:var(--accent)"></span>Actual</span>
      <span><span class="lg-sw" style="background:var(--red)"></span>Actual · over plan</span>
    </div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="svg-chart" preserveAspectRatio="xMidYMid meet">
        ${grid}${cols}
      </svg>
    </div>`;
}

/* cumulative line chart — running planned total vs running actual.
   Interactive: hover any month for exact running figures and the gap.
   pts: [{label, cumPlan, cumActual, reported}]  */
function svgCumulativeLine(pts){
  const W=760, H=320, padL=70, padB=44, padT=22, padR=20;
  const plotW=W-padL-padR, plotH=H-padB-padT;
  const maxV = niceMax(Math.max(1, ...pts.map(p=>Math.max(p.cumPlan||0, p.reported?(p.cumActual||0):0))));
  const ticks=4;
  const x = i => padL + (pts.length>1? plotW*i/(pts.length-1) : plotW/2);
  const y = v => padT + plotH - (v/maxV*plotH);
  const key = "cline_"+Math.random().toString(36).slice(2,7);

  let grid="";
  for(let t=0;t<=ticks;t++){
    const gy=padT+plotH-(plotH*t/ticks);
    grid+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
    grid+=`<text x="${padL-10}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink-3)">${fmtRs(maxV*t/ticks)}</text>`;
  }
  let xlab="";
  pts.forEach((p,i)=>{
    xlab+=`<text x="${x(i).toFixed(1)}" y="${H-padB+17}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)" font-weight="600">${esc(p.label)}</text>`;
  });

  const planPath = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.cumPlan).toFixed(1)}`).join(" ");
  const rep = pts.map((p,i)=>({i,p})).filter(o=>o.p.reported);
  const actPath = rep.map((o,k)=>`${k?'L':'M'}${x(o.i).toFixed(1)},${y(o.p.cumActual).toFixed(1)}`).join(" ");

  // shaded gap between the two cumulative lines (over = red, under = green)
  let gapFill="";
  if(rep.length>1){
    const last=rep[rep.length-1];
    const over=last.p.cumActual>last.p.cumPlan;
    const top = rep.map(o=>`${x(o.i).toFixed(1)},${y(o.p.cumActual).toFixed(1)}`).join(" ");
    const bot = rep.slice().reverse().map(o=>`${x(o.i).toFixed(1)},${y(o.p.cumPlan).toFixed(1)}`).join(" ");
    gapFill=`<polygon points="${top} ${bot}" fill="var(--${over?'red':'green'})" opacity="0.13"/>`;
  }

  // dots
  let planDots="", actDots="";
  pts.forEach((p,i)=>{
    planDots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.cumPlan).toFixed(1)}" r="3" fill="var(--blue)" opacity="0.6"/>`;
  });
  rep.forEach(o=>{
    const over=o.p.cumActual>o.p.cumPlan;
    actDots+=`<circle class="chart-pt" cx="${x(o.i).toFixed(1)}" cy="${y(o.p.cumActual).toFixed(1)}" r="4.5" fill="var(--${over?'red':'accent'})" stroke="var(--card)" stroke-width="1.8"/>`;
  });

  // interactive hover columns + tooltip data
  let hot="";
  const colW = pts.length>1 ? plotW/(pts.length-1) : plotW;
  const tipData = pts.map((p,i)=>{
    const cx=x(i);
    hot+=`<g class="chart-col">
      <line class="chart-vguide" x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${padT+plotH}" stroke="var(--rule-2)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect class="chart-hot" x="${(cx-colW/2).toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${plotH}"
        onmousemove="chartHover(event,'${jsArg(key)}',${i})" onmouseleave="hideChartTip()"/>
    </g>`;
    const diff = p.reported ? (p.cumActual-p.cumPlan) : null;
    const over = diff!=null && diff>0;
    return { _tip:
      `<div class="tt-h">By ${esc(p.label)}</div>
       <div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:var(--blue)"></span>Planned (cumulative)</span><span class="tt-v">${fmtRsFull(p.cumPlan||0)}</span></div>
       ${p.reported
         ? `<div class="tt-r"><span class="tt-k"><span class="tt-sw" style="background:var(--accent)"></span>Actual (cumulative)</span><span class="tt-v">${fmtRsFull(p.cumActual||0)}</span></div>
            <div class="tt-d" style="color:${over?'#ff9b8a':'#9be3c4'}">${over?'Over':'Under'} plan by ${fmtRsFull(Math.abs(diff))}</div>`
         : `<div class="tt-d">Not yet reported</div>`}`
    };
  });
  window._chartData[key] = tipData;

  return `
    <div class="chart-legend">
      <span><span class="lg-sw" style="background:var(--blue);opacity:.6"></span>Cumulative planned</span>
      <span><span class="lg-sw" style="background:var(--accent)"></span>Cumulative actual</span>
    </div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="svg-chart" preserveAspectRatio="xMidYMid meet">
        ${grid}
        ${gapFill}
        <path d="${planPath}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
        ${actPath?`<path d="${actPath}" fill="none" stroke="var(--accent)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`:''}
        ${planDots}${actDots}
        ${xlab}
        ${hot}
      </svg>
    </div>`;
}

function svgDonut(done,notDone,pending,pctLabel){
  const total=done+notDone+pending||1;
  const r=22, C=2*Math.PI*r, cx=28, cy=28;
  const segs=[
    {v:done,    col:"var(--green)"},
    {v:notDone, col:"var(--red)"},
    {v:pending, col:"var(--amber)"}
  ];
  let off=0, circles="";
  segs.forEach(s=>{
    const len=s.v/total*C;
    if(len>0){
      circles+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}"
        stroke-width="8" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"
        transform="rotate(-90 ${cx} ${cy})"/>`;
    }
    off+=len;
  });
  return `<div class="donut-c">
    <svg width="54" height="54" viewBox="0 0 56 56">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="8"/>
      ${circles}
    </svg>
    <div class="dn-mid">${pctLabel}%</div>
  </div>`;
}

function svgRadar(dims){
  const N=dims.length, cx=150, cy=150, R=110, max=5;
  const angle=i=>(-Math.PI/2)+(2*Math.PI*i/N);
  const pt=(i,rad)=>[cx+Math.cos(angle(i))*rad, cy+Math.sin(angle(i))*rad];

  let rings="";
  for(let g=1;g<=max;g++){
    const pts=dims.map((_,i)=>pt(i,R*g/max).join(",")).join(" ");
    rings+=`<polygon points="${pts}" fill="none" stroke="var(--rule)" stroke-width="1"/>`;
  }
  let spokes="", labels="";
  dims.forEach((d,i)=>{
    const [ex,ey]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--rule)" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+18);
    const anchor = Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end");
    labels+=`<text x="${lx}" y="${ly+3}" text-anchor="${anchor}" font-size="9" fill="var(--ink-2)" font-weight="600">${esc(d.key)}</text>`;
  });
  const dataPts=dims.map((d,i)=>pt(i,R*d.score/max).join(",")).join(" ");
  return `
    <svg viewBox="0 0 300 300" width="280" height="280">
      ${rings}${spokes}
      <polygon points="${dataPts}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>
      ${dims.map((d,i)=>{const[x,y]=pt(i,R*d.score/max);return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`;}).join("")}
      ${labels}
    </svg>`;
}

  const n = ngoById(ngoId);

  const lines = (d && Array.isArray(d.scrolls) && d.scrolls.length)
    ? d.scrolls : [{scrollId:"",amount:""}];
  const body = `

    ${!editId?`
    <div class="field" style="background:var(--paper-2);border:1px dashed var(--rule-2);border-radius:9px;padding:13px">

    <div class="field">
      <label>Debit note PDF — Google Drive link <span style="text-transform:none;font-weight:400">(optional)</span></label>
      <input type="text" id="dfUrl" value="${d?esc(d.url||''):''}"
             placeholder="https://drive.google.com/…"
             oninput="debitParseLink()">
      <div class="hint">Keep the scanned PDF in your shared Drive folder and paste its link here for the record.</div>
      <div id="dfParseMsg" style="font-size:11.5px;margin-top:5px"></div>
    </div>

    <div class="frow">
      <div class="field">
        <label>Debit note number</label>
        <input type="text" id="dfNo" value="${d?esc(d.dnNo):''}" placeholder="e.g. DB-01" oninput="updateDebitRecap()">
      </div>
      <div class="field">
        <label>Reporting month <span style="text-transform:none;font-weight:400">— auto-derived from the date above</span></label>
        <select id="dfMonth" onchange="updateDebitRecap()">
          ${FY_MONTHS.map(m=>`<option value="${m}" ${(d?d.month:CUR_MONTH)===m?'selected':''}>${monthLong(m)}</option>`).join("")}

    </div>

    <div class="frow">

        <label>Debit note date <span style="text-transform:none;font-weight:400">— sets the reporting month automatically</span></label>
        <input type="date" id="dfDate" value="${d&&d.date?esc(d.date):''}" oninput="syncDebitMonth()">
      </div>
      <div class="field">
        <label>Category <span style="text-transform:none;font-weight:400">— auto-detected</span></label>
        <select id="dfCat" onchange="updateDebitRecap()">
          ${BUDGET_CATS.map(c=>`<option ${d&&d.category===c?'selected':''}>${c}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Scroll breakdown <span style="text-transform:none;font-weight:400">— one row per scroll entry on the note</span></label>
      <table class="scroll-tbl"><tbody id="dfScrolls">

    <div class="field">

      <textarea id="dfNote" placeholder="What this debit note covers…">${d?esc(d.note||''):''}</textarea>
    </div>

    <div class="field">
      <label>Processing status</label>
      <div id="dfStatus" class="radio-col">
        ${DN_STATUS.map(s=>{
          const on = (d?d.status:DN_STATUS_DEFAULT)===s;
          return `<label class="radio-opt">
            <input type="radio" name="dfStatus" value="${esc(s)}" ${on?'checked':''} onchange="updateDebitRecap()">
            <span>${esc(s)}</span>
