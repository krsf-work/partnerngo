function v4Tick(btn, kind, id){
  const rec = v4FindItem(kind, id);
  if(!rec) return;
  const my = kind==="mykr" || kind==="myact";
  const ok = my ? (ME.role==="PM" || rec.ownerId===ME.id) : canEditNgo(rec.ngoId);
  if(!ok){ toast(my ? "You can update only your own OKRs" : "Only this NGO's lead can update it"); return; }
  V4.prev = V4.prev || {};
  const was = rec.status || (kind==="task" ? "Open" : "");
  const back = kind==="task" ? "Open" : kind==="ngokr" ? "Pending" : "";
  const to = was==="Done" ? (V4.prev[kind+id] && V4.prev[kind+id]!=="Done" ? V4.prev[kind+id] : back) : "Done";
  if(was!=="Done") V4.prev[kind+id] = was;
  const row = btn.closest(".v-item");
  btn.classList.toggle("on", to==="Done"); btn.disabled = true;
  if(row){ row.classList.toggle("done", to==="Done"); if(to==="Done") row.classList.add("ticking"); }
  try{ if(navigator.vibrate) navigator.vibrate(to==="Done" ? [8,40,14] : 10); }catch(e){}
  const leaving = row && to==="Done" && row.closest(".v-grp:not(.g-donetoday)");
  if(leaving) setTimeout(()=>{ row.style.height = row.offsetHeight+"px"; requestAnimationFrame(()=>row.classList.add("leave")); }, 420);
  setTimeout(()=>{
    v4ApplyStatus(kind, id, to);
    v4Snack(to==="Done" ? "Marked done" : "Marked not done", ()=>v4ApplyStatus(kind, id, was));
  }, leaving ? 720 : 420);
}

  s.innerHTML = `<span>${esc(msg)}</span>${undo?`<button onclick="v4DoUndo()">Undo</button>`:""}`;

function v4DayBar(c, doneN){
  const parts = [["late",c.late,"overdue"],["today",c.today,"today"],["week",c.week,"this week"],["done",doneN,"done today"]];
  const total = parts.reduce((s,p)=>s+p[1],0);
  if(!total) return `<div class="v5-day clear">${vi("check","sm")} Nothing due this week. Enjoy the calm.</div>`;

async function v4PushRegister(){
  const fail = why => { V4.pushErr = why; try{ localStorage.setItem("sahkar_push_err:"+(ME&&ME.id), why); }catch(e){} return false; };
  try{
    if(!ME || !v4IsTeam()) return fail("This login doesn't get reminders.");
    if(!_authUid || !fb || !fb.db) return fail("Not signed in to the server yet. Reload and try again.");
    if(typeof firebase==="undefined" || !firebase.messaging) return fail("Push isn't loaded. Close and reopen Pulse.");
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return fail("This browser can't receive push. On iPhone, add Pulse to the Home Screen first.");
    if(!("Notification" in window) || Notification.permission!=="granted") return fail("Notifications aren't allowed for this site.");
    if(firebase.messaging.isSupported && !(await Promise.resolve(firebase.messaging.isSupported()))) return fail("This browser doesn't support push.");
    const reg = await navigator.serviceWorker.ready;
    let token;
    try{ token = await firebase.messaging().getToken({ vapidKey:v4Vapid(), serviceWorkerRegistration:reg }); }
    catch(e){ return fail("Couldn't register with Google: "+((e&&e.code)||"")+" "+((e&&e.message)||"").slice(0,140)); }
    if(!token) return fail("Google returned no token.");
    /* straight to the server over HTTPS: the database library can report a
       write as saved from its local copy before the server has it */
    const path = "push/"+_authUid+"/"+v4Hash(token);
    const put = await v4Rest("PUT", path, { token, at:new Date().toISOString() });
    if(!put.ok) return fail("Couldn't save to Pulse: "+put.why);
    const back = await v4Rest("GET", path);
    if(!back.ok) return fail("Couldn't confirm with the server: "+back.why);
    if(!back.data || back.data.token!==token) return fail("Saved, but the server doesn't have it. Uid ends "+String(_authUid).slice(-4)+".");
    V4.pushErr = "";
    try{ localStorage.setItem("sahkar_push_ok:"+ME.id, TODAY_ISO); localStorage.removeItem("sahkar_push_err:"+ME.id); }catch(e){}
    return true;
  }catch(e){ return fail("Unexpected: "+((e&&e.message)||e)); }
}

function v4PushErr(){ if(V4.pushErr) return V4.pushErr; try{ return localStorage.getItem("sahkar_push_err:"+ME.id) || ""; }catch(e){ return ""; } }

/* one request to the database over HTTPS, signed with this login */
async function v4Rest(method, path, body, query){
  try{
    const u = fb.auth && fb.auth.currentUser;
    if(!u) return { ok:false, why:"not signed in to the server" };
    const idt = await u.getIdToken();
    const base = String((window.FIREBASE_CONFIG||{}).databaseURL||"").replace(/[/]+$/,"");
    const res = await sahkarTimeout(fetch(base+"/"+path+".json?auth="+encodeURIComponent(idt)+(query?"&"+query:""), {
      method, headers:{ "Content-Type":"application/json" }, body: body ? JSON.stringify(body) : undefined, cache:"no-store" }), 12000);
    let data = null; try{ data = await res.json(); }catch(e){}
    if(!res.ok) return { ok:false, why:"HTTP "+res.status+" "+((data&&data.error)||"") };
    return { ok:true, data };
  }catch(e){ return { ok:false, why:(e&&e.code)||(e&&e.message)||String(e) }; }
}
async function v4PushCheck(){
  const out = el("v4PushChk"); if(!out) return;
  try{
    if(!_authUid || !fb || !fb.db){ out.textContent = "Server check: not signed in to the server."; return; }
    const r = await v4Rest("GET", "push/"+_authUid, null, "shallow=true");
    if(!r.ok){ out.textContent = "Server check failed: " + r.why; return; }
    const n = r.data ? Object.keys(r.data).length : 0;
    if(n){ out.textContent = "Server check: " + n + " phone" + (n>1?"s":"") + " registered ✓"; return; }
    out.textContent = "Server check: this phone is NOT registered. Tap Re-check.";
    try{ localStorage.removeItem("sahkar_push_ok:"+ME.id); }catch(e){}
  }catch(e){ out.textContent = "Server check failed: " + ((e&&e.code)||(e&&e.message)||e); }
}

/* ---------- reminders (browser notifications) ---------- */
async function v4DailyReminder(force){
  try{
    if(!ME || !v4IsTeam() || !DB) return;
    const list = v4Deadlines(), c = v4Count(list);
    const urgent = c.late + c.today;
    if(navigator.setAppBadge){ urgent ? navigator.setAppBadge(urgent) : (navigator.clearAppBadge && navigator.clearAppBadge()); }
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    let pushDay = null; try{ pushDay = localStorage.getItem("sahkar_push_ok:"+ME.id); }catch(e){}
    if(pushDay!==TODAY_ISO) v4PushRegister();
    if(pushDay && !force) return;   /* the 9 am push covers it */
    const key = V4_NOTIF_KEY + ME.id;
    let last = null; try{ last = localStorage.getItem(key); }catch(e){}
    const n = c.late + c.today + c.week;
    if(!force && (last===TODAY_ISO || !n)) return;
    const parts = [];
    if(c.late) parts.push(c.late+" overdue");
    if(c.today) parts.push(c.today+" due today");
    if(c.week) parts.push(c.week+" this week");
    const first = list.find(x=>x.bucket==="late"||x.bucket==="today"||x.bucket==="week");
    const title = n ? parts.join(" · ") : "You're all caught up";
    const opts = { body: first ? (V4_KIND[first.kind].label+": "+first.title).slice(0,140) : "No deadlines this week.",
      icon:"pulse-192.png", badge:"pulse-192.png", tag:"sahkar-daily", data:{ url: location.href.split("#")[0] } };
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if(reg && reg.showNotification) await reg.showNotification(title, opts);
    else new Notification(title, opts);
    try{ localStorage.setItem(key, TODAY_ISO); }catch(e){}
  }catch(e){ console.warn("reminder", e); }
}

/* =================================================================
   V72 · NGO LOGINS — a phone-first OKR + task view
   A partner NGO signs in and sees only its own key results and the tasks
   KRSF has raised for it. It can mark a key result Done / In progress /
   Not done, add a comment, and tick a task off. Nothing else is reachable:
   canEdit() stays false for this role and visibleNgos() returns nothing,
   so every existing page and write path stays closed to it.
   ================================================================= */
let NGO_OKR_MONTH = null;   // month chip the NGO picked
let NGO_CMT_OPEN  = null;   // key result whose comment box is open
let NGO_CMT_DRAFT = {};     // unsaved comment text, survives a live re-render

/* V73: an NGO login holds only ngoData/{its ngo}. Fields it may change: */
const NGO_FIELDS = { mbo:["status","comment","editedBy","editedAt"], tasks:["status","doneBy","doneAt"] };
function ngoPortalApply(ngoId, v){
  v = (v && typeof v==="object") ? v : {};
  NGO_SPLIT_PARTS.forEach(part=>{
    const m = (v[part] && typeof v[part]==="object") ? v[part] : {};
    const rows = [], map = {};
    Object.keys(m).forEach(k=>{
      const r = m[k];
      if(!r || typeof r!=="object") return;
      rows.push(r);
      map[r.id || k] = Object.assign({}, r, { _path:"ngoData/"+fbKey(ngoId)+"/"+part+"/"+k });
    });
    rows.sort(byOrd);
    DB[part] = rows; _ngoRows[part] = map;
  });
  const p = (v.profile && typeof v.profile==="object") ? v.profile : {};
  DB.ngos = [{ id:ngoId, short:p.short || p.name || "Partner NGO", name:p.name || p.short || "" }];
}
function ngoPortalListen(ngoId){
  _unsub.forEach(fn=>{ try{fn();}catch(e){} });
  _unsub = [];
  const ref = fb.db.ref("ngoData/"+fbKey(ngoId));
  const h = snap=>{
    if(!DB || !ME || ME.role!=="NGO") return;
    ngoPortalApply(ngoId, snap.val());
    cacheSave(); render(); setConnState(true);
  };
  ref.on("value", h, err=>{ console.error("listener error (ngo portal)", err); setConnState(false); });
  _unsub.push(()=>ref.off("value", h));
}
/* write only the allowed fields that changed, on rows that already exist */
async function ngoPortalSave(){
  const ngoId = ngoUserNgoId();
  if(!ngoId) return false;
  const upd = {}, applied = [];
  NGO_SPLIT_PARTS.forEach(part=>{
    (DB[part] || []).forEach(r=>{
      const prev = r && _ngoRows[part][r.id];
      if(!prev || r.ngoId!==ngoId) return;
      NGO_FIELDS[part].forEach(f=>{
        const a = (r[f]===undefined) ? null : r[f];
        const b = (prev[f]===undefined) ? null : prev[f];
        if(a!==b){ upd[prev._path+"/"+f] = a; applied.push([prev, f, a]); }
      });
    });
  });
  if(!Object.keys(upd).length) return true;
  try{
    await fb.db.ref().update(upd);
    applied.forEach(([prev, f, a])=>{ if(a===null) delete prev[f]; else prev[f] = a; });
    SAVE_OK = true; setConnState(true);
    return true;
  }catch(e){
    console.error("save failed", e);
    if(SAVE_OK) toast("⚠ Couldn't sync — your last change will retry automatically");
    SAVE_OK = false; setConnState(false);
    scheduleSaveRetry();
    return false;
  }
}

/* the one NGO this login belongs to */
function ngoUserNgoId(){
  if(!ME || ME.role!=="NGO") return null;
  const ids = myNgoIds();
  return ids.length ? ids[0] : null;
}
/* true only for an NGO login acting on its own NGO */
function ngoOwns(ngoId){
  return !!ME && ME.role==="NGO" && !!ngoId && myNgoIds().indexOf(ngoId) >= 0;
}
function blockIfNotMyNgo(ngoId){
  if(!ngoOwns(ngoId)){ toast("You can only update your own organisation's records"); return true; }
  return false;
}
function ngoMboRows(){ const id=ngoUserNgoId(); return id ? (DB.mbo||[]).filter(r=>r && r.ngoId===id) : []; }
function ngoTaskRows(){ const id=ngoUserNgoId(); return id ? (DB.tasks||[]).filter(t=>t && t.ngoId===id) : []; }
function ngoOkrMonths(){ return [...new Set(ngoMboRows().map(r=>r.month).filter(Boolean))].sort().reverse(); }
/* default month: this month if it has key results, else the latest earlier one */
function ngoSelMonth(){
  const ms = ngoOkrMonths();
  if(NGO_OKR_MONTH && ms.indexOf(NGO_OKR_MONTH)>=0) return NGO_OKR_MONTH;
  const cur = TODAY_ISO.slice(0,7);
  return ms.indexOf(cur)>=0 ? cur : (ms.find(m=>m<cur) || ms[0] || "");
}
function ngoPendingCount(){
  const m = ngoSelMonth();
  const n = ngoMboRows().filter(r=>r.month===m && r.status!=="Done" && r.status!=="Not Done").length;
  return n || null;
}
function ngoOpenTaskCount(){ const n = ngoTaskRows().filter(t=>t.status!=="Done").length; return n || null; }

function ngoHead(title){

function pageNgoOkr(){
  const ngoId = ngoUserNgoId();
  if(!ngoId || !ngoById(ngoId)) return ngoHead("My OKRs") + ngoNoOrg() + ngoTabs();
  const months = ngoOkrMonths();
  const sel = ngoSelMonth();
  let html = ngoHead("My OKRs");
  if(!months.length){
    return html + `<div class="nm-empty">No key results have been set for your organisation yet.<br>KRSF will add them here each month.</div>` + ngoTabs();
  }
  html += `<div class="nm-months">${months.map(m=>`<button class="nm-chip ${m===sel?'on':''}" onclick="NGO_OKR_MONTH='${jsArg(m)}';NGO_CMT_OPEN=null;render()">${monthLong(m)}</button>`).join("")}</div>`;
  const rows = ngoMboRows().filter(r=>r.month===sel);
  const done = rows.filter(r=>r.status==="Done").length;
  const notDone = rows.filter(r=>r.status==="Not Done").length;
  const prog = rows.length - done - notDone;
  const pct = x => rows.length ? (x/rows.length*100).toFixed(1) : 0;
  html += `<div class="nm-sum"><div class="row"><span><span class="big">${done}</span> / ${rows.length} done</span>
     <span>${prog} in progress · ${notDone} not done</span></div>
     <div class="nm-bar"><i style="width:${pct(done)}%;background:var(--green)"></i><i style="width:${pct(prog)}%;background:var(--amber)"></i><i style="width:${pct(notDone)}%;background:var(--red)"></i></div></div>`;
  /* group by objective, main objectives first */
  const groups = {};
  rows.forEach(r=>{
    const k = (r.isOther?1:0)+"|"+(r.objNum||0)+"|"+(r.objective||"");
    (groups[k] = groups[k] || { objNum:r.objNum, objective:r.objective, isOther:!!r.isOther, krs:[] }).krs.push(r);
  });
  const list = Object.values(groups).sort((a,b)=>(a.isOther-b.isOther) || ((a.objNum||0)-(b.objNum||0)));
  let shownOther = false;
  list.forEach(g=>{
    if(g.isOther && !shownOther){ html += `<div class="nm-sec">Other objectives</div>`; shownOther = true; }
    html += `<div class="nm-obj"><div class="nm-obj-h"><div class="n">${esc(g.objNum||"•")}</div><div class="t">${esc(g.objective||"Objective")}</div></div>
      ${g.krs.map(ngoKrCard).join("")}</div>`;
  });
  return html + ngoTabs();
}
function ngoKrCard(k){
  const st = k.status==="Done" ? "Done" : k.status==="Not Done" ? "Not Done" : "Pending";
  const btn = (val,cls,lb)=>`<button class="${cls} ${st===val?'on':''}" aria-pressed="${st===val}" onclick="ngoSetKr('${jsArg(k.id)}','${jsArg(val)}')">${lb}</button>`;
  const open = NGO_CMT_OPEN===k.id;
  const draft = (NGO_CMT_DRAFT[k.id]!=null) ? NGO_CMT_DRAFT[k.id] : (k.comment||"");
  return `<div class="nm-kr">
    <div class="t">${esc(k.kr)}</div>
    ${k.timeline?`<div class="m">Target: ${fmtDMY(k.timeline)}</div>`:''}
    <div class="nm-seg">${btn("Done","s-done","Done")}${btn("Pending","s-prog","In progress")}${btn("Not Done","s-not","Not done")}</div>
    ${open ? `<textarea id="nmc_${k.id}" maxlength="2000" placeholder="What happened? Numbers, links or blockers" oninput="NGO_CMT_DRAFT['${jsArg(k.id)}']=this.value">${esc(draft)}</textarea>
      <div class="nm-act"><button class="btn ghost sm" onclick="delete NGO_CMT_DRAFT['${jsArg(k.id)}'];NGO_CMT_OPEN=null;render()">Cancel</button>
      <button class="btn accent sm" onclick="ngoSaveKrComment('${jsArg(k.id)}')">Save comment</button></div>`
    : `${k.comment?`<div class="nm-cmt">${esc(k.comment)}</div>`:''}
       <button class="nm-link" onclick="NGO_CMT_OPEN='${jsArg(k.id)}';render()">${k.comment?'Edit comment':'+ Add comment'}</button>`}
  </div>`;
}
function ngoSetKr(id, status){
  const r = (DB.mbo||[]).find(x=>x && x.id===id);
  if(!r || blockIfNotMyNgo(r.ngoId)) return;
  if(["Done","Not Done","Pending"].indexOf(status)<0 || r.status===status) return;
  r.status = status; stampEdit(r);
  saveDB(); render(); toast("Status saved");
}
function ngoSaveKrComment(id){
  const r = (DB.mbo||[]).find(x=>x && x.id===id);
  if(!r || blockIfNotMyNgo(r.ngoId)) return;
  const box = el("nmc_"+id);
  r.comment = (box ? box.value : "").trim().slice(0,2000);
  stampEdit(r);
  delete NGO_CMT_DRAFT[id]; NGO_CMT_OPEN = null;
  saveDB(); render(); toast("Comment saved");
}

function pageNgoTasks(){
  const ngoId = ngoUserNgoId();
  if(!ngoId || !ngoById(ngoId)) return ngoHead("Tasks") + ngoNoOrg() + ngoTabs();
  const all = ngoTaskRows();
  const open = all.filter(t=>t.status!=="Done").sort((a,b)=>String(a.due||"9").localeCompare(String(b.due||"9")));
  const done = all.filter(t=>t.status==="Done").sort((a,b)=>String(b.doneAt||b.due||"").localeCompare(String(a.doneAt||a.due||"")));
  const row = t=>{
    const isDone = t.status==="Done";
    const overdue = !isDone && t.due && t.due<TODAY_ISO;
    return `<div class="nm-task ${isDone?'done':''}">
      <button class="nm-tick ${isDone?'on':''}" aria-label="${isDone?'Mark as not done':'Mark as done'}" onclick="ngoToggleTask('${jsArg(t.id)}')">${isDone?'✓':''}</button>
      <div style="min-width:0;flex:1"><div class="t">${esc(t.title)}</div>
      <div class="m">${t.due?'Due '+fmtDMY(t.due):'No due date'}${overdue?' · <b style="color:var(--red)">overdue</b>':''}${t.priority?' · '+esc(t.priority)+' priority':''}</div></div></div>`;
  };
  let html = ngoHead("Tasks from KRSF");
  html += `<div class="nm-sec">To do · ${open.length}</div>`;
  html += open.length ? open.map(row).join("") : `<div class="nm-empty">Nothing pending — all caught up.</div>`;
  if(done.length) html += `<div class="nm-sec">Completed · ${done.length}</div>` + done.slice(0,30).map(row).join("");
  return html + ngoTabs();
}
function ngoToggleTask(id){
  const t = (DB.tasks||[]).find(x=>x && x.id===id);
  if(!t || blockIfNotMyNgo(t.ngoId)) return;
  if(t.status==="Done"){ t.status="Open"; delete t.doneBy; delete t.doneAt; }
  else { t.status="Done"; t.doneBy=ME.name; t.doneAt=TODAY_ISO; }
  saveDB(); render();
  toast(t.status==="Done" ? "Marked done" : "Moved back to to-do");
}

/* ---- scorecard cell picker (0–5, half steps) ---- */
let _scorePopAnchor = null;
function openScorePop(ev, ngoId, key){
  ev.stopPropagation();
  let pop = el("scorePop");
  if(!pop){
    pop = document.createElement("div");
    pop.id = "scorePop";
    pop.className = "score-pop";
    document.body.appendChild(pop);
  }
  const crit = SCORE_CRITERIA.find(c=>c.key===key);
  const opts = [0,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5];
  pop.innerHTML =
    `<div class="sp-head">${esc(crit?crit.label:key)}</div>` +
    opts.map(v=>`<div class="sp-opt" onclick="setScoreCell('${jsArg(ngoId)}','${jsArg(key)}',${v})">${fmtScore(v)}</div>`).join("") +
    `<div class="sp-opt" style="grid-column:1/-1;background:var(--paper)"
          onclick="setScoreCell('${jsArg(ngoId)}','${jsArg(key)}',null)">Clear</div>`;
  pop.classList.add("show");
  _scorePopAnchor = ev.currentTarget;
  positionScorePop();
  // dismiss on outside click, or whenever the page scrolls
  setTimeout(()=>{
    document.addEventListener("click", closeScorePop, {once:true});
  },0);
  window.addEventListener("scroll", closeScorePop, {once:true,capture:true});
  window.addEventListener("resize", closeScorePop, {once:true});
}
function positionScorePop(){
  const pop = el("scorePop");
  if(!pop || !_scorePopAnchor) return;
  const r = _scorePopAnchor.getBoundingClientRect();
  const pw = pop.offsetWidth||196, ph = pop.offsetHeight||260;
  let left = r.left;
  let top  = r.bottom + 6;
  if(left + pw > window.innerWidth - 8)  left = window.innerWidth - pw - 8;
  if(top + ph > window.innerHeight - 8)  top = r.top - ph - 6;   // flip above
  pop.style.left = Math.max(8,left) + "px";
  pop.style.top  = Math.max(8,top) + "px";
}
function closeScorePop(){
  const pop = el("scorePop");
  if(pop) pop.classList.remove("show");
  _scorePopAnchor = null;
}

/* Dashboard quick-log — the fast path for logging *today* without
   navigating to the Daily Sheet page at all. APL/Programme roles only.
   Same two-field-per-hour grid as the full Daily Sheet page, in a
   scrollable box so it doesn't take over the Dashboard. */
function dailyHomeWidget(){
  if(!(ME.role==="APL"||ME.role==="Programme")) return '';
  const rec=dailyRec(ME.id,TODAY_ISO);
  const hours=(rec&&rec.hours)||{};
  const filled=dailyFilled(rec);
  return `<div class="panel" style="margin-bottom:16px">
    <div class="panel-h">
      <h3>Today's log</h3>
      <span class="note">${filled} hour${filled===1?'':'s'} filled</span>
    </div>
    <div style="padding:14px 16px">
      <div style="max-height:230px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;padding:10px">
        ${DAILY_HOURS.map(h=>{
          const c=hours[String(h)]||{};
          return `<div style="margin-bottom:10px">
            <div style="font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:4px">${hourLabel(h)}</div>
            <input id="dfor_${h}" value="${esc(c.for||'')}" placeholder="NGO / activity…" style="width:100%;margin-bottom:4px">
            <input id="ddet_${h}" value="${esc(c.detail||'')}" placeholder="what you did this hour…" style="width:100%">
          </div>`;
        }).join("")}
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="btn primary sm" onclick="dailyHomeSaveToday()">Save today</button>
      </div>
    </div>
  </div>`;
}
/* not DAILY_OPEN-guarded like dailySaveDay — this widget is the only place
   on the Dashboard page rendering dfor_ and ddet_ ids, always for today,
   so there's no "which day is this for" ambiguity to protect against. */
function dailyHomeSaveToday(){
  const aplId=ME.id, date=TODAY_ISO;
  const hours={};
  DAILY_HOURS.forEach(h=>{
    const f=(el("dfor_"+h)&&el("dfor_"+h).value.trim())||"";
    const d=(el("ddet_"+h)&&el("ddet_"+h).value.trim())||"";
    if(f||d) hours[String(h)]={ for:f, detail:d };
  });
  let rec=dailyRec(aplId,date);
  if(rec){ rec.hours=hours; rec.editedBy=ME.name; rec.editedAt=TODAY_ISO; }
  else if(Object.keys(hours).length){
    DB.dailyLogs.push({ id:genId("dl"), aplId, date, hours, comments:[], editedBy:ME.name, editedAt:TODAY_ISO });
  }
  saveDB(); render();
  const n=Object.keys(hours).length;
  toast(n?("Saved today · "+n+" hour"+(n>1?'s':'')):("Cleared today's log"));
}

function scoreClass(v){

/* show 4.5 not 4.50, and 32 not 32.0 */
function fmtScore(v){
  if(v==null||isNaN(v)) return "–";
  return (Math.round(v*10)/10).toString();
}

/* one NGO row + (if expanded) its big-bet sub-rows */
function dashNgoRow(n){
  const bd   = DB.budgets[n.id]||{};
  const appr = bd.totalAnnual||0;
  const used = ngoSpendUpto(n.id,CUR_MONTH);
  const up   = pct(used,appr);
  const bets = betsForNgo(n.id);
  const open = DASH_OPEN===n.id;

  // NGO-level delivery: how many of its bets are on track, and avg % of annual target
  const healths = bets.map(b=>betHealth(b).status);
  const onTrack = healths.filter(s=>s==="green").length;
  const offTrack= healths.filter(s=>s==="red").length;
  const progs = bets.map(b=>betProgress(b));
  const avgProg = progs.length? Math.round(progs.reduce((a,b)=>a+b,0)/progs.length):0;
  // band reflects DELIVERY (vs plan), not raw % — matches the rest of the app
  const aBand = !bets.length?'gray': offTrack? 'red' : onTrack<bets.length? 'amber' : 'green';

  const mainRow = `
    <tr class="ngo-main ${open?'open':''}" onclick="toggleNgoRow('${jsArg(n.id)}')">
      <td>
        <span class="caret">▶</span>
        <b>${esc(n.short)}</b>
        <span style="color:var(--ink-3);font-size:11px"> · ${esc(n.state)}</span>
      </td>
      <td style="font-size:12px">${esc(aplNamesFor(n.id))}</td>
      <td class="num">
        ${fmtRs(appr)} <span style="color:var(--ink-3)">·</span> ${fmtRs(used)}
        <div style="font-size:10.5px;color:var(--${up>=100?'red':up>=85?'amber':'green'})">${up}% used</div>
      </td>
      <td>
        <span class="ptag ${esc(n.partnership)}" onclick="setPartnership('${jsArg(n.id)}',event)" title="Click to change">
          <span class="pd"></span>${esc(n.partnership)}
        </span>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:9px" title="${onTrack} of ${bets.length} milestones on track · ${avgProg}% of annual targets">
          <div class="mini-bar"><i class="${aBand}" style="width:${Math.min(avgProg,100)}%"></i></div>
          <b style="font-size:11.5px;color:var(--${aBand});white-space:nowrap">${bets.length?onTrack+'/'+bets.length:'—'}</b>
        </div>
      </td>
    </tr>`;

  if(!open) return mainRow;

  const sub = bets.length ? bets.map(b=>{
    const p = betProgress(b);
    const band = betHealth(b).status;
    const cum = betCumulative(b,FY_END);
    return `<div class="bet-sub-inner">
      <span class="bi">${b.icon||'◎'}</span>
      <span class="bt">${esc(b.title)}</span>
      <span class="bv">${fmtCompact(cum,b.unit)} / ${fmtCompact(b.annualTarget,b.unit)}</span>
      <div class="mini-bar"><i class="${band==='gray'?'amber':band}" style="width:${Math.min(p,100)}%"></i></div>
      <b style="font-size:12px;width:42px;text-align:right;color:var(--${band==='gray'?'ink-3':band})">${p}%</b>
    </div>`;
  }).join("") : `<div class="bet-sub-inner"><span class="bt" style="color:var(--ink-3)">No milestones defined for this NGO yet.</span></div>`;

  return mainRow + `<tr class="bet-sub"><td colspan="5">${sub}</td></tr>`;
}

function fmtCompact(v,unit){
  if(unit==="₹") return fmtRs(v);
  return fmtN(v);
}

/* one compact bet row; expands to the monthly ladder when open */
function renderBetRow(bet){
  const n = ngoById(bet.ngoId);
  const h = betHealth(bet);
  const level = betIsLevelType(bet);
  const cum = betCumulative(bet,FY_END);
  const prog = pct(cum, bet.annualTarget);
  const progCls = h.status==="gray"?"accent":h.status;
  const open = BETS_OPEN===bet.id;

  const row = `
    <div class="bet-row ${open?'open':''}" onclick="toggleBet('${jsArg(bet.id)}')">
      <span class="caret">▶</span>
      <span class="bi">${bet.icon||'◎'}</span>
      <div class="bmain">
        <div class="btitle">${esc(bet.title)}</div>
        <div class="bngo">${esc(n.short)} · ${esc(n.vertical)}</div>
      </div>
      <div class="bbar-wrap">
        <span class="bdot ${h.status}"></span>
        <div class="pbar"><i class="${progCls}" style="width:${Math.min(prog,100)}%"></i></div>
      </div>
      <span class="bpct" style="color:var(--${progCls==='accent'?'ink-3':progCls})">${prog}%</span>
      <div class="bfig">
        <div class="fv">${level?fmtRs(cum):fmtN(cum)}</div>
        <div class="ft">of ${level?fmtRs(bet.annualTarget):fmtN(bet.annualTarget)}</div>
      </div>
    </div>`;

  if(!open) return row;

  // expanded: monthly ladder
  const cellsHtml = FY_MONTHS.map(m=>{
    const c = bet.months[m]||{};
    const isFuture = m>CUR_MONTH;
    const isCurrent = m===CUR_MONTH;
    const hasActual = c.actual!=null;
    let varHtml="";
    if(c.plan!=null && hasActual){
      const d = c.actual-c.plan;
      const vcls = d>=0?"pos": d< -c.plan*0.15?"neg":"zero";
      varHtml = `<div class="lad-var ${vcls}">${d>=0?'+':''}${fmtCompact(d,bet.unit)}</div>`;
    } else if(c.plan!=null && !hasActual && !isFuture){
      varHtml = `<div class="lad-var zero">awaiting</div>`;
    }
    return `<div class="lad-cell editable ${isFuture?'future':''} ${isCurrent?'current':''}"
                 onclick="event.stopPropagation();openCellEdit('${jsArg(bet.id)}','${jsArg(m)}')">
      <div class="lad-mo">${monthLabel(m)}</div>
      <div class="lad-body">
        <div class="lad-line"><span class="k">Plan</span><span class="v plan">${c.plan!=null?fmtCompact(c.plan,bet.unit):'·'}</span></div>
        <div class="lad-line"><span class="k">Got</span><span class="v ach" style="color:${hasActual?'var(--ink)':'var(--ink-3)'}">${hasActual?fmtCompact(c.actual,bet.unit):'·'}</span></div>
        ${varHtml}
      </div>
    </div>`;
  }).join("");

  const detail = `
    <div class="bet-detail">
      <div class="dhead">
        <span>${level?'Current level vs annual target':'Cumulative against annual target'} —
          <b>${prog}%</b> ${h.status!=='gray'?`· <span style="color:var(--${h.status})">${h.label} (${h.pace}% of plan-to-date)</span>`:'· not started'}
        </span>
        <span style="display:flex;gap:8px">
          ${canEditNgo(bet.ngoId)?`<button class="btn sm" onclick="event.stopPropagation();openBetForm('${jsArg(bet.id)}')">Edit bet</button>`:''}
        </span>
      </div>
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px">
        Monthly ladder ${canEditNgo(bet.ngoId)?'· tap a month to enter plan &amp; achieved':'· read-only'}
      </div>
      <div class="ladder">${cellsHtml}</div>
      ${bet.editedAt?`<div style="font-size:10.5px;color:var(--ink-3);margin-top:8px">Last updated ${esc(bet.editedAt)} by ${esc(bet.editedBy||'—')}</div>`:''}
    </div>`;

  return row + detail;
}

/* =================================================================
   MODAL INFRASTRUCTURE
   ================================================================= */
let _lastFocus = null;
function showModal(html, wide){
  _lastFocus = document.activeElement;
  const m = el("modal");
  m.className = "modal" + (wide?" wide":"");
  m.innerHTML = html;
  el("modalBg").classList.add("show");
  // focus the first sensible control for keyboard users
  setTimeout(()=>{
    const f = m.querySelector("input,select,textarea,button.primary,button.accent");
    if(f) f.focus();
  },30);
}
function closeModal(){
  el("modalBg").classList.remove("show");
  el("modal").innerHTML = "";
  if(_lastFocus && _lastFocus.focus){ try{_lastFocus.focus();}catch(e){} }
  /* V42: cancelling/closing a modal must clear any in-flight Accept-flagged
     state — otherwise the next unrelated debit-note save auto-dismisses the
     wrong flagged row and queues a bogus pendingMove. */
  if(window._acceptingFlaggedId) delete window._acceptingFlaggedId;
}
/* Escape closes any open modal or popover */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    /* V45: a confirm dialog on top takes Escape first, leaving the parent modal open */
    if(el("confirmBg") && el("confirmBg").classList.contains("show")){ cancelConfirm(); return; }
    if(el("modalBg") && el("modalBg").classList.contains("show")) closeModal();
    closeScorePop();
  }
});
function modalShell(eyebrow, title, body, footer){
  return `
    <div class="modal-h">
      <div>
        <div class="eyebrow">${eyebrow}</div>
        <h2 class="serif">${title}</h2>
      </div>
      <button class="x" onclick="closeModal()" aria-label="Close" title="Close (Esc)">×</button>
    </div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">${footer}</div>`;
}

/* a styled confirmation dialog — replaces native confirm() everywhere.
   V45: renders on its OWN layer (#confirmBg) so it never overwrites the
   modal beneath it. Cancelling returns you to the parent form with every
   field intact, instead of destroying it (the old broken modal-stacking). */
let _confirmCb = null;
function confirmAction(title, message, onYes, yesLabel, danger){
  _confirmCb = onYes;
  const c = el("confirmModal");
  c.className = "modal";
  c.innerHTML = `
    <div class="modal-h">
      <div><div class="eyebrow">Please confirm</div><h2 class="serif">${title}</h2></div>
      <button class="x" onclick="cancelConfirm()" aria-label="Close" title="Close (Esc)">×</button>
    </div>
    <div class="modal-b"><div style="font-size:13px;color:var(--ink-2);line-height:1.6">${message}</div></div>
    <div class="modal-f">
      <button class="btn" onclick="cancelConfirm()">Cancel</button>
      <button class="btn ${danger?'danger':'primary'}" onclick="runConfirm()">${esc(yesLabel||'Confirm')}</button>
    </div>`;
  el("confirmBg").classList.add("show");
  setTimeout(()=>{ const f=c.querySelector("button.danger,button.primary"); if(f) f.focus(); },30);
}
function closeConfirmLayer(){
  el("confirmBg").classList.remove("show");
  el("confirmModal").innerHTML = "";
}
function cancelConfirm(){
  _confirmCb = null;
  closeConfirmLayer();          // leaves any parent modal exactly as it was
}
function runConfirm(){
  const cb = _confirmCb; _confirmCb = null;
  closeConfirmLayer();
  if(typeof cb==="function") cb();
}

/* ---------- monthly cell edit (plan + achieved) ---------- */
function openCellEdit(betId, month){
  const bet = DB.bigBets.find(b=>b.id===betId);
  if(!bet) return;
  if(blockIfCantEditNgo(bet.ngoId)) return;
  const n = ngoById(bet.ngoId);
  const c = bet.months[month] || {plan:null,actual:null,note:""};
  const level = betIsLevelType(bet);
  const idx = FY_MONTHS.indexOf(month);

  // context: cumulative before this month
  const prevMonth = idx>0? FY_MONTHS[idx-1] : null;
  const cumBefore = prevMonth? betCumulative(bet,prevMonth) : (bet.baseline||0);

  const body = `
    <div style="background:var(--paper-2);border:1px solid var(--rule);padding:13px 15px;margin-bottom:18px;border-radius:6px">
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:5px">
        <span style="font-size:20px">${bet.icon}</span>
        <div style="font-family:var(--display);font-weight:600;font-size:14px;line-height:1.3">${esc(bet.title)}</div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-3)">${esc(n.short)} · annual target
        <b style="color:var(--ink)">${level?fmtRs(bet.annualTarget):fmtN(bet.annualTarget)+' '+esc(bet.unit)}</b>
        ${level?'':` · ${prevMonth?'cumulative to '+monthLabel(prevMonth):'baseline'}: <b style="color:var(--ink)">${fmtN(cumBefore)}</b>`}
      </div>
    </div>

    <div class="frow">
      <div class="field">

    </div>

    <button class="btn" onclick="closeModal()">Cancel</button>

  showModal(modalShell(
    monthLong(month)+" · monthly entry",
    "Plan &amp; Achieved",
    body, footer));

  // live variance preview
  const upd=()=>{
    const p=parseFloat(el("cellPlan").value), a=parseFloat(el("cellActual").value);
    const pv=el("cellPreview");
    if(isNaN(p)||isNaN(a)){ pv.innerHTML=""; return; }
    const d=a-p, pc=pct(a,p);
    const cls=pc>=95?"green":pc>=80?"amber":"red";
    pv.innerHTML=`<div style="border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600">This month</div>

      </div>
      <span class="badge ${cls}">${pc>=95?'On target':pc>=80?'Slight slip':'Below target'}</span>
    </div>`;
  };
  ["cellPlan","cellActual"].forEach(id=>el(id).addEventListener("input",upd));
  upd();
}

async function saveBet(editId){

  if(!title || isNaN(target)){ toast("Add a title and an annual target"); return; }
  const icSel = document.querySelector(".icon-pick.sel-ic");

  const baseline = parseFloat(el("bfBaseline").value)||0;
  const levelType = el("bfLevel").value==="true";
  if(editId){
    const b = DB.bigBets.find(x=>x.id===editId);
    b.title=title; b.annualTarget=target; b.unit=unit; b.icon=icon;
    b.baseline=baseline; b.ngoId=el("bfNgo").value; b.levelType=levelType;
    stampEdit(b);

    FY_MONTHS.forEach(m=>months[m]={plan:null,actual:null,note:""});

      unit, annualTarget:target, baseline, levelType, months };

  closeModal();
  render();
  toast(editId?"Milestone updated":"Milestone created");
}
function deleteBet(id){

async function saveNgo(editId){
  /* re-checked here, not only in the opener: a manager can see a
     subordinate's NGO, so the save itself has to refuse it */
  if(editId){ if(blockIfCantEditNgo(editId)) return; }
  else if(!canManageNgos()){ toast("Only the programme manager can add a partner NGO"); return; }
  const name = el("nfName").value.trim();
  const short = el("nfShort").value.trim();
  if(!name || !short){ toast("Name and short name are required"); return; }
  const fields = {
    name, short,
    vertical: el("nfVertical").value,
    state: el("nfState").value.trim()||"—",
    since: el("nfSince").value,
    lead: el("nfLead").value.trim()||"—",
    partnership: el("nfStatus").value,
    impactAmount: parseFloat(String(el("nfImpact").value||"").replace(/,/g,""))||0
  };
  if(editId){

  await saveDB();

  toast(editId?"Partner updated":"Partner added — set up its budget & milestones next");

  const n = ngoById(id);
  if(!n) return;
  const betN = betsForNgo(id).length;
  const dnN  = DB.debits.filter(d=>d.ngoId===id).length;
  confirmAction("Delete this partner NGO?",
    `<b>${esc(n.name)}</b> will be removed along with ${betN} milestone${betN!==1?'s':''},
     ${dnN} debit note${dnN!==1?'s':''}, its budget, documents, tasks, scorecards and outcomes.

let NGO_TAB = "overview";   // overview | mbo | budget | debits | docs | scorecard

/* V44: a single live sentence summarising this partner's health — spend pace,
   milestone delivery, scorecard and anything awaiting review — so the page
   leads with "here's the state of things" instead of raw tables. */
function ngoHealthLine(ngoId){
  const n = ngoById(ngoId); if(!n) return "";
  const bits = [];
  // spend vs pace
  const b = DB.budgets[ngoId];
  if(b && b.totalAnnual){
    const spent = ngoSpendUpto(ngoId, CUR_MONTH);
    const up = pct(spent, b.totalAnnual);
    const expected = Math.round(monthsElapsed(CUR_MONTH)/12*100);
    const cls = up>=100?"bad":up>=85?"warn":"ok";
    let pace = "on pace";
    if(up > expected+12) pace = "running ahead of pace";
    else if(up < expected-12) pace = "under-spending vs pace";
    bits.push(`has utilised <b>${fmtRsFull(spent)}</b> of ${fmtRsFull(b.totalAnnual)} (<span class="${cls}">${up}%</span>) this year — ${pace}`);
  } else {
    bits.push(`has no approved budget on record yet`);
  }
  // milestone delivery
  const bets = betsForNgo(ngoId);
  if(bets.length){
    const onTrack = bets.filter(x=>betHealth(x).status==="green").length;
    const behind  = bets.filter(x=>betHealth(x).status==="red").length;
    const dcls = behind?"bad":onTrack<bets.length?"warn":"ok";
    bits.push(`<span class="${dcls}">${onTrack} of ${bets.length}</span> milestones on track`);
  }
  // scorecard
  const sc = ngoScore(ngoId);
  if(sc.scored){
    bits.push(`scorecard <span class="${sc.status==='green'?'ok':sc.status==='amber'?'warn':'bad'}">${scoreStatusLabel(sc.total)}</span> (${fmtScore(sc.total)}/${SCORE_MAX})`);
  } else {
    bits.push(`not yet scored this month`);
  }
  // anything awaiting review
  const pend = DB.debits.filter(d=>d.ngoId===ngoId && (d.pendingReview || d.proposedAmount!=null)).length;
  let tail = "";
  if(pend) tail = ` <b class="warn">${pend} debit note${pend>1?'s':''} awaiting your review.</b>`;
  return `<div class="ngo-health"><span class="hi">🩺</span><div><b>${esc(n.short)}</b> ${bits.join(" · ")}.${tail}</div></div>`;
}

function ngoActivityStream(ngoId){
  // build a real activity feed from debit notes, bet updates and documents
  const items = [];
  // recent debit notes
  DB.debits.filter(d=>d.ngoId===ngoId).forEach(d=>{
    items.push({
      sort:d.month+"-"+(d.date||""),
      icon:"₹",
      title:`Debit note ${d.dnNo} ${d.status.toLowerCase()}`,
      detail:`${d.category} — ${fmtRsFull(d.amount)} · ${monthLabel(d.month)}`,
      date:monthLabel(d.month)
    });
  });
  // latest reported month on each bet
  betsForNgo(ngoId).forEach(bet=>{
    const lm = lastReportedMonth(bet);
    if(lm){
      const c = bet.months[lm]||{};
      items.push({
        sort:lm+"-15",
        icon:bet.icon||"◎",
        title:`Milestone progress logged`,
        detail:`${bet.title.slice(0,54)}${bet.title.length>54?'…':''} — ${fmtN(c.actual)} ${esc(bet.unit)} in ${monthLabel(lm)}`,
        date:monthLabel(lm)

      sort:d.uploaded,
      icon:"▣",
      title:`${d.type} uploaded`,
      detail:`${esc(d.name)}`,
      date:d.uploaded
    });

}

let MBO_MONTH = {};     // selected month per ngo
let MBO_OPEN  = {};     // open/closed state per objective group key

function ngoMboTab(ngoId){
  const n = ngoById(ngoId);
  const all = (DB.mbo||[]).filter(r=>r.ngoId===ngoId);

  // months that have data, newest first  (V2: months[0] is default)
  const months = [...new Set(all.map(r=>r.month))].sort().reverse();
  const selMonth = MBO_MONTH[ngoId] || (months[0] || "");

  const monthOpts = months.map(m=>
    `<option value="${m}" ${m===selMonth?'selected':''}>${monthLong(m)}</option>`).join("");

  let html = `
  <div class="sec-head">
    <h2>Monthly Outcomes</h2>

    return html;
  }

  const rows = all.filter(r=>r.month===selMonth);
  const allDerived = rows.length && rows.every(r=>r.derived);
  if(allDerived){
    html += `<div class="cum-readout" style="background:var(--amber-soft);border-left-color:var(--amber)">
      <b>Placeholder outcomes.</b> These key results were auto-generated from this NGO's
      Goal targets so the tab isn't empty. Replace them by uploading the partner's real
      monthly outcomes sheet${canEditNgo(ngoId)?' via <b>↑ Upload Excel</b>':''}.
    </div>`;
  }
  html += renderMboBlocks(rows, ngoId);
  return html;
}

/* V2's renderMboBlocks — group rows by objNum+objective, main first,
   then an "Other Objectives" divider for isOther rows */
function renderMboBlocks(rows, ngoId){
  const main  = rows.filter(r=>!r.isOther);
  const other = rows.filter(r=>r.isOther);

  const groupBy = (arr)=>{
    const map = {};
    arr.forEach(r=>{
      const key = (r.objNum||0)+"|"+r.objective;
      if(!map[key]) map[key] = { objNum:r.objNum, objective:r.objective, key, krs:[] };
      map[key].krs.push(r);
    });
    return Object.values(map).sort((a,b)=>(a.objNum||0)-(b.objNum||0));
  };

  let html = "";
  groupBy(main).forEach(g=>html += renderObjCard(g, ngoId));
  if(other.length){
    html += `<div class="other-divider">Other Objectives</div>`;
    groupBy(other).forEach(g=>html += renderObjCard(g, ngoId));
  }
  if(!html) html = `<div class="panel"><div class="empty"><div class="mk">◎</div><p>No outcomes for this month.</p></div></div>`;
  return html;
}

/* a single objective card — collapsible, with status donut + KR rows */
function renderObjCard(g, ngoId){
  const done    = g.krs.filter(k=>k.status==="Done").length;
  const notDone = g.krs.filter(k=>k.status==="Not Done").length;
  const pending = g.krs.filter(k=>k.status==="Pending").length;
  const total   = g.krs.length||1;
  const donePct = Math.round(done/total*100);
  const open    = MBO_OPEN[g.key] !== false;   // open by default

  return `
  <div class="obj-card ${open?'open':''}">
    <div class="obj-head" onclick="MBO_OPEN['${jsArg(g.key)}']=${!open};render()">
      <div class="obj-num">${g.objNum||"—"}</div>
      <div>
        <div class="obj-title">${esc(g.objective)}</div>
        <div class="obj-legend">
          ${done?`<span><b style="color:var(--green)">${done}</b> done</span>`:''}
          ${notDone?`<span><b style="color:var(--red)">${notDone}</b> not done</span>`:''}
          ${pending?`<span><b style="color:var(--amber)">${pending}</b> in progress</span>`:''}
        </div>
      </div>
      ${svgDonut(done,notDone,pending,donePct)}
      <div class="obj-arrow">›</div>
    </div>
    <div class="obj-body">
      ${g.krs.map(k=>{
        const sCls = k.status==="Done"?"kr-done":k.status==="Not Done"?"kr-not":"kr-prog";
        const sel  = k.status==="Done"?"green":k.status==="Not Done"?"red":"amber";
        return `
        <div class="kr-row ${sCls}">
          <div>
            <div class="kr-text">${esc(k.kr)}</div>
            <div class="kr-meta">
              ${k.timeline?`<time>${fmtDMY(k.timeline)}</time>`:''}
              ${k.ref?`<a href="${safeHref(k.ref)}" target="_blank" rel="noopener">↗ Reference</a>`:''}
            </div>
            ${k.comment?`<div class="kr-cmt">${esc(k.comment)}</div>`:''}
          </div>
          <div class="kr-actions">
            <select class="status-select ${sel}" onchange="updateKrStatus('${jsArg(k.id)}',this.value)" ${canEditNgo(k.ngoId)?'':'disabled'}>
              <option value="Done"     ${k.status==="Done"?'selected':''}>Done</option>
              <option value="Not Done" ${k.status==="Not Done"?'selected':''}>Not Done</option>
              <option value="Pending"  ${k.status==="Pending"?'selected':''}>In progress</option>
            </select>
            ${canEditNgo(k.ngoId)?`<button class="btn ghost sm" onclick="openMboModal('${jsArg(k.ngoId)}','${jsArg(k.id)}')">Edit</button>`:''}
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function saveMbo(ngoId, editId){
  const objective = el("mbObjective").value.trim();
  const kr = el("mbKr").value.trim();
  if(!objective || !kr){ toast("Objective and key result are required"); return; }
  const rec = {
    id: editId || genId("mbo"),
    ngoId,
    month: el("mbMonth").value,
    objNum: parseInt(el("mbObjNum").value)||1,
    objective, kr,
    timeline: el("mbTimeline").value.trim(),
    status: el("mbStatus").value,
    comment: el("mbComment").value.trim(),
    ref: el("mbRef").value.trim(),
    isOther: el("mbIsOther").value==="true"
  };
  stampEdit(rec);
  if(!DB.mbo) DB.mbo = [];

    if(i>=0) DB.mbo[i] = rec; else DB.mbo.push(rec);

  MBO_MONTH[ngoId] = rec.month;
  saveDB(); closeModal(); render();
  toast(editId?"Key result updated":"Key result added");
}

/* read a cell value flexibly under several possible header names */
function pickCol(row, names){
  for(const k of Object.keys(row)){
    const norm = k.toLowerCase().replace(/[^a-z]/g,"");
    for(const n of names){ if(norm===n||norm.includes(n)) return row[k]; }
  }
  return "";
}
async function importMboFile(ngoId){
  const inp = el("mbFile");
  if(!inp || !inp.files || !inp.files[0]){ toast("Choose a file first"); return; }
  if(typeof XLSX==="undefined"){ toast("Spreadsheet reader didn't load — check your connection"); return; }
  const defMonth = el("mbUpMonth").value;
  try{
    const buf = await inp.files[0].arrayBuffer();
    const wb = XLSX.read(buf,{type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{defval:""});
    if(!rows.length){ toast("No rows found in that file"); return; }
    let added = 0;
    rows.forEach(r=>{
      const objective = String(pickCol(r,["objective","goal"])).trim();
      const kr = String(pickCol(r,["keyresult","kr","activity","result"])).trim();
      if(!objective && !kr) return;
      let status = String(pickCol(r,["status"])).trim();
      const sl = status.toLowerCase();
      status = sl.startsWith("done")||sl.startsWith("complete")?"Done"
             : sl.startsWith("not")?"Not Done":"Pending";
      let month = String(pickCol(r,["month"])).trim();
      if(!/^\d{4}-\d{2}$/.test(month)) month = defMonth;
      const rec = {
        id: genId("mbo"), ngoId, month,
        objNum: parseInt(pickCol(r,["objectiveno","objno","objnum","no"]))||1,
        objective: objective||"(untitled objective)",
        kr: kr||"(untitled key result)",
        timeline: String(pickCol(r,["timeline","targetdate","duedate"])).trim(),
        status,
        comment: String(pickCol(r,["comment","remark","note"])).trim(),
        ref: String(pickCol(r,["reference","ref","link"])).trim(),
        isOther: String(pickCol(r,["type"])).toLowerCase().includes("other")
      };
      stampEdit(rec);
      if(!DB.mbo) DB.mbo=[];
      DB.mbo.push(rec);
      added++;
    });
    if(!added){ toast("Couldn't find Objective / Key Result columns"); return; }
    MBO_MONTH[ngoId] = defMonth;
    await saveDB();
    closeModal();
    render();
    toast(added+" key result"+(added>1?"s":"")+" imported");
  }catch(e){
    console.error(e);
    toast("Couldn't read that file — is it a valid spreadsheet?");
  }
}
/* =====================================================================
   PAGE · TEAM MBO
   Every partnership lead's monthly commitments in one stream, grouped by
   urgency. Fed by uploading each lead's existing Excel file — see
   tmReadSheets(). A lead sees only their own rows; the PM sees all.

   Replaces the old per-NGO "Team OKR upload" page. The per-NGO OKR/MBO tab
   and its DB.mbo store are untouched — that holds a partner NGO's own
   objectives, which is a different thing from a lead's personal MBO.
   ===================================================================== */

/* The month filter defaults to "recent" — this calendar month and the one
   before it. The real files run 14 months back, and showing all of it buries
   the current month under a year of finished and abandoned rows. "All months"
   is one click away in the dropdown. */
let TM_FILTER = { person:"", month:"recent", priority:"", status:"", type:"" };

function tmRecentMonths(){
  const y = +TODAY_ISO.slice(0,4), m = +TODAY_ISO.slice(5,7);
  const prevY = m === 1 ? y - 1 : y;
  const prevM = m === 1 ? 12 : m - 1;
  return [ y + "-" + tmPad(m), prevY + "-" + tmPad(prevM) ];
}

function tmFilterRows(){
  const f = TM_FILTER;
  const recent = f.month === "recent" ? tmRecentMonths() : null;
  return visibleTeamMbo().filter(r=>{
    if(!r) return false;
    if(f.person && r.ownerId !== f.person) return false;
    if(recent){ if(recent.indexOf(r.month) < 0) return false; }
    else if(f.month && r.month !== f.month) return false;
    if(f.type   && r.type    !== f.type)   return false;
    if(f.status === "Done" && r.status !== "Done") return false;
    if(f.status === "open" && r.status === "Done") return false;
    if(f.priority === "top"){
      /* a rank of 0 is still a rank — test for null/undefined, not falsiness */
      const ranked = r.rank !== null && r.rank !== undefined && r.rank <= 3;
      if(!ranked && r.band !== "High") return false;
    }
    return true;
  });
}

function tmLeads(){
  return (DB.users||[]).filter(u=>u && (u.role==="APL" || u.role==="Programme"));
}
function tmOwnerName(id){
  const u = (DB.users||[]).find(x=>x && x.id===id);
  return u ? u.name : "Unknown";
}
function tmInitials(id){
  const parts = tmOwnerName(id).split(/\s+/).filter(Boolean);
  const s = parts.map(w=>w[0]||"").join("");
  return (s || "?").slice(0,2).toUpperCase();
}
function tmPriLabel(r){
  if(r.rank !== null && r.rank !== undefined) return "#" + r.rank;
  return r.band || "";
}
function tmDateLabel(r){
  if(!r.deadline) return r.deadlineRaw ? esc(r.deadlineRaw) : "—";
  const late = tmDaysLate(r, TODAY_ISO);
  if(late > 0) return late + "d late";
  if(late === 0) return "today";
  return new Date(r.deadline+"T00:00:00Z")
           .toLocaleDateString("en-GB",{ day:"numeric", month:"short", timeZone:"UTC" });
}

function pageTeamMbo(){
  const isPM = ME.role === "PM";
  /* a lead only ever sees themselves, so the person filter is pinned */
  if(!isPM) TM_FILTER.person = ME.id;

  const all    = visibleTeamMbo();
  const months = [...new Set(all.map(r=>r.month))].sort().reverse();
  const rows   = tmFilterRows();

  const grouped = {};
  rows.forEach(r=>{ const b = tmBucket(r, TODAY_ISO); (grouped[b] = grouped[b] || []).push(r); });
  Object.keys(grouped).forEach(k=>{
    grouped[k].sort((a,b)=>{
      if(!a.deadline && !b.deadline) return 0;
      if(!a.deadline) return 1;
      if(!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });
  });

  const sel = (id, label, value, opts) => `
    <label class="tm-f">
      <span>${label}</span>
      <select id="tmf_${id}" onchange="tmSetFilter('${jsArg(id)}',this.value)">
        ${opts.map(o=>`<option value="${esc(o.v)}" ${o.v===value?"selected":""}>${esc(o.t)}</option>`).join("")}
      </select>
    </label>`;

  const filters = `
    <div class="tm-filters">
      ${isPM ? sel("person","Person",TM_FILTER.person,
          [{v:"",t:"Everyone"}].concat(tmLeads().map(u=>({v:u.id,t:u.name})))) : ""}
      ${sel("month","Month",TM_FILTER.month,
          [{v:"recent",t:"Last 2 months"},{v:"",t:"All months"}]
            .concat(months.map(m=>({v:m,t:monthLong(m)}))))}
      ${sel("priority","Priority",TM_FILTER.priority,
          [{v:"",t:"Any priority"},{v:"top",t:"Top priority only"}])}
      ${sel("status","Status",TM_FILTER.status,
          [{v:"",t:"Any status"},{v:"open",t:"Not finished"},{v:"Done",t:"Done"}])}
      ${sel("type","Type",TM_FILTER.type,
          [{v:"",t:"Key results + actions"},{v:"kr",t:"Key results"},{v:"action",t:"Action items"}])}
    </div>`;

  const body = TM_BUCKETS.map(b=>{
    const list = grouped[b.key];
    if(!list || !list.length) return "";
    const cls = b.key==="overdue" ? " tm-bk-over" : "";
    return `<div class="tm-bk${cls}">${b.label} — ${list.length}</div>` +
      list.map(r=>{
        const late = r.deadline && tmDaysLate(r, TODAY_ISO) > 0;
        const pri  = tmPriLabel(r);
        return `<div class="tm-row" onclick="tmOpenRow('${jsArg(r.id)}')">
          <div class="tm-av" title="${esc(tmOwnerName(r.ownerId))}">${esc(tmInitials(r.ownerId))}</div>
          <div class="tm-tx">
            <div class="tm-t1">${esc(r.title)}</div>
            <div class="tm-t2">${esc(tmOwnerName(r.ownerId))}${r.objective?" · "+esc(r.objective):""}</div>
          </div>
          ${pri?`<span class="tm-tg tm-pri">${esc(pri)}</span>`:""}
          <span class="tm-tg ${r.type==="kr"?"tm-kr":"tm-ai"}">${r.type==="kr"?"Key result":"Action"}</span>
          <div class="tm-dt${late?" tm-late":""}">${tmDateLabel(r)}</div>
        </div>`;
      }).join("");
  }).join("");

  /* An empty last-2-months view usually means nobody has uploaded lately,
     not that something is broken — say which, and offer the way out. */
  const emptyMsg = !all.length
    ? (isPM ? "No MBOs uploaded yet. Use <b>Upload MBO</b> to bring in a lead's spreadsheet."
            : "Nothing here yet — your MBO hasn't been uploaded.")
    : (TM_FILTER.month === "recent"
        ? "Nothing for " + monthLong(tmRecentMonths()[1]) + " or "
          + monthLong(tmRecentMonths()[0]) + ". There is older MBO here — "
          + `<a href="#" onclick="tmSetFilter('month','');return false">show all months</a>.`
        : "Nothing matches these filters.");
  const empty = `<div class="empty"><div class="mk">📋</div><p>${emptyMsg}</p></div>`;

  return `
    <div class="phead">
      <div><h1>Team MBO</h1><p class="sub">Monthly objectives and action items, most urgent first</p></div>
      ${isPM?`<button class="btn accent" onclick="tmOpenUpload()">↑ Upload MBO</button>`:""}
    </div>
    ${filters}
    <div class="panel tm-panel">${body || empty}</div>`;
}

/* ---------------------------------------------------------------------
   Upload. Parsed but NOT saved until the user has seen the preview and
   pressed Import.
   --------------------------------------------------------------------- */
let TM_PENDING = null;

const TM_FLAG_LABELS = {
  repaired:     "Deadline corrected",
  baddate:      "Deadline unreadable",
  wildyear:     "Year looks wrong",
  noyear:       "Could not tell which year",
  skippedsheet: "Sheet skipped"
};

function tmPreviewHtml(res){
  const krs  = res.rows.filter(r=>r.type==="kr").length;
  const acts = res.rows.filter(r=>r.type==="action").length;

  if(!res.rows.length){
    /* Say what was actually looked at. A bare "couldn't read it" leaves the
       user with nothing to act on, and every lead's file differs slightly. */
    const seen = res.seen || [];
    const sheetLines = seen.length ? `
        <div class="tm-pv-m">Sheets in that file</div>
        ${seen.map(s=>`<div class="tm-pv-r">${esc(s.name)} —
            ${s.kind
              ? (s.blocks ? s.blocks+" month block"+(s.blocks===1?"":"s")+" found, but no rows under them"
                          : "recognised, but no month headings found inside")
              : "not read (its name doesn't look like an MBO, OKR or Action Items sheet)"}
          </div>`).join("")}` : "";
    return `<div class="tm-pv-empty">
        <b>Nothing was read, and nothing has been saved.</b><br>
        A month needs a heading naming the month and year — <i>June 2026</i>, or
        <i>MBO - June 2026</i> — with a row beneath it naming the columns, one of which
        is the key result or action item.
      </div>${sheetLines}
      <div class="tm-pv-note">If this file looks right to you, send it over — it is
        probably a layout variation the reader hasn't met yet.</div>`;
  }

  const plural = (n, one) => n + " " + one + (n===1?"":"s");
  const summary = `<div class="tm-pv-sum">
      Read <b>${plural(krs,"key result")}</b> and <b>${plural(acts,"action item")}</b>
      across <b>${plural(res.months.length,"month")}</b> for <b>${esc(res.ownerName)}</b>.
    </div>`;

  const byMonth = {};
  res.rows.forEach(r=>{ (byMonth[r.month] = byMonth[r.month] || []).push(r); });
  const table = Object.keys(byMonth).sort().reverse().map(m=>`
      <div class="tm-pv-m">${monthLong(m)} — ${byMonth[m].length}</div>
      ${byMonth[m].slice(0,5).map(r=>`<div class="tm-pv-r">${esc(r.title)}</div>`).join("")}
      ${byMonth[m].length>5?`<div class="tm-pv-more">+ ${byMonth[m].length-5} more</div>`:""}
    `).join("");

  const flags = res.flags.length ? `
      <div class="tm-pv-flags">
        <div class="tm-pv-fh">⚠ ${res.flags.length} thing${res.flags.length===1?"":"s"} that needs a look</div>
        ${res.flags.map(f=>`<div class="tm-pv-f">
            <b>${esc(TM_FLAG_LABELS[f.kind]||f.kind)}</b> —
            ${esc(f.title)}${f.month?" ("+esc(f.month)+")":""}: ${esc(f.detail)}
          </div>`).join("")}
      </div>` : "";

  const replacing = `<div class="tm-pv-note">
      Importing replaces ${esc(res.ownerName)}'s existing rows for
      ${res.months.length===1?"that month":"those months"}. Other months and other
      people are left alone.
    </div>`;

  return summary + table + flags + replacing;
}

async function tmReadFile(){
  const inp = el("tmFile"), out = el("tmPreview"), btn = el("tmImportBtn");
  if(btn) btn.disabled = true;
  TM_PENDING = null;
  if(!inp || !inp.files || !inp.files[0]){ if(out) out.innerHTML = ""; return; }
  if(typeof XLSX === "undefined"){
    out.innerHTML = `<div class="tm-pv-empty">The spreadsheet reader didn't load — check your connection and reopen this window.</div>`;
    return;
  }
  const ownerId = el("tmOwner").value;
  out.innerHTML = `<div class="tm-pv-sum">Reading…</div>`;
  try{
    const buf = await inp.files[0].arrayBuffer();
    const wb  = XLSX.read(buf, { type:"array" });
    /* header:1 gives raw row arrays, which is what the block reader needs —
       sheet_to_json's default object mode assumes ONE header row per sheet,
       and these files carry one per month. */
    const sheets = wb.SheetNames.map(name=>({
      name: name,
      cells: XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:"", blankrows:true })
    }));
    const res = tmReadSheets(sheets, ownerId, genId("imp"), TODAY_ISO);
    res.ownerName = tmOwnerName(ownerId);
    res.ownerId   = ownerId;
    TM_PENDING = res;
    out.innerHTML = tmPreviewHtml(res);
    if(btn) btn.disabled = !res.rows.length;
  }catch(e){
    console.error(e);
    out.innerHTML = `<div class="tm-pv-empty">Couldn't read that file — is it a valid spreadsheet?</div>`;
  }
}

async function tmConfirmImport(){
  if(!TM_PENDING || !TM_PENDING.rows.length){ toast("Nothing to import"); return; }
  const res = TM_PENDING;
  if(ME.role!=="PM" && res.ownerId!==ME.id){ toast("You can only upload your own OKRs"); return; }
  DB.teamMbo = tmReplaceMonths(DB.teamMbo||[], res.ownerId, res.months, res.rows);
  TM_PENDING = null;
  if(CUR_PAGE==="myokr"){ V4.myPerson = res.ownerId; V4.myMonth = res.months.slice().sort().pop(); V4.myView = "kr"; }
  await saveDB();
  closeModal();
  render();
  toast(res.rows.length + " row" + (res.rows.length===1?"":"s") + " imported for " + res.ownerName);
}

function ngoBudgetTab(ngoId){

  if(!b) return `<div class="panel"><div class="empty"><div class="mk">▦</div>
    <p>No budget uploaded for ${esc(n.short)}.</p><br>

  const spentUpto = ngoSpendUpto(ngoId,CUR_MONTH);
  const utilPct   = pct(spentUpto, b.totalAnnual);
  const elapsed   = monthsElapsed(CUR_MONTH);
  const planUpto  = b.monthlyPlan.slice(0,elapsed).reduce((a,c)=>a+c,0);
  const variance  = spentUpto - planUpto;
  const utilCls   = utilPct>95?"red": utilPct<55?"amber":"green";
  const over      = variance>0;

  // per-month + cumulative running totals
  let cumPlan=0, cumActual=0;
  const monthRows = FY_MONTHS.map((m,i)=>{
    const plan=b.monthlyPlan[i];
    const actual=ngoSpendForMonth(ngoId,m);
    const reported = m<=CUR_MONTH && actual>0;
    cumPlan += plan;
    if(reported) cumActual += actual;
    return {m,plan,actual,reported,cumPlan,cumActual};
  });
  const linePts = monthRows.map(r=>({
    label:monthLabel(r.m).split(" ")[0],
    cumPlan:r.cumPlan,
    cumActual:r.cumActual,
    reported:r.reported
  }));

  return `
  <div class="sec-head">
    <h2>Budget vs Actual</h2>
    <div class="sh-act">
      <button class="btn ghost sm" style="color:var(--red)" onclick="clearBudget('${jsArg(ngoId)}')">✕ Clear budget</button>
      <button class="btn accent sm" onclick="openBudgetUpload('${jsArg(ngoId)}')">✎ Edit budget plan</button>
    </div>
  </div>

  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-card">
      <div class="stat-ico blue">₹</div>
      <div><div class="stat-l">Approved Budget</div>
        <div class="stat-v">${fmtRs(b.totalAnnual)}</div>
        <div class="stat-sub">${DB.meta.fyLabel} plan</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-ico ${utilCls}">◔</div>
      <div><div class="stat-l">Utilised to ${monthLabel(CUR_MONTH)}</div>
        <div class="stat-v">${fmtRs(spentUpto)}</div>
        <div class="stat-sub" style="color:var(--${utilCls})">${utilPct}% of approved budget</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-ico blue">◑</div>
      <div><div class="stat-l">Budget remaining</div>
        <div class="stat-v">${fmtRs(Math.max(0,b.totalAnnual-spentUpto))}</div>
        <div class="stat-sub">${pct(Math.max(0,b.totalAnnual-spentUpto),b.totalAnnual)}% of the approved budget unspent</div></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <div class="panel-h">
      <h3>Cumulative spend — planned vs actual</h3>
      <span class="note">running totals across the year</span>
    </div>
    <div class="panel-b">
      <div class="cum-readout ${over?'over':'under'}">
        By <b>${monthLong(CUR_MONTH)}</b> the plan is to have spent <b>${fmtRsFull(planUpto)}</b>;
        actual spend is <b>${fmtRsFull(spentUpto)}</b> —
        <span class="cum-verdict">${over
          ? 'overspending by '+fmtRsFull(variance)
          : variance===0 ? 'exactly on plan'
          : 'underspending by '+fmtRsFull(-variance)}</span>.
      </div>
      ${svgCumulativeLine(linePts)}
    </div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <div class="panel-h"><h3>Month-by-month spend</h3><span class="note">planned vs debit-note actuals</span></div>
    <div class="panel-b">
      ${svgBudgetBars(monthRows.map(r=>({
        label:monthLabel(r.m).split(" ")[0],
        plan:r.plan, actual:r.actual, reported:r.reported
      })))}
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><h3>Detailed breakdown</h3></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Month</th><th class="num">Planned</th><th class="num">Actual</th>
          <th class="num">Monthly variance</th><th class="num">Cumulative plan</th>
          <th class="num">Cumulative actual</th><th class="num">Running variance</th>
        </tr></thead>
        <tbody>
        ${monthRows.map(r=>{
          const d=r.actual-r.plan;
          const runVar = r.reported? (r.cumActual-r.cumPlan) : null;
          return `<tr>
            <td><b>${monthLabel(r.m)}</b>${r.m===CUR_MONTH?' <span class="badge blue" style="font-size:9px">current</span>':''}</td>
            <td class="num">${fmtRsFull(r.plan)}</td>
            <td class="num">${r.reported?fmtRsFull(r.actual):'<span style="color:var(--ink-3)">—</span>'}</td>
            <td class="num" style="color:${r.reported?(d>0?'var(--red)':'var(--green)'):'var(--ink-3)'}">${r.reported?(d>=0?'+':'')+fmtRs(d):'—'}</td>
            <td class="num" style="color:var(--ink-3)">${fmtRsFull(r.cumPlan)}</td>
            <td class="num">${r.reported?fmtRsFull(r.cumActual):'—'}</td>
            <td class="num" style="font-weight:700;color:${runVar==null?'var(--ink-3)':(runVar>0?'var(--red)':'var(--green)')}">${runVar==null?'—':(runVar>=0?'+':'')+fmtRs(runVar)}</td>

            <td class="num" style="color:${over?'var(--red)':'var(--green)'}">${variance>=0?'+':''}${fmtRs(variance)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

/* download a blank budget template — horizontal with Budget + Actual columns per month */
function downloadBudgetTemplate(ngoId){
  if(typeof XLSX==="undefined"){ toast("Spreadsheet library not loaded — check your connection"); return; }
  const n = ngoById(ngoId);
  const fyLabel = "FY "+FY_MONTHS[0].slice(0,4)+"-"+FY_MONTHS[11].slice(2,4);
  const monthName = ym=>{ const [yr,mo]=ym.split("-").map(Number); return MONTH_NAMES[mo]+" "+yr; };
  const rows=[
    [(n?n.name:"NGO")+" — Monthly Budget Plan "+fyLabel],
    ["Fill the Planned Budget column for every month (April to March). Keep the Month Code column unchanged, then upload this file back in the app."],
    ["Month Code","Month","Planned Budget (₹)"],
    ...FY_MONTHS.map(ym=>[ym, monthName(ym), 0]),
    ["","Total",{f:"SUM(C4:C15)"}]
  ];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  for(let i=0;i<12;i++){ const ref="A"+(4+i); if(ws[ref]) ws[ref].t="s"; } /* keep month codes as text */
  ws["!cols"]=[{wch:12},{wch:14},{wch:20}];
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:2}},{s:{r:1,c:0},e:{r:1,c:2}}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Budget Plan");
  XLSX.writeFile(wb, (n?n.short:"NGO")+"_Monthly_Budget_"+FY_MONTHS[0].slice(0,4)+"-"+FY_MONTHS[11].slice(2,4)+".xlsx");
}

/* parse an uploaded monthly-plan sheet into a 12-element array (or null).
   Supports two formats:
   1. Tall/list format  — columns: Month, Planned (one row per month)
   2. Wide/pivot format — months as column headers, rows are cost categories;
      uses the row whose first cell matches "total" (case-insensitive).
      Month columns are detected as Excel date serials, YYYY-MM strings, or
      short month names (Apr, May …). */
async function parseBudgetSheet(file){
  if(typeof XLSX==="undefined") return null;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf,{type:"array",cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];

    /* ---- helper: resolve a raw cell value to a FY_MONTHS index ---- */
    /* resolve any date-like value to a FY_MONTHS index.
       Handles: JS Date objects, Excel serial numbers, YYYY-MM strings,
       short/long month names, and the common case where Jan-Mar are stored
       with the fiscal-year START year (e.g. 2026-01 in an FY 2026-27 sheet)
       instead of the correct end year (2027-01). */
    const _dateToIdx = (yr, mo)=>{
      const ym = yr+"-"+String(mo).padStart(2,"0");
      let idx = FY_MONTHS.indexOf(ym);
      /* Jan/Feb/Mar stored with wrong year (start-year instead of end-year) */
      if(idx<0 && mo<=3){
        const altYm = (yr+1)+"-"+String(mo).padStart(2,"0");
        idx = FY_MONTHS.indexOf(altYm);
      }
      return idx;
    };
    const monthIndex = (raw)=>{
      if(raw==null || raw==="") return -1;
      /* Excel Date object (when cellDates:true) */
      if(raw instanceof Date){ const d2=new Date(raw.getTime()+12*3600*1000); return _dateToIdx(d2.getUTCFullYear(), d2.getUTCMonth()+1); }
      /* Excel date serial number (when raw:true) — days since 1899-12-30 */
      if(typeof raw==="number" && raw>40000 && raw<60000){
        const d = new Date(Math.round((raw-25569)*86400*1000));
        return _dateToIdx(d.getUTCFullYear(), d.getUTCMonth()+1);
      }
      const s = String(raw).trim();
      /* YYYY-MM */
      if(/^\d{4}-\d{2}$/.test(s)){
        const [yr,mo] = s.split("-").map(Number);
        return _dateToIdx(yr, mo);
      }
      /* ISO datetime string: 2027-03-01T00:00:00.000Z (SheetJS cellDates:true).
         Noon-shift guards against timezone month-shift (e.g. 28-Feb 18:30Z = 1-Mar IST). */
      if(/^\d{4}-\d{2}-\d{2}/.test(s)){
        const dt = new Date(s);
        if(!isNaN(dt)){ const d2=new Date(dt.getTime()+12*3600*1000); return _dateToIdx(d2.getUTCFullYear(), d2.getUTCMonth()+1); }
        const [yr,mo] = s.split("-").map(Number);
        return _dateToIdx(yr, mo);
      }
      /* Short/long month name: Apr, April, May … — match by month number only */
      const mn = s.slice(0,3).toLowerCase();
      const num = Object.keys(MONTH_NAMES).find(k=>MONTH_NAMES[k].toLowerCase()===mn);
      if(!num) return -1;
      return FY_MONTHS.findIndex(m=>(+m.split("-")[1])===(+num));
    };

    /* ---- attempt 1: tall/list format (Month + Planned columns) ----
       First locate the header row (a cell starting with "Month"), so title /
       instruction rows above the table don't swallow the headers. */
    const probe = XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false,dateNF:"YYYY-MM"});
    let hdrRow = 0;
    for(let ri=0;ri<Math.min(probe.length,10);ri++){
      if((probe[ri]||[]).some(c=>/^month/i.test(String(c).trim()))){ hdrRow=ri; break; }
    }
    const rows = XLSX.utils.sheet_to_json(ws,{defval:"",raw:false,dateNF:"YYYY-MM",range:hdrRow});
    const plan1 = FY_MONTHS.map(()=>0);
    let hit1 = 0; const seen1 = new Set();
    rows.forEach(r=>{
      const idx = monthIndex(pickCol(r,["month","mon"]));
      const amt = parseFloat(String(pickCol(r,["planned","plan","amount","budget"])).replace(/[^0-9.\-]/g,""));
      if(idx>=0 && !isNaN(amt)){ plan1[idx]=amt; hit1++; seen1.add(idx); }
    });
    if(hit1>=1){ window._bgMonthsRead=[...seen1]; return plan1; }

    /* ---- attempt 2: wide/pivot format (months as column headers) ----
       Read raw 2-D array so we can inspect every row and header cell. */
    const grid = XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
    /* Find the header row: the row that contains the most month-like values */
    let headerRowIdx = -1, headerColMap = {}; /* colIndex -> FY_MONTHS index */
    for(let ri=0;ri<Math.min(grid.length,10);ri++){
      const row = grid[ri];
      const map = {};
      for(let ci=1;ci<row.length;ci++){
        const mi = monthIndex(row[ci]);
        if(mi>=0) map[ci]=mi;
      }
      if(Object.keys(map).length > Object.keys(headerColMap).length){
        headerColMap = map; headerRowIdx = ri;
      }
    }
    if(headerRowIdx<0 || Object.keys(headerColMap).length===0) return null;

    /* Find the "Total" data row (first col contains "total", case-insensitive).
       Also accept "grand total". Fall back to the last non-empty numeric row. */
    const plan2 = FY_MONTHS.map(()=>0);
    let hit2 = 0;
    let fallbackPlan = null, fallbackHit = 0;
    for(let ri=headerRowIdx+1;ri<grid.length;ri++){
      const row = grid[ri];
      const label = String(row[0]||"").trim().toLowerCase();
      /* Try every data row as a candidate and accumulate a fallback */
      const rowPlan = FY_MONTHS.map(()=>0); let rowHit=0;
      for(const [ci,mi] of Object.entries(headerColMap)){
        const v = parseFloat(String(row[ci]||"").replace(/[^0-9.\-]/g,""));
        if(!isNaN(v) && v>0){ rowPlan[mi]=v; rowHit++; }
      }
      if(rowHit>0 && rowHit>=fallbackHit){ fallbackPlan=rowPlan; fallbackHit=rowHit; }
      /* Prefer the explicit "Total" / "Grand Total" row */
      if((label==="total"||label.includes("grand total")||label.includes("total")) && rowHit>0){
        for(const [mi,v] of Object.entries(rowPlan)) plan2[mi]=v;
        hit2=rowHit; break;
      }
    }
    window._bgMonthsRead=[...new Set(Object.values(headerColMap))];
    if(hit2>0) return plan2;
    if(fallbackPlan && fallbackHit>0) return fallbackPlan;

    return null;
  }catch(e){ console.error(e); return null; }
}

async function saveBudgetPlan(ngoId){
  const annualInput = parseFloat(el("bgAnnual").value);
  const fileInput = el("bgFile");
  let monthlyPlan = null;

  // a sheet, if provided, defines the plan directly
  if(fileInput && fileInput.files && fileInput.files[0]){
    monthlyPlan = await parseBudgetSheet(fileInput.files[0]);
    if(!monthlyPlan){ toast("Couldn't read a Month / Planned column from that file"); return; }
    const _read = (window._bgMonthsRead||[]);
    if(_read.length && _read.length<12){
      const _missing = FY_MONTHS.map((m,i)=>_read.includes(i)?null:monthLabel(m)).filter(Boolean);
      toast("⚠ Read "+_read.length+" of 12 months — missing: "+_missing.join(", ")+". Saved anyway — please check the sheet.");
    }
  }
  const existing = DB.budgets[ngoId];

  // the Salary/Other monthly grid, if the user actually edited it, defines the plan next.
  // (window._bgGridDirty — NOT just "grid has positive values", since it's pre-filled
  // with the existing plan and would otherwise silently override a plain Annual edit.)
  let salaryPlan=null, otherPlan=null;
  if(!monthlyPlan && el("bbS0") && window._bgGridDirty){
    const gs = FY_MONTHS.map((m,i)=>parseFloat(el("bbS"+i).value)||0);
    const go = FY_MONTHS.map((m,i)=>parseFloat(el("bbO"+i).value)||0);
    if(gs.some(v=>v>0) || go.some(v=>v>0)){
      salaryPlan = gs; otherPlan = go;
      monthlyPlan = FY_MONTHS.map((m,i)=>gs[i]+go[i]);
    }
  }

  if(!monthlyPlan){
    if(!annualInput || annualInput<=0){ toast("Enter a valid annual budget amount"); return; }
    const split = el("bgSplit").value;
    if(split==="keep" && existing && existing.monthlyPlan && existing.totalAnnual){
      const oldTotal = existing.monthlyPlan.reduce((a,c)=>a+c,0) || 1;
      monthlyPlan = existing.monthlyPlan.map(v=>Math.round(v/oldTotal*annualInput));
    } else {
      const per = Math.round(annualInput/12);
      monthlyPlan = FY_MONTHS.map(()=>per);
    }
  }
  const annual = monthlyPlan.reduce((a,c)=>a+c,0);
  // keep the Salary/Other monthly split in step when the grid wasn't used
  if(!salaryPlan){
    const exS = (existing && existing.annual && +existing.annual.Salary) || 0;
    const exT = (existing && +existing.totalAnnual) || 0;
    const share = exT>0 ? Math.min(1, Math.max(0, exS/exT)) : 0;
    salaryPlan = monthlyPlan.map(v=>Math.round(v*share));
    otherPlan  = monthlyPlan.map((v,i)=>v-salaryPlan[i]);
  }
  const salarySum = salaryPlan.reduce((a,c)=>a+c,0), otherSum = annual-salarySum;
  // category split: Salary is exact; spread the rest over known proportions
  let annualCats = {}; BUDGET_CATS.forEach(c=>annualCats[c]=0);
  annualCats.Salary = salarySum;
  const exNon = existing && existing.annual
    ? BUDGET_CATS.filter(c=>c!=="Salary").reduce((a,c)=>a+(+existing.annual[c]||0),0) : 0;
  if(exNon>0) BUDGET_CATS.filter(c=>c!=="Salary").forEach(c=>annualCats[c]=Math.round((+existing.annual[c]||0)/exNon*otherSum));
  else annualCats.Programme = otherSum;
  const rec = { annual:annualCats, totalAnnual:annual, monthlyPlan, salaryPlan, otherPlan,
                editedBy:ME?ME.name:"—", editedAt:TODAY_ISO };
  if(existing && existing.book) rec.book = existing.book;  // keep workbook export metadata
  DB.budgets[ngoId] = rec;
  await saveDB(); closeModal(); render();
  toast("Budget plan saved for "+ngoById(ngoId).short);
}

/* live totals under the Salary/Other grid in the budget modal */
/* called by a REAL keystroke in the Salary/Other grid — and ONLY there. bbGridTotals()
   itself is also called once by openBudgetUpload() just to paint the initial totals
   footer, so the dirty flag must NOT live inside bbGridTotals() (that made every modal
   open look "edited" and silently broke plain Annual-field saves — the V57 bug). */
function bbGridEdited(){ window._bgGridDirty = true; bbGridTotals(); }
function bbGridTotals(){
  let s=0,o=0;
  FY_MONTHS.forEach((m,i)=>{
    s += parseFloat(el("bbS"+i)&&el("bbS"+i).value)||0;
    o += parseFloat(el("bbO"+i)&&el("bbO"+i).value)||0;
  });
  if(el("bbSt")) el("bbSt").textContent = fmtRsFull(s);
  if(el("bbOt")) el("bbOt").textContent = fmtRsFull(o);
  if(el("bbGt")) el("bbGt").textContent = fmtRsFull(s+o);
}

function clearBudget(ngoId){
  if(!canEditNgo(ngoId)){ toast("You don't have access to change this NGO's budget"); return; }
  const n = ngoById(ngoId);
  confirmAction("Clear budget plan?",
    `The entire budget plan for <b>${esc(n?n.short:'this NGO')}</b> — including the annual amount and all monthly figures — will be removed. Debit notes are not affected.`,
    async ()=>{
      delete DB.budgets[ngoId];
      await saveDB(); closeModal(); render();
      toast("Budget plan cleared for "+(n?n.short:'NGO'));
    }, "Clear budget", true);
}

/* =====================================================================
   FINALIZED BUDGET WORKBOOK — import + export
   Reproduces the finalized "Partnership Budget" file: a Summary sheet,
   an All Trusts (budget vs actual) sheet and one sheet per partner
   trust, with the same layout, merges and formulas. Budgets come from
   DB.budgets (salaryPlan/otherPlan); actuals flow from debit notes.
   ===================================================================== */
const BB_FY       = "FY "+FY_MONTHS[0].slice(0,4)+"-"+FY_MONTHS[11].slice(2,4);
const BB_FY_SHORT = FY_MONTHS[0].slice(0,4)+"-"+FY_MONTHS[11].slice(2,4);
/* 0-based column index of each month's Budget column (its Actual is +1):
   F H J · N P R · V X Z · AD AF AH, with a quarter pair after each block */
const BB_MCOL = [5,7,9, 13,15,17, 21,23,25, 29,31,33];
const BB_QCOL = [11,19,27,35];   /* L T AB AJ */
const BB_YCOL = 37;              /* AL (year Budget), AM = Actual */

function bbToday(){ const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear(); }
function bbCol(c){ return XLSX.utils.encode_col(c); }
function bbSheetSafe(s){ return String(s||"Sheet").replace(/[\[\]\*\?\/\\:]/g," ").replace(/\s+/g," ").trim().slice(0,31)||"Sheet"; }

/* per-month Salary vs Other actuals for one NGO, from debit notes */
function bbMonthActuals(ngoId){
  const sal=FY_MONTHS.map(()=>0), oth=FY_MONTHS.map(()=>0);
  DB.debits.forEach(d=>{
    if(d.ngoId!==ngoId || !dnCounts(d)) return;
    const i=FY_MONTHS.indexOf(d.month); if(i<0) return;
    if(d.category==="Salary") sal[i]+=(+d.amount||0); else oth[i]+=(+d.amount||0);
  });
  return {sal,oth};
}

/* the NGOs that appear in the workbook, in workbook order.
   After an import every included NGO carries budget.book metadata; before
   any import, fall back to every NGO that has a budget. */
function bbExportList(){
  const withBook = DB.ngos.filter(n=>DB.budgets[n.id] && DB.budgets[n.id].book);
  if(withBook.length)
    return withBook.slice().sort((a,b)=>(DB.budgets[a.id].book.order||999)-(DB.budgets[b.id].book.order||999));
  return DB.ngos.filter(n=>DB.budgets[n.id] && DB.budgets[n.id].totalAnnual>0);
}
function bbMeta(n){
  const b=DB.budgets[n.id]||{}, k=b.book||{};
  return { sheet: bbSheetSafe(k.sheet||n.short||n.name),
           trust: k.trust||n.name,
           summaryName: k.summaryName||k.trust||n.name,
           atName: k.atName||k.trust||n.name,
           /* with workbook metadata the objective is authoritative even when
              blank (the finalized file leaves some blank on purpose) */
           objective: b.book ? (k.objective||"") : (n.vertical||""),
           site: k.site||"" };
}

/* ---------- export ---------- */
/* styles only take effect when the style-capable writer loads; the plain
   SheetJS build silently ignores them, so the export still works offline */
function bbStyles(){
  const bd={style:"thin",color:{rgb:"C9C9C9"}};
  const border={top:bd,bottom:bd,left:bd,right:bd};

    grand:{font:{bold:true},fill:{patternType:"solid",fgColor:{rgb:"C5D9F1"}}}
