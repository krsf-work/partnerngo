  --v-n0:#ffffff; --v-n50:#f7f8fb; --v-n100:#f0f2f7; --v-n200:#e6e9f0; --v-n300:#d5dae4;
  --v-n400:#a9b1c1; --v-n500:#7d8699; --v-n600:#596377; --v-n700:#3c4558; --v-n800:#232a3b; --v-n900:#121726;
  --v-bg:#f5f6fa; --v-surface:#ffffff; --v-line:#e8eaf1;
  /* space (4px base) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  /* radius */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:999px;
  /* type */
  --t-xs:12px; --t-sm:13px; --t-base:15px; --t-md:16px; --t-lg:18px; --t-xl:22px; --t-2xl:28px;
  /* elevation */
  --e1:0 1px 2px rgba(18,23,38,.04),0 1px 1px rgba(18,23,38,.03);
  --e2:0 1px 2px rgba(18,23,38,.04),0 6px 20px rgba(18,23,38,.06);
  --e3:0 8px 30px rgba(18,23,38,.12),0 2px 6px rgba(18,23,38,.06);
  --e-primary:0 8px 22px rgba(91,63,192,.28);
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --d1:140ms; --d2:220ms; --d3:360ms;
  /* layout */
  --appbar-h:60px; --tabbar-h:66px; --side-w:248px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
body{background:var(--v-bg);font-size:14px}
::selection{background:var(--v-primary-subtle)}

/* ---------- icons ---------- */
.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.i.sm{width:16px;height:16px}
.i.xs{width:14px;height:14px}
.i.lg{width:24px;height:24px}

/* ---------- shell: desktop sidebar ---------- */
.side{background:var(--v-surface);border-right:1px solid var(--v-line);width:var(--side-w)}
.side .brand{padding:20px 20px 14px;border-bottom:none}
.v-brand{display:flex;align-items:center;gap:10px}
.v-logo{width:34px;height:34px;border-radius:10px;background:var(--v-grad);box-shadow:var(--e-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;letter-spacing:-.02em}
.v-brand b{font-size:17px;font-weight:750;letter-spacing:-.02em;color:var(--v-n900)}
.v-brand small{display:block;font-size:11px;color:var(--v-n500);font-weight:500;margin-top:1px}
.nav{padding:6px 12px 12px}
.nav-sec{font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--v-n500);font-weight:600;padding:18px 12px 6px}
.nav-item{border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:550;color:var(--v-n700);gap:11px;transition:background var(--d1) var(--ease),color var(--d1) var(--ease);position:relative}
.nav-item:hover{background:var(--v-n100);color:var(--v-n900)}
.nav-item.active{background:var(--v-primary-subtle);color:var(--v-primary-ink)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--v-primary)}
.nav-item .ic{width:20px;font-size:14px;display:flex;align-items:center;justify-content:center}
.nav-item .ct{background:var(--v-n100);color:var(--v-n600);font-size:11px;font-weight:650;padding:1px 8px}
.nav-item.active .ct{background:var(--v-primary);color:#fff}
.nav-item .ct.hot{background:var(--v-error);color:#fff}
.side-foot{border-top:1px solid var(--v-line);padding:14px 16px}
.side-foot .av{background:var(--v-grad)}

/* ---------- shell: app bar ---------- */
.main{background:var(--v-bg)}
.topbar.v-appbar{position:sticky;top:0;z-index:40;height:var(--appbar-h);display:flex;align-items:center;gap:var(--s3);
  padding:0 var(--s6);background:color-mix(in srgb,var(--v-bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color var(--d2) var(--ease)}
.topbar.v-appbar.scrolled{border-bottom-color:var(--v-line)}
.v-appbar .hamburger{display:none!important}
.v-appbar-title{font-size:var(--t-lg);font-weight:700;letter-spacing:-.015em;color:var(--v-n900);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-appbar-back{width:38px;height:38px;border-radius:12px;display:none;align-items:center;justify-content:center;color:var(--v-n700);margin-left:-8px}
.v-appbar-back.show{display:flex}
.v-appbar-back:hover{background:var(--v-n100)}
.v-appbar-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.v-iconbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--v-n700);position:relative;transition:background var(--d1) var(--ease),transform var(--d1) var(--ease)}
.v-iconbtn:hover{background:var(--v-n100)}
.v-iconbtn:active{transform:scale(.94)}
.v-dot{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--v-error);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--v-bg);line-height:1}
.v-dot.pop{animation:v-pop .5s var(--ease-out)}
.v-avatar{width:34px;height:34px;border-radius:50%;background:var(--v-grad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.v-avatar.lg{width:52px;height:52px;font-size:17px}
.content{max-width:1180px;margin:0 auto;padding:var(--s2) var(--s6) var(--s12)}

/* ---------- shell: bottom tab bar (phone) ---------- */
.v-tabbar{display:none}
@media (max-width:767px){
  .side{display:none!important}
  .side-scrim{display:none!important}
  .topbar.v-appbar{padding:0 var(--s4)}
  .content{padding:var(--s1) var(--s4) calc(var(--tabbar-h) + var(--safe-b) + var(--s6))}
  .v-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--tabbar-h) + var(--safe-b));padding:6px 6px calc(6px + var(--safe-b));
    background:color-mix(in srgb,#fff 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--v-line)}
  .v-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--v-n500);font-size:10.5px;font-weight:600;position:relative;transition:color var(--d1) var(--ease)}
  .v-tab .i{transition:transform var(--d2) var(--ease-out)}
  .v-tab.on{color:var(--v-primary)}
  .v-tab.add .i{width:40px;height:40px;padding:9px;border-radius:50%;background:var(--v-primary);color:#fff;margin-top:-14px;box-shadow:0 6px 16px rgba(91,63,192,.35)}
  .v-tab.add span{color:var(--v-primary)}
  .v-tab.on .i{transform:translateY(-1px) scale(1.06)}
  .v-tab.on::before{content:"";position:absolute;top:4px;width:44px;height:30px;border-radius:12px;background:var(--v-primary-subtle);z-index:-1;animation:v-pill var(--d2) var(--ease-out)}
  .v-tab .v-dot{top:2px;right:calc(50% - 22px);border-color:#fff}
  .toast{bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px)!important}
}
body.ngo-mode .v-tabbar, body.ngo-mode .topbar.v-appbar{display:none!important}

/* ---------- page scaffolding ---------- */
.v-page{animation:v-enter var(--d3) var(--ease-out) both}
.v-page.noanim{animation:none}
.v-stagger > *{animation:v-enter var(--d3) var(--ease-out) both}
.v-stagger > *:nth-child(2){animation-delay:40ms}.v-stagger > *:nth-child(3){animation-delay:80ms}
.v-stagger > *:nth-child(4){animation-delay:120ms}.v-stagger > *:nth-child(5){animation-delay:160ms}
.v-stagger > *:nth-child(6){animation-delay:200ms}.v-stagger > *:nth-child(n+7){animation-delay:240ms}
.v-noanim .v-stagger > *{animation:none}
.v-head{display:flex;align-items:flex-end;gap:var(--s4);margin:var(--s4) 0 var(--s5);flex-wrap:wrap}
.v-head h1{font-size:var(--t-2xl);font-weight:750;letter-spacing:-.025em;line-height:1.15;color:var(--v-n900)}
.v-head p{color:var(--v-n500);font-size:var(--t-sm);margin-top:4px}
.v-head .v-head-act{margin-left:auto;display:flex;gap:var(--s2)}
.v-sec{display:flex;align-items:center;gap:var(--s2);margin:var(--s8) 0 var(--s3)}
.v-sec h2{font-size:var(--t-md);font-weight:700;letter-spacing:-.01em;color:var(--v-n900)}
.v-sec .v-sec-n{font-size:var(--t-xs);font-weight:650;color:var(--v-n500);background:var(--v-n100);padding:2px 8px;border-radius:var(--r-full)}
.v-sec .v-link{margin-left:auto}
.v-grid{display:grid;gap:var(--s4)}
.v-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.v-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.v-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1023px){.v-grid.c3,.v-grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){
  .v-head{margin:var(--s2) 0 var(--s4)} .v-head h1{font-size:var(--t-xl)}
  .v-grid.c2,.v-grid.c3{grid-template-columns:1fr}
  .v-grid.c4{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
  .v-hide-m{display:none!important}
}
@media (min-width:768px){.v-only-m{display:none!important}}

/* ---------- components ---------- */
.v-card{background:var(--v-surface);border:1px solid var(--v-line);border-radius:var(--r-lg);box-shadow:var(--e1);transition:box-shadow var(--d2) var(--ease),transform var(--d2) var(--ease),border-color var(--d2) var(--ease)}
.v-card.pad{padding:var(--s5)}
.v-card.tap{cursor:pointer}
.v-card.tap:hover{box-shadow:var(--e2);border-color:var(--v-n300)}
.v-card.tap:active{transform:scale(.985)}
.v-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);font-size:var(--t-sm);font-weight:650;
  background:var(--v-surface);color:var(--v-n800);border:1px solid var(--v-n300);transition:all var(--d1) var(--ease);white-space:nowrap}
.v-btn:hover{border-color:var(--v-n400);background:var(--v-n50)}
.v-btn:active{transform:scale(.97)}
.v-btn.primary{background:var(--v-primary);border-color:var(--v-primary);color:#fff;box-shadow:0 1px 2px rgba(91,63,192,.3)}
.v-btn.primary:hover{background:var(--v-primary-hover);border-color:var(--v-primary-hover)}
.v-btn.ghost{background:transparent;border-color:transparent;color:var(--v-primary)}
.v-btn.ghost:hover{background:var(--v-primary-subtle)}
.v-btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.v-btn.danger{color:var(--v-error);border-color:color-mix(in srgb,var(--v-error) 35%,transparent)}
.v-btn:focus-visible,.v-iconbtn:focus-visible,.v-tab:focus-visible,.v-chip:focus-visible,.v-card.tap:focus-visible,.v-seg button:focus-visible{outline:2px solid var(--v-primary);outline-offset:2px}
.v-link{color:var(--v-primary);font-weight:650;font-size:var(--t-sm);display:inline-flex;align-items:center;gap:2px}
.v-link:hover{color:var(--v-primary-hover)}
.v-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-full);font-size:11.5px;font-weight:650;white-space:nowrap;background:var(--v-n100);color:var(--v-n600)}
.v-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.v-badge.nodot::before{display:none}
.v-badge.ok{background:var(--v-success-subtle);color:var(--v-success)}
.v-badge.warn{background:var(--v-warning-subtle);color:var(--v-warning)}
.v-badge.bad{background:var(--v-error-subtle);color:var(--v-error)}
.v-badge.info{background:var(--v-info-subtle);color:var(--v-info)}
.v-badge.brand{background:var(--v-primary-subtle);color:var(--v-primary-ink)}
.v-chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px 2px var(--s1);margin:0 -2px;scroll-snap-type:x proximity}
.v-chips::-webkit-scrollbar{display:none}
.v-chip{flex:none;height:34px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--v-n300);background:var(--v-surface);font-size:12.5px;font-weight:600;color:var(--v-n700);transition:all var(--d1) var(--ease);display:inline-flex;align-items:center;gap:6px;scroll-snap-align:start}
.v-chip:hover{border-color:var(--v-n400)}
.v-chip.on{background:var(--v-n900);border-color:var(--v-n900);color:#fff}
.v-chip .n{font-size:11px;opacity:.7}
.v-seg{display:flex;background:var(--v-n100);border-radius:var(--r-md);padding:4px;gap:2px;position:relative}
.v-seg button{flex:1;height:36px;border-radius:9px;font-size:var(--t-sm);font-weight:650;color:var(--v-n600);transition:color var(--d1) var(--ease),background var(--d2) var(--ease),box-shadow var(--d2) var(--ease);display:flex;align-items:center;justify-content:center;gap:6px}
.v-seg button.on{background:var(--v-surface);color:var(--v-n900);box-shadow:var(--e1),0 0 0 1px var(--v-line)}
.v-seg button .n{font-size:11px;font-weight:700;color:var(--v-n500)}
.v-search{position:relative}
.v-search input{width:100%;height:42px;border-radius:var(--r-md);border:1px solid var(--v-n300);padding:0 14px 0 40px;font-size:var(--t-base);background:var(--v-surface);transition:border-color var(--d1),box-shadow var(--d1)}
.v-search input:focus{outline:none;border-color:var(--v-primary);box-shadow:0 0 0 4px var(--v-primary-subtle)}
.v-search .i{position:absolute;left:13px;top:11px;color:var(--v-n500)}
.v-meter{height:8px;border-radius:var(--r-full);background:var(--v-n100);overflow:hidden;position:relative}
.v-meter > i{display:block;height:100%;border-radius:inherit;background:var(--v-primary);transform-origin:left;animation:v-grow .9s var(--ease-out) both}
.v-meter.ok > i{background:var(--v-success)} .v-meter.warn > i{background:var(--v-warning)} .v-meter.bad > i{background:var(--v-error)}
.v-meter.thin{height:5px}
.v-ring{position:relative;flex:none}
.v-ring svg{transform:rotate(-90deg);display:block}
.v-ring .trk{stroke:var(--v-n100)}
.v-ring .val{stroke:var(--v-primary);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease-out);animation:v-ring 1.1s var(--ease-out) both}
.v-ring.ok .val{stroke:var(--v-success)}
.v-ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:750;letter-spacing:-.02em;color:var(--v-n900);line-height:1}
.v-ring .lbl small{font-size:10px;font-weight:600;color:var(--v-n500);margin-top:3px;letter-spacing:0}
.v-empty{text-align:center;padding:var(--s10) var(--s6);color:var(--v-n500)}
.v-empty .v-empty-ic{width:56px;height:56px;border-radius:18px;margin:0 auto var(--s4);display:flex;align-items:center;justify-content:center;background:var(--v-primary-subtle);color:var(--v-primary)}
.v-empty .v-empty-ic.ok{background:var(--v-success-subtle);color:var(--v-success)}
.v-empty h3{font-size:var(--t-md);color:var(--v-n900);font-weight:700;margin-bottom:4px}
.v-empty p{font-size:var(--t-sm);max-width:340px;margin:0 auto}
.v-empty .v-btn{margin-top:var(--s4)}
.v-skel{background:linear-gradient(90deg,var(--v-n100) 0%,var(--v-n50) 50%,var(--v-n100) 100%);background-size:200% 100%;animation:v-shimmer 1.3s linear infinite;border-radius:var(--r-sm)}
.v-muted{color:var(--v-n500)}
.v-num{font-variant-numeric:tabular-nums}

/* ---------- list rows ---------- */
.v-list{background:var(--v-surface);border:1px solid var(--v-line);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.v-row{display:flex;align-items:center;gap:var(--s3);padding:14px var(--s4);border-bottom:1px solid var(--v-line);transition:background var(--d1) var(--ease);min-height:60px;position:relative}
.v-row:last-child{border-bottom:none}
.v-row.tap{cursor:pointer}
.v-row.tap:hover{background:var(--v-n50)}
.v-row-main{flex:1;min-width:0}
.v-row-t{font-size:14px;font-weight:600;color:var(--v-n900);line-height:1.35;overflow-wrap:anywhere}
.v-row-s{font-size:12.5px;color:var(--v-n500);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.v-row-s .sep{width:3px;height:3px;border-radius:50%;background:var(--v-n400)}
.v-row-end{flex:none;display:flex;align-items:center;gap:var(--s2)}
.v-row.done .v-row-t{color:var(--v-n500);text-decoration:line-through;text-decoration-color:var(--v-n300)}
.v-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--v-n300);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:all var(--d2) var(--ease-out);background:var(--v-surface)}
.v-check:hover{border-color:var(--v-success)}
.v-check .i{width:14px;height:14px;stroke-width:3}
.v-check.on{background:var(--v-success);border-color:var(--v-success);color:#fff;animation:v-pop .45s var(--ease-out)}
.v-check:disabled{opacity:.5;cursor:not-allowed}
.v-kind{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.v-kind.k-mykr{background:var(--v-primary-subtle);color:var(--v-primary)}
.v-kind.k-myact{background:var(--v-info-subtle);color:var(--v-info)}
.v-kind.k-task{background:var(--v-warning-subtle);color:var(--v-warning)}
.v-kind.k-ngokr{background:var(--v-success-subtle);color:var(--v-success)}
.v-due{font-size:12px;font-weight:650;white-space:nowrap}
.v-due.late{color:var(--v-error)} .v-due.today{color:var(--v-warning)} .v-due.week{color:var(--v-n700)} .v-due.later{color:var(--v-n500)}

/* ---------- home ---------- */
.v-hello{display:flex;align-items:center;gap:var(--s4);margin:var(--s4) 0 var(--s5)}
.v-hello h1{font-size:var(--t-2xl);font-weight:780;letter-spacing:-.03em;line-height:1.1;color:var(--v-n900)}
.v-hello p{color:var(--v-n500);font-size:var(--t-sm);margin-top:5px}
@media (max-width:767px){.v-hello{margin:var(--s2) 0 var(--s4)} .v-hello h1{font-size:24px}}
.v-hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:var(--s6);color:#fff;background:var(--v-grad);box-shadow:var(--e-primary)}
.v-hero::after{content:"";position:absolute;width:320px;height:320px;right:-90px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none}
.v-hero::before{content:"";position:absolute;width:220px;height:220px;left:-60px;bottom:-140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);pointer-events:none}
.v-hero-top{display:flex;align-items:center;gap:var(--s2);font-size:12.5px;font-weight:650;opacity:.92;position:relative}
.v-hero h2{font-size:var(--t-xl);font-weight:750;letter-spacing:-.02em;margin:6px 0 var(--s4);position:relative;line-height:1.25}
.v-hero-stats{display:flex;gap:var(--s2);position:relative;flex-wrap:wrap}
.v-hstat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-md);padding:10px 14px;min-width:92px;backdrop-filter:blur(6px);transition:background var(--d1) var(--ease),transform var(--d1) var(--ease);text-align:left;color:#fff}
.v-hstat:hover{background:rgba(255,255,255,.22)}
.v-hstat:active{transform:scale(.97)}
.v-hstat b{display:block;font-size:24px;font-weight:780;letter-spacing:-.03em;line-height:1.05}
.v-hstat span{font-size:11.5px;font-weight:600;opacity:.88}
.v-hstat.hot{background:rgba(255,255,255,.95);color:var(--v-error);border-color:transparent}
.v-hero-cta{position:relative;margin-top:var(--s4);display:flex;gap:var(--s2);flex-wrap:wrap}

/* ---------- bottom sheet / panel ---------- */
.v-sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(18,23,38,.36);opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ease)}

  right:16px;top:16px;width:420px;border-radius:var(--r-xl);transform:translateY(-8px) scale(.98);opacity:0;pointer-events:none;transition:transform var(--d2) var(--ease-out),opacity var(--d2) var(--ease)}

}

/* ---------- motion ---------- */
@keyframes v-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@keyframes v-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes v-pill{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes v-modal{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes v-sheetup{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}

:root{

<script>
/* =================================================================
   KRSF PROGRAM OFFICE TRACKER
   Single-file app · persistent storage via window.storage
   ================================================================= */

/* ---------- constants ---------- */
const FY_MONTHS = ["2026-04","2026-05","2026-06","2026-07","2026-08","2026-09",
                    "2026-10","2026-11","2026-12","2027-01","2027-02","2027-03"];
const FY_END = FY_MONTHS[FY_MONTHS.length-1];   // last month of the financial year
const MONTH_NAMES = {1:"Jan",2:"Feb",3:"Mar",4:"Apr",5:"May",6:"Jun",
                     7:"Jul",8:"Aug",9:"Sep",10:"Oct",11:"Nov",12:"Dec"};
/* real "today", computed once at boot — no hardcoded dates anywhere else.
   Built from LOCAL date parts (not toISOString, which is UTC) — otherwise
   early-morning IST hours (roughly midnight-5:30am, before UTC catches up)
   would report yesterday's date as "today" everywhere in the app. */
const TODAY = new Date();
const TODAY_ISO = TODAY.getFullYear()+"-"+String(TODAY.getMonth()+1).padStart(2,"0")+"-"+String(TODAY.getDate()).padStart(2,"0");  // e.g. 2026-05-17
const TODAY_MONTH = TODAY_ISO.slice(0,7);                   // e.g. 2026-05
/* the live reporting month = current calendar month if inside the FY,
   otherwise clamped to the nearest FY month */
function liveReportingMonth(){
  if(FY_MONTHS.includes(TODAY_MONTH)) return TODAY_MONTH;
  return TODAY_MONTH < FY_MONTHS[0] ? FY_MONTHS[0] : FY_END;
}
/* a document is "expiring soon" if it lapses within the next 180 days (6 months) */
const SOON_CUTOFF_ISO = new Date(TODAY.getTime()+90*86400000).toISOString().slice(0,10);
const VERTICALS = ["Livelihood","Advocacy","Education","Healthcare","Climate"];
const BUDGET_CATS = ["Salary","Travel","Programme","Other"];
/* Debit-note processing workflow — four ordered stages.
   A debit note starts at the first stage and moves down as it is processed.
   Each move is timestamped in the note's history. */
const DN_STATUS = [
  "Hard copy not received",
  "Under review by Program Team",
  "Under review with Finance Team",
  "Payment released"
];
const DN_STATUS_DEFAULT = DN_STATUS[0];
/* colour for each stage — used by badges */
const DN_STATUS_COLOR = {
  "Hard copy not received":      "amber",
  "Under review by Program Team":"blue",
  "Under review with Finance Team":"violet",
  "Payment released":            "green"
};
/* Partner scorecard — 8 criteria, each scored 0–5, total out of 40.
   key = short column header, label = full name shown on hover/tooltip. */
const SCORE_CRITERIA = [
  { key:"OKR",   label:"OKR / Milestone delivery" },
  { key:"Data",  label:"Data quality & timeliness" },
  { key:"Docs",  label:"Compliance documents" },
  { key:"Funds", label:"Fund utilisation" },
  { key:"Fin",   label:"Financial reporting" },
  { key:"Lead",  label:"Leadership & governance" },
  { key:"Comm",  label:"Communication & responsiveness" },
  { key:"Learn", label:"Learning & adaptation" }
];
const SCORE_MAX = SCORE_CRITERIA.length * 5;   // 40
const VERT_CLASS = {Livelihood:"live",Advocacy:"adv",Education:"edu",Healthcare:"health",Climate:"climate"};

/* ---------- helpers ---------- */
function monthLabel(m){ if(!m)return"—"; const[y,mo]=String(m).split("-"); if(!/^\d{4}$/.test(y)||!MONTH_NAMES[+mo]) return esc(m); return MONTH_NAMES[+mo]+" "+y.slice(2); }
function monthLong(m){ if(!m)return"—"; const[y,mo]=String(m).split("-"); if(!/^\d{4}$/.test(y)||!MONTH_NAMES[+mo]) return esc(m); return MONTH_NAMES[+mo]+" 20"+y.slice(2); }
/* shortDate("2026-06-11") → "11 Jun 26", for the debit-note "Received" column */
function shortDate(s){
  if(!s) return "—";
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return esc(s);   // V75.2: non-date text is shown as text
  return (+m[3])+" "+MONTH_NAMES[+m[2]]+" "+m[1].slice(2);
}
function fmtN(n){ if(n==null||isNaN(n))return"—"; return Math.round(n).toLocaleString("en-IN"); }
/* re-format an amount-input as the user types — adds Indian commas
   (1,38,000) without losing cursor position for the most-common case
   of typing at the end. Strip non-digits, parse, then format. */
function fmtAmtInput(inp){
  const raw = (inp.value||"").replace(/[^0-9]/g,"");
  if(!raw){ inp.value=""; return; }
  inp.value = parseInt(raw,10).toLocaleString("en-IN");
}
function fmtRs(n){
  if(n==null||isNaN(n))return"—";
  if(Math.abs(n)>=1e7) return "₹"+(n/1e7).toFixed(2)+" Cr";
  if(Math.abs(n)>=1e5) return "₹"+(n/1e5).toFixed(2)+" L";
  if(Math.abs(n)>=1e3) return "₹"+(n/1e3).toFixed(1)+"k";
  return "₹"+Math.round(n);
}
function fmtRsFull(n){ if(n==null||isNaN(n))return"—"; return "₹"+Math.round(n).toLocaleString("en-IN"); }
/* the debit-note "Scrolls" column shows the actual scroll ID(s), not just a count */
function scrollIdsLabel(d){
  const ids = (Array.isArray(d.scrolls)?d.scrolls:[]).map(s=>s&&s.scrollId).filter(Boolean);
  return ids.length ? esc(ids.join(", ")) : "—";
}
/* display dates as dd-mm-yyyy everywhere; non-date text comes back HTML-escaped */
function fmtDMY(d){
  if(d==null||d==="") return "—";
  const s=String(d), m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+"-"+m[2]+"-"+m[1];
  const dt=new Date(s);
  if(!isNaN(dt) && /\d{4}/.test(s)) return String(dt.getDate()).padStart(2,"0")+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+dt.getFullYear();
  return esc(s);   // V75.2: non-date text is shown as text
}

let _idSeq = 0;
function genId(p){ return p+"_"+Date.now().toString(36)+"_"+(_idSeq++).toString(36)+Math.random().toString(36).slice(2,7); }
/* esc() is for HTML text and attribute values. It is NOT enough for a
   value inside a '...' string in onclick code: the browser turns &#39;
   back into ' before running it. Use jsArg() there (V75.2). */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* V75.2: a value placed inside a '...' JavaScript string in an inline
   handler (onclick="fn('${jsArg(v)}')"). The browser decodes HTML entities
   in the attribute before it runs the code, so esc() alone cannot stop an
   apostrophe from ending the string. Escape for JavaScript first, then
   for the HTML attribute. */
function jsArg(s){
  const js = String(s==null?"":s).replace(/[\\'"<>\n\r]/g, c => ({
    "\\":"\\\\", "'":"\\'", '"':'\\"', "<":"\\x3c", ">":"\\x3e",
    "\n":"\\n", "\r":"\\r"
  }[c]));
  return esc(js);
}
/* V75.2: only web links become clickable; anything else (javascript:,
   data:, typos) turns into a dead "#" link. */
function safeHref(u){
  const v = String(u==null?"":u).trim();
  return /^https?:\/\//i.test(v) ? esc(v) : "#";

/* =================================================================
   PERSISTENCE  ·  Realtime Database live sync (localStorage offline cache)
   =================================================================

   Storage model — overwrite-safe by design:
   Each top-level collection (ngos, bigBets, budgets, debits, documents,
   tasks, scorecards, mbo, refFiles, users, meta) is stored as ONE
   node under "tracker/" in the Realtime Database. So two people
   editing different things write to different nodes and never
   collide. Live listeners keep every open browser's DB fresh within
   ~1-2s, so even same-collection edits merge instead of overwriting.
   ================================================================= */
const STORE_KEY   = "npp_tracker_cache_v3";   // local offline cache
const SESSION_KEY = "npp_tracker_session_v3";
const DB_PARTS = ["meta","users","ngos","bigBets","budgets","debits",
                  "documents","tasks","scorecards","mbo","refFiles","flagged",
                  "dailyLogs","teamMbo"];

let fb = { app:null, db:null, auth:null, storage:null, ready:false };

/* =================================================================
   V73 · SIGN-IN + STORAGE MODEL
   Sign-in is Firebase Authentication. Each Pulse login is a Firebase
   account with a made-up address on the project's own domain; the
   username a person types is looked up in logins/{username}. What a
   signed-in account may touch is decided by roles/{uid}, enforced by
   the database rules (database.rules.json in the deploy repo):
     team logins  -> tracker/* and ngoData/*
     NGO logins   -> only ngoData/{their ngoId}, and only the status /
                     comment fields of rows that already exist
   OKRs (mbo) and tasks live per NGO in ngoData/{ngoId}/{mbo|tasks}/{id}
   so an NGO login can be given its own slice and nothing else. In the
   browser they are still the flat DB.mbo / DB.tasks arrays.
   No password is stored anywhere in the database.
   ================================================================= */
const LOGIN_DOMAIN = "ngo-partnership-program.firebaseapp.com";
const ROLE_KEY = "npp_role_v4:";
const NGO_SPLIT_PARTS = ["mbo","tasks"];
let _lastRows = { mbo:{}, tasks:{} };   // team: server copy of each split row {path, json}
let _ngoRows  = { mbo:{}, tasks:{} };   // NGO login: server copy of its own rows
let _authUid  = null;

function sahkarTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>{
    const e = new Error("timeout"); e.code = "timeout"; rej(e); }, ms))]);
}
/* JSON with sorted keys, treating null / empty {} / empty [] as absent —
   the same way the Realtime Database stores them — so a row read back
   from Firebase compares equal to the one that was written. */
function stableJson(v){
  if(v===null || v===undefined) return "null";
  if(typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(stableJson).join(",")+"]";
  const keys = Object.keys(v).filter(k=>{
    const x = v[k];
    if(x===null || x===undefined) return false;
    if(typeof x==="object" && Object.keys(x).length===0) return false;
    return true;
  }).sort();
  return "{"+keys.map(k=>JSON.stringify(k)+":"+stableJson(v[k])).join(",")+"}";
}
/* a string usable as a database key ( . # $ [ ] / are not allowed ) */
function fbKey(x){ return String(x==null || x==="" ? "_none" : x).replace(/[.#$\[\]\/]/g, "_"); }
function byOrd(a, b){
  const oa = (a && typeof a.ord==="number") ? a.ord : 1e9;
  const ob = (b && typeof b.ord==="number") ? b.ord : 1e9;
  return (oa-ob) || String(a && a.id).localeCompare(String(b && b.id));
}
/* ngoData snapshot -> flat arrays + a {id: {path, json}} map per part */
function ngoDataFlatten(v){
  const out = { mbo:[], tasks:[], rows:{ mbo:{}, tasks:{} } };
  Object.keys(v || {}).forEach(nid=>{
    const node = (v[nid] && typeof v[nid]==="object") ? v[nid] : {};
    NGO_SPLIT_PARTS.forEach(part=>{
      const m = (node[part] && typeof node[part]==="object") ? node[part] : {};
      Object.keys(m).forEach(k=>{
        const r = m[k];
        if(!r || typeof r!=="object") return;
        out[part].push(r);
        out.rows[part][r.id || k] = { path:"ngoData/"+nid+"/"+part+"/"+k, json:stableJson(r) };
      });
    });
  });
  NGO_SPLIT_PARTS.forEach(p=>out[p].sort(byOrd));
  return out;
}
/* team save: row-level writes for one split part. Adds to `updates` and
   returns the map that becomes the new server copy once the write lands. */
function splitRowUpdates(part, updates, rows, prev){
  const now = {};
  (rows || []).forEach((r, i)=>{
    if(!r || r.id==null) return;
    if(typeof r.ord!=="number") r.ord = i;   // keeps display order across reloads
    const path = "ngoData/"+fbKey(r.ngoId)+"/"+part+"/"+fbKey(r.id);
    now[r.id] = { path, json:stableJson(r) };
  });
  prev = prev || {};
  Object.keys(now).forEach(id=>{
    const p = prev[id], n = now[id];
    if(!p || p.json!==n.json || p.path!==n.path){
      updates[n.path] = JSON.parse(JSON.stringify(rows.find(r=>r && r.id==id)));
      if(p && p.path!==n.path) updates[p.path] = null;
    }
  });
  Object.keys(prev).forEach(id=>{ if(!now[id]) updates[prev[id].path] = null; });
  return now;
}
function emptyDB(){
  const db = {};
  DB_PARTS.forEach(p=>{ db[p] = (["meta","budgets","scorecards","flagged"].indexOf(p)>=0) ? {} : []; });
  return db;
}
let CLOUD_OK = false;            // is the live connection healthy?
let SAVE_OK = true;
let _lastSynced = {};            // JSON snapshot of each part, to diff on save
let _applyingRemote = false;     // guard: don't echo remote changes back as a save
let _unsub = [];                 // active Firestore listener unsubscribe fns

/* ---- connect to Firebase ---- */
function cloudInit(){
  try{
    if(!window.firebase || !window.FIREBASE_CONFIG || !firebase.auth) return false;
    fb.app = firebase.apps.some(a=>a.name==="[DEFAULT]") ? firebase.app() : firebase.initializeApp(window.FIREBASE_CONFIG);
    fb.db = firebase.database();
    fb.auth = firebase.auth();
    fb.ready = true;
    return true;
  }catch(e){
    console.error("Firebase init failed", e);
    fb.ready = false;
    return false;
  }
}

/* ---- offline cache (so the app still opens if the network is down) ---- */
/* V73: the offline copy is kept per signed-in account and cleared on sign-out */
function cacheKey(){
  const u = fb.auth && fb.auth.currentUser;
  return u ? STORE_KEY+":"+u.uid : null;
}
function cacheSave(){
  const k = cacheKey(); if(!k || !DB) return;
  try{ localStorage.setItem(k, JSON.stringify(DB)); }catch(e){}
}
function cacheLoad(){
  const k = cacheKey(); if(!k) return null;
  try{ const s=localStorage.getItem(k); if(s) return JSON.parse(s); }catch(e){}
  return null;
}
function cacheClear(){
  try{
    Object.keys(localStorage).forEach(k=>{
      if(k===STORE_KEY || k.indexOf(STORE_KEY+":")===0 || k.indexOf(ROLE_KEY)===0 || k===SESSION_KEY)
        localStorage.removeItem(k);
    });
  }catch(e){}
}

/* ---- first-ever run: write a clean skeleton to RTDB ---- */
async function cloudSeedIfEmpty(){
  /* V75.5: a missing meta alone no longer counts as "empty". Seed only when
     no part of the tracker and no ngoData exists.
     Reads at most one child per part, not the whole data. */
  const snaps = await Promise.all(DB_PARTS.map(p=>fb.db.ref("tracker/"+p).limitToFirst(1).once("value"))
      .concat([fb.db.ref("ngoData").limitToFirst(1).once("value")]));
  if(snaps.some(sn=>sn.exists())) return false;   // something is there — never overwrite
  const skeleton = skeletonData();
  const updates = {};
  DB_PARTS.forEach(part=>{ if(skeleton[part]!==undefined) updates["tracker/"+part] = skeleton[part]; });
  await fb.db.ref().update(updates);
  return true;
}

/* ---- pull the whole DB once from RTDB ---- */
function cloudLoadAll(){
  const parts = DB_PARTS.filter(p=>NGO_SPLIT_PARTS.indexOf(p)<0);
  return Promise.all(parts.map(p=>fb.db.ref("tracker/"+p).once("value"))
      .concat([fb.db.ref("ngoData").once("value")])).then(snaps=>{
    const out = {};
    parts.forEach((part, i)=>{
      const sn = snaps[i];
      out[part] = sn.exists() ? sn.val() : skeletonData()[part];
    });
    const flat = ngoDataFlatten(snaps[parts.length].val());
    NGO_SPLIT_PARTS.forEach(p=>{ out[p] = flat[p]; _lastRows[p] = flat.rows[p]; });
    return out;
  });
}

/* ---- live listeners: keep DB fresh as others make changes ---- */
function cloudListen(){
  _unsub.forEach(fn=>{ try{fn();}catch(e){} });
  _unsub = [];
  DB_PARTS.filter(p=>NGO_SPLIT_PARTS.indexOf(p)<0).forEach(part=>{
    const ref = fb.db.ref("tracker/"+part);
    const handler = snap=>{
      if(!snap.exists()) return;
      if(!DB){ return; }   // DB not assigned yet — ignore until loadDB() finishes
      let incoming = normalizePart(part, snap.val());
      const inJson = JSON.stringify(incoming);
      // ignore the echo of our own just-written change
      if(inJson === _lastSynced[part]) return;
      _applyingRemote = true;
      /* V75.5: keep this device's changes that are not saved yet */
      const base0 = (_lastSynced[part] && _lastSynced[part]!=="__force__") ? JSON.parse(_lastSynced[part]) : undefined;
      const mineNow = DB[part];
      if(base0!==undefined && !jsonEq(mineNow, base0)){
        const m = mergePart(base0, mineNow, incoming);
        DB[part] = (m===MERGE_CONFLICT) ? incoming : m;
      } else DB[part] = incoming;
      _lastSynced[part] = inJson;
      _applyingRemote = false;
      cacheSave();
      if(typeof ME!=="undefined" && ME && typeof CUR_PAGE!=="undefined" && CUR_PAGE) render();
      setConnState(true);
    };
    ref.on("value", handler, err=>{
      console.error("listener error ("+part+")", err);
      setConnState(false);
    });
    // store an unsubscribe function that turns off this listener
    _unsub.push(()=>ref.off("value", handler));
  });
  /* V73: OKRs and tasks, stored per NGO */
  const nref = fb.db.ref("ngoData");
  const nh = snap=>{
    if(!DB) return;
    const flat = ngoDataFlatten(snap.val());
    let changed = false;
    NGO_SPLIT_PARTS.forEach(p=>{
      _lastRows[p] = flat.rows[p];
      if(stableJson(flat[p]) !== stableJson(DB[p] || [])){ DB[p] = flat[p]; changed = true; }
    });
    if(!changed) return;
    cacheSave();
    if(typeof ME!=="undefined" && ME && typeof CUR_PAGE!=="undefined" && CUR_PAGE) render();
    setConnState(true);
  };
  nref.on("value", nh, err=>{ console.error("listener error (ngoData)", err); setConnState(false); });
  _unsub.push(()=>nref.off("value", nh));
}

/* ---- main load path ---- */
async function loadDB(){
  if(cloudInit()){
    let data = null;
    try{
      await sahkarTimeout(cloudSeedIfEmpty(), 15000);
      data = await sahkarTimeout(cloudLoadAll(), 20000);
      CLOUD_OK = true;
    }catch(e){
      console.error("Cloud load failed, using offline cache", e);
      CLOUD_OK = false;
    }
    if(data){
      // We have live Firebase data — coerce and migrate it regardless of cache
      let merged;
      try{
        merged = migrateDB(data);
      }catch(e){
        // migrateDB failed — apply toArr manually and retry rather than dropping data
        console.error("migrateDB failed, retrying with coercion", e);
        ["users","ngos","bigBets","debits","documents","tasks","mbo","refFiles","dailyLogs","teamMbo"]
          .forEach(p=>{ if(data[p] && !Array.isArray(data[p])) data[p] = Object.values(data[p]); });
        merged = migrateDB(data);
      }
      DB = merged;                 // assign DB FIRST, then attach listeners
      // _lastSynced must reflect the MIGRATED data that is now in memory,
      // not the raw cloud data — otherwise the echo-check and change-diff
      // both misfire on the first listener event / first save.
      DB_PARTS.forEach(p=>{ _lastSynced[p] = JSON.stringify(merged[p] ?? skeletonData()[p]); });
      cacheSave();
      cloudListen();
      return merged;
    }
  }
  // offline fallback — cache, else a clean skeleton
  const cached = cacheLoad();
  return migrateDB(cached || skeletonData());
}

/* ---- save: write ONLY the collections that actually changed ---- */
/* V75.4: mirror of database.rules.json. Only the PM changes the user
   list; a Viewer writes only their own OKR ticks and daily logs. */
function canWritePart(part){
  if(!ME) return false;
  if(ME.role==="PM") return true;
  if(part==="users") return false;
  if(ME.role==="Viewer") return part==="teamMbo" || part==="dailyLogs";
  return true;
}
function canWriteNgoData(){ return !!ME && ME.role!=="Viewer" && ME.role!=="NGO"; }
/* ---- V75.5: merge on save ----
   Each list (debits, NGOs, OKRs...) used to be written whole, so a save
   could wipe out a change someone else made a moment earlier, or while
   this device was offline. Now a save works out what THIS device changed
   since it last heard from the server (rows added, removed, and the
   fields edited in each row) and applies only that onto the server's
   current copy, inside a transaction, so nothing in between is lost.
   Two people editing the SAME field of the same row: the later save wins. */
const MERGE_CONFLICT = { conflict:true };
function jsonClone(v){ return v===undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function jsonEq(a, b){ return JSON.stringify(a)===JSON.stringify(b); }
function isPlainObj(v){ return !!v && typeof v==="object" && !Array.isArray(v); }
function isRowList(v){
  if(!Array.isArray(v)) return false;
  const ids = new Set();
  for(const r of v){ if(!isPlainObj(r) || r.id==null || ids.has(String(r.id))) return false; ids.add(String(r.id)); }
  return true;
}
/* one record: the fields I changed since base go onto their copy */
function mergeRec(b, m, t){
  if(jsonEq(b, m)) return t;                     // I didn't touch it
  if(m===undefined) return undefined;            // I deleted it
  if(b===undefined) return t===undefined ? m : (isPlainObj(t) && isPlainObj(m) ? mergeRec({}, m, t) : m);
  if(t===undefined) return undefined;            // they deleted it: their delete stands
  if(!isPlainObj(b) || !isPlainObj(m) || !isPlainObj(t)) return m;
  const out = Object.assign({}, t);
  new Set(Object.keys(b).concat(Object.keys(m))).forEach(k=>{
    if(!jsonEq(b[k], m[k])){ if(m[k]===undefined) delete out[k]; else out[k] = m[k]; }
  });
  return out;
}
/* a whole list or map: base = what I last saw, mine = now, theirs = server now */
function mergePart(base, mine, theirs){
  if(jsonEq(base, mine)) return theirs;
  if(theirs==null || jsonEq(base, theirs)) return mine;
  if(Array.isArray(mine) || Array.isArray(base) || Array.isArray(theirs)){
    const B = base || [], M = mine || [], T = theirs || [];
    if(!isRowList(B) || !isRowList(M) || !isRowList(T)) return MERGE_CONFLICT;
    const by = a=>{ const m = new Map(); a.forEach(r=>m.set(String(r.id), r)); return m; };
    const bm = by(B), mm = by(M), tm = by(T), out = [];
    T.forEach(r=>{ const id = String(r.id); const v = mergeRec(bm.get(id), mm.get(id), r); if(v!==undefined) out.push(v); });
    M.forEach(r=>{ const id = String(r.id); if(!tm.has(id) && !bm.has(id)) out.push(r); });   // my new rows
    return out;
  }
  if(isPlainObj(mine) && isPlainObj(theirs) && (base==null || isPlainObj(base))){
    const B = base || {}, out = Object.assign({}, theirs);
    new Set(Object.keys(B).concat(Object.keys(mine))).forEach(k=>{
      const v = mergeRec(B[k], mine[k], theirs[k]);
      if(v===undefined) delete out[k]; else out[k] = v;
    });
    return out;
  }
  return MERGE_CONFLICT;
}
/* V75.5: the same clean-up for every copy of a list read from the server */
function normalizePart(part, raw){
  let incoming = raw;
  if(incoming==null) return (["meta","budgets","scorecards","flagged"].indexOf(part)>=0) ? null : [];
  // Coerce array collections that Firebase may return as keyed objects
  if(["users","ngos","bigBets","debits","documents","tasks","mbo","refFiles","dailyLogs","teamMbo"].includes(part)){
    incoming = toArr(incoming);
  }
  // coerce arrays nested inside records too
  if(part==="users"){
    incoming.forEach(u=>{ u.ngoIds = toArr(u.ngoIds); });
  }
  if(part==="budgets" && incoming && typeof incoming==="object"){
    Object.keys(incoming).forEach(k=>normalizeBudgetRec(incoming[k]));
  }
  if(part==="debits"){
    incoming.forEach(d=>{
      if(d.scrolls!==undefined) d.scrolls = toArr(d.scrolls);
      if(d.history!==undefined) d.history = toArr(d.history);
    });
  }
  if(part==="dailyLogs"){
    incoming.forEach(r=>{
      if(r){ if(r.comments!==undefined) r.comments = toArr(r.comments);
             if(!r.hours || typeof r.hours!=="object" || Array.isArray(r.hours)) r.hours = {}; }
    });
  }
  if(part==="bigBets"){
    incoming.forEach(b=>{
      if(b && (!b.months || typeof b.months!=="object" || Array.isArray(b.months)))
        b.months = {};
    });
  }
  return incoming;
}

let _saveRun = null, _saveAgain = false;
async function saveDB(){
  if(!DB) return false;
  cacheSave();
  if(_applyingRemote) return true;
  if(!CLOUD_OK || !fb.ready){
    if(SAVE_OK) toast("⚠ Offline — changes saved on this device only");
    SAVE_OK = false;
    return false;
  }
  if(ME && ME.role==="NGO") return ngoPortalSave();
  /* one save at a time; a save asked for meanwhile runs right after */
  if(_saveRun){ _saveAgain = true; return _saveRun; }
  _saveRun = (async ()=>{
    let ok;
    do { _saveAgain = false; ok = await saveDBOnce(); } while(ok && _saveAgain);
    return ok;
  })();
  try{ return await _saveRun; } finally { _saveRun = null; }
}
async function saveDBOnce(){
  let ok = true, ngosChanged = false;
  const conflicts = [];
  try{
    for(const part of DB_PARTS){
      if(NGO_SPLIT_PARTS.indexOf(part)>=0) continue;   // V73: stored per NGO, below
      if(!canWritePart(part)) continue;                // V75.4: the rules would refuse it
      const mine = jsonClone(DB[part] ?? skeletonData()[part]);
      if(JSON.stringify(mine) === _lastSynced[part]) continue;
      const forced = _lastSynced[part]==="__force__";  // restore from backup: replace
      const base = (!forced && _lastSynced[part]!==undefined) ? JSON.parse(_lastSynced[part]) : undefined;
      let conflict = false;
      const res = await fb.db.ref("tracker/"+part).transaction(raw=>{
        conflict = false;
        if(forced || base===undefined) return mine;
        const m = mergePart(base, mine, normalizePart(part, raw));
        if(m===MERGE_CONFLICT){ conflict = true; return; }
        return jsonClone(m);
      }, undefined, false);
      const server = normalizePart(part, res.snapshot.val());
      const sJson = JSON.stringify(server);
      if(!res.committed){
        /* could not be merged: take the server copy and say so */
        if(conflict) conflicts.push(part);
        DB[part] = server; _lastSynced[part] = sJson;
        continue;
      }
      /* keep anything edited on this device while the save was running */
      const now = DB[part];
      if(jsonEq(now, mine)) DB[part] = server;
      else { const m2 = mergePart(mine, now, server); DB[part] = (m2===MERGE_CONFLICT) ? now : m2; }
      _lastSynced[part] = sJson;
      if(part==="ngos") ngosChanged = true;
    }
    const updates = {}, pendingRows = {};
    if(canWriteNgoData()){
      /* the NGO's name, readable by its own login */
      if(ngosChanged) (DB.ngos||[]).forEach(n=>{
        if(n && n.id) updates["ngoData/"+fbKey(n.id)+"/profile"] = { id:n.id, short:n.short||"", name:n.name||"" };
      });
      NGO_SPLIT_PARTS.forEach(p=>{ pendingRows[p] = splitRowUpdates(p, updates, DB[p], _lastRows[p]); });
    } else NGO_SPLIT_PARTS.forEach(p=>{ pendingRows[p] = _lastRows[p]; });
    if(Object.keys(updates).length) await fb.db.ref().update(updates);
    NGO_SPLIT_PARTS.forEach(p=>{ _lastRows[p] = pendingRows[p]; });
    cacheSave();
  }catch(e){
    ok = false;
    console.error("save failed", e);
    // the change stays "dirty" so the next saveDB() retries it
  }
  if(conflicts.length){
    toast("Someone else changed this at the same time — please check it and redo your last change");
    try{ render(); }catch(e){}
  }
  if(!ok && SAVE_OK) toast("⚠ Couldn't sync — your last change will retry automatically");
  SAVE_OK = ok;
  setConnState(ok);
  if(!ok) scheduleSaveRetry();
  return ok;
}
let _retryTimer = null;
function scheduleSaveRetry(){
  if(_retryTimer) return;          // one retry in flight is enough
  _retryTimer = setTimeout(async ()=>{
    _retryTimer = null;
    if(!DB) return;
    // re-enable the cloud path for one attempt; saveDB will re-disable if it fails again
    if(fb.ready) CLOUD_OK = true;
    const ok = await saveDB();
    if(ok) toast("✓ Reconnected — your changes are now synced");
  }, 15000);                       // retry 15s later
}

/* Convert a value that may be a Firebase object-with-numeric-keys back to
   a proper JS array.  Firebase Realtime Database serialises arrays as
   {"0":{…},"1":{…}} when round-tripped through .val(), so anything that
   should be an array must be coerced before we call .forEach / .map on it. */
function toArr(v, padLen){
  if(Array.isArray(v)){
    // pad a short array to padLen with 0 (e.g. monthlyPlan missing trailing zeros)
    if(padLen && v.length < padLen) return [...v, ...Array(padLen-v.length).fill(0)];
    return v;
  }
  if(v && typeof v==="object"){
    // numeric-keyed object → restore as array
    // Firebase omits keys whose value is 0/null, so we must NOT filter — instead
    // fill gaps with 0 to preserve positional indices (critical for monthlyPlan).
    const keys = Object.keys(v);
    if(keys.length && keys.every(k=>/^\d+$/.test(k))){
      const maxKey = Math.max(...keys.map(Number));
      const len = padLen ? Math.max(maxKey+1, padLen) : maxKey+1;
      const out = new Array(len).fill(0);
      keys.forEach(k=>{ out[Number(k)] = v[k]; });
      return out;
    }
  }
  return padLen ? new Array(padLen).fill(0) : [];
}

/* normalise one budget record — array coercion + the Salary/Other monthly
   split needed by the finalized budget workbook. Used by BOTH migrateDB and
   the live Firebase listener, so the derived fields survive a remote refresh. */
function normalizeBudgetRec(bg){
  if(!bg || typeof bg!=="object") return;
  if(bg.monthlyPlan!==undefined) bg.monthlyPlan = toArr(bg.monthlyPlan, 12);
  if(bg.salaryPlan !==undefined) bg.salaryPlan  = toArr(bg.salaryPlan, 12);
  if(bg.otherPlan  !==undefined) bg.otherPlan   = toArr(bg.otherPlan, 12);
  if(Array.isArray(bg.monthlyPlan) && (!Array.isArray(bg.salaryPlan) || !Array.isArray(bg.otherPlan))){
    const tot   = (+bg.totalAnnual) || bg.monthlyPlan.reduce((a,c)=>a+(+c||0),0);
    const sal   = bg.annual ? (+bg.annual.Salary||0) : 0;
    const share = tot>0 ? Math.min(1, Math.max(0, sal/tot)) : 0;
    bg.salaryPlan = bg.monthlyPlan.map(v=>Math.round((+v||0)*share));
    bg.otherPlan  = bg.monthlyPlan.map((v,i)=>(+v||0)-bg.salaryPlan[i]);
  }
}

/* fill in fields added after a DB was first saved */
function migrateDB(db){
  if(!db || typeof db!=="object") db = skeletonData();
  DB_PARTS.forEach(p=>{ if(db[p]===undefined) db[p] = skeletonData()[p]; });
  // Coerce every array collection — Firebase may return them as objects
  ["users","ngos","bigBets","debits","documents","tasks","mbo","refFiles","dailyLogs","teamMbo"]
    .forEach(p=>{ db[p] = toArr(db[p]); });
  if(!db.scorecards || typeof db.scorecards!=="object" || Array.isArray(db.scorecards)) db.scorecards = {};
  if(!db.budgets   || typeof db.budgets  !=="object" || Array.isArray(db.budgets))   db.budgets   = {};
  if(!db.flagged   || typeof db.flagged  !=="object" || Array.isArray(db.flagged))   db.flagged   = {};
  // ---- coerce arrays NESTED inside records (Firebase turns these into objects too) ----
  db.users.forEach(u=>{
    // ngoIds must be a real array or APL permission checks silently fail
    u.ngoIds = toArr(u.ngoIds);
  });
  db.bigBets.forEach(b=>{
    if(!b || typeof b!=="object") return;
    // months must always be a plain keyed object — never undefined, never an array.
    // (RTDB drops an empty {} on save, so a months-less goal comes back undefined
    //  and would crash every dashboard/goal render.)
    if(!b.months || typeof b.months!=="object" || Array.isArray(b.months)) b.months = {};
    // numeric fields that the health/progress maths depends on
    if(typeof b.baseline!=="number") b.baseline = 0;
    if(typeof b.annualTarget!=="number"){
      const n = Number(b.annualTarget);
      b.annualTarget = isNaN(n)?0:n;
    }
    if(!b.unit) b.unit = "";
    if(!b.title) b.title = "Untitled milestone";
  });
  // budget arrays must be numeric arrays; budgets saved before the
  // finalized-workbook format get a derived Salary/Other monthly split
  Object.keys(db.budgets).forEach(k=>normalizeBudgetRec(db.budgets[k]));
  // debit notes — coerce nested scroll/history arrays and back-fill status
  db.debits.forEach(d=>{
    if(d.scrolls!==undefined) d.scrolls = toArr(d.scrolls);
    if(d.history!==undefined) d.history = toArr(d.history);
    // an old note saved before the workflow change → default it
    if(!d.status || !DN_STATUS.includes(d.status)) d.status = DN_STATUS_DEFAULT;
    if(d.category==="Admin-Other") d.category="Other";
  });
  // daily sheets — nested comments array + hours object must survive an RTDB round-trip
  db.dailyLogs.forEach(r=>{
    if(!r || typeof r!=="object") return;
    if(r.comments!==undefined) r.comments = toArr(r.comments);
    if(!r.hours || typeof r.hours!=="object" || Array.isArray(r.hours)) r.hours = {};
  });
  /* legacy budget category "Admin-Other" → "Other" */
  Object.keys(db.budgets||{}).forEach(k=>{
    const a=db.budgets[k]&&db.budgets[k].annual;
    if(a && a["Admin-Other"]!==undefined){ a["Other"]=(+a["Other"]||0)+(+a["Admin-Other"]||0); delete a["Admin-Other"]; }
  });
  db.ngos.forEach(n=>{ if(!n.partnership) n.partnership = "Active"; });
  // every NGO must have a budget object so finance never crashes
  db.ngos.forEach(n=>{
    const b = db.budgets[n.id];
    if(!b || !b.monthlyPlan || !Array.isArray(b.monthlyPlan) || !b.annual)
      db.budgets[n.id] = emptyBudget();
  });
  // ---- keep the FY label in step with the active financial year ----
  if(!db.meta || typeof db.meta!=="object") db.meta = skeletonData().meta;
  const fyStartYr = FY_MONTHS[0].slice(0,4);
  const fyEndYr2  = String(Number(fyStartYr)+1).slice(2);
  db.meta.fyLabel = "FY "+fyStartYr+"-"+fyEndYr2;
  if(!db.meta.program) db.meta.program = "KRSF Partnership Program";
  // ---- SAFETY NET: there must always be a working PM login ----
  // If an older/partial seed left no PM (or no usable credentials), restore the
  // default admin account so the owner can never be locked out.
  let pm = db.users.find(u=>u.role==="PM");
  if(!pm){
    pm = skeletonData().users[0];
    db.users.unshift(pm);
  }
  if(!pm.username) pm.username = "admin";
  /* ---- FDNMS: ensure KRSF debit-note staff logins exist (single sign-in) ---- */
  [["Accounts","Vadali Accounts Team","accounts"],["Finance","Ahmedabad Finance Authority","finance"],["Programme","Programme Team","programme"]].forEach(function(r){
    if(!db.users.some(function(u){return u.role===r[0];})){
      db.users.push({ id:"u_"+r[0].toLowerCase(), role:r[0], name:r[1], username:r[2], ngoIds:[], title:r[1], avatar:r[1].split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase() });
    }
  });
  /* V73: passwords live in Firebase Authentication only. Drop any left in
     the data (pre-V73 records, old backups) so they are never written back. */
  db.users.forEach(u=>{ if(u && typeof u==="object") delete u.password; });
  return db;
}
/* a safe zero budget — used when an NGO has no plan yet */
function emptyBudget(){
  const annual={}; BUDGET_CATS.forEach(c=>annual[c]=0);
  return { annual, totalAnnual:0, monthlyPlan:FY_MONTHS.map(()=>0),
           salaryPlan:FY_MONTHS.map(()=>0), otherPlan:FY_MONTHS.map(()=>0) };
}

/* =================================================================
   COMPUTATION HELPERS
   ================================================================= */
// visible NGOs — PM and Viewer (Auditor) see the whole portfolio; APL and
// Programme logins are scoped strictly to their assigned NGOs, and see
// NOTHING if unassigned (fail safe, not fail open — an unassigned login
// must never default to full network access).
/* =====================================================================
   REPORTING HIERARCHY
   A user's `reportsTo` names their manager. A manager SEES everything
   belonging to the people below them, at any depth; they never gain the
   right to CHANGE it. Visibility flows down only — a subordinate never
   sees their manager's records.
   ===================================================================== */

/* The user plus everyone below them. Breadth-first with a visited set, so a
   circular line terminates instead of hanging. Admin refuses to create one,
   but a restored backup or a concurrent edit could still produce it. */
function teamOf(userId){
  const out = new Set();
  if(!userId) return out;
  const users = (DB && DB.users) || [];
  const queue = [userId];
  while(queue.length){
    const id = queue.shift();
    if(out.has(id)) continue;
    out.add(id);
    users.forEach(u=>{
      if(u && u.reportsTo === id && !out.has(u.id)) queue.push(u.id);
    });
  }
  return out;
}

/* Would making `userId` report to `managerId` close a loop? True if the
   proposed manager is the user themselves, or is already somewhere below
   them. Clearing the field is always allowed. */
function wouldCreateCycle(userId, managerId){
  if(!managerId) return false;
  return teamOf(userId).has(managerId);
}

/* Who may be picked as someone's manager: the other lead-role users, minus
   themselves and anyone already below them. Finance, Accounts, Viewer and
   the PM are not part of the partnership reporting line. */
function reportsToOptions(u){
  const leads = ((DB && DB.users) || [])
    .filter(x => x && (x.role==="APL" || x.role==="Programme"));
  if(!u) return leads.map(x=>({ id:x.id, name:x.name }));
  return leads
    .filter(x => x.id !== u.id && !wouldCreateCycle(u.id, x.id))
    .map(x => ({ id:x.id, name:x.name }));
}

/* Every NGO this user may SEE: their own, plus their whole team's. */
function effectiveNgoIds(userId){
  const team = teamOf(userId);
  const out = new Set();
  ((DB && DB.users) || []).forEach(u=>{
    if(!u || !team.has(u.id)) return;
    (Array.isArray(u.ngoIds) ? u.ngoIds : []).forEach(id=>out.add(id));
  });
  return out;
}

/* Only the signed-in user's OWN NGOs. This is what grants edit rights, and
   it must never be widened to the team. */
function myNgoIds(){
  return (ME && Array.isArray(ME.ngoIds)) ? ME.ngoIds : [];
}

/* Roles whose work spans the whole portfolio rather than an assigned slice:
   the PM, the two finance-side roles who process debit notes for every
   partner, and the read-only auditor. */
const PORTFOLIO_WIDE_ROLES = ["PM","Accounts","Finance","Viewer"];

function visibleNgos(){
  if(!ME) return [];
  if(ME.role==="APL" || ME.role==="Programme"){
    const allowed = effectiveNgoIds(ME.id);
    return DB.ngos.filter(n=>allowed.has(n.id));
  }
  if(PORTFOLIO_WIDE_ROLES.indexOf(ME.role) >= 0) return DB.ngos.slice();
  /* Fail closed. An earlier version returned every NGO from here, which
     exposed the whole portfolio to a Programme login before that role was
     recognised. A role nobody has taught this function about sees nothing. */
  return [];
}
/* Team MBO rows the signed-in user may see. Fails CLOSED: an unrecognised
   role or no session sees nothing. A lead sees only rows they own. */
function visibleTeamMbo(){
  const rows = (typeof DB!=="undefined" && DB && DB.teamMbo) || [];
  if(!ME) return [];
  if(ME.role === "PM") return rows;
  /* own rows plus everyone below them in the reporting line */
  const team = teamOf(ME.id);
  return rows.filter(r => r && team.has(r.ownerId));
}

/* Whose daily sheets the signed-in user may look at: themselves plus anyone
   below them in the reporting line. The PM sees every lead. Before V66 every
   lead could see every other lead's day regardless of the reporting line. */
function dailyPeople(){
  if(!ME) return [];
  const leads = ((DB && DB.users) || [])
    .filter(u => u && (u.role==="APL" || u.role==="Programme"));
  if(ME.role === "PM") return leads;
  if(ME.role !== "APL" && ME.role !== "Programme") return [];

}
// can the current user edit at all?  (Viewer is read-only)
function canEdit(){ return ME && (ME.role==="PM"||ME.role==="APL"||ME.role==="Programme"); }
// can the current user edit THIS specific NGO?
//  - PM edits everything
//  - APL and Programme edit only the NGOs assigned to them in the Admin
//    panel — an unassigned login can edit nothing (fail safe)
//  - Viewer edits nothing
function canEditNgo(ngoId){
  if(!ME || ME.role==="Viewer") return false;
  if(ME.role==="PM") return true;
  if(ME.role!=="APL" && ME.role!=="Programme") return false;
  /* myNgoIds(), NOT effectiveNgoIds(): a manager can see everything their
     team owns but changes only their own. Widening this to the team is the
     single most damaging mistake available in this file. */
  return myNgoIds().indexOf(ngoId) >= 0;

function canManageNgos(){ return ME && ME.role==="PM"; }
function ngoById(id){ return DB.ngos.find(n=>n.id===id); }
function userById(id){ return DB.users.find(u=>u.id===id); }
/* names of the APLs assigned to an NGO (via their ngoIds), comma-joined.
   Falls back gracefully when no APL is assigned yet. */
/* Who leads this partnership. Both lead roles count: the role literally
   coded "APL" is labelled "Partner NGO" in Admin, while the people actually
   carrying NGO portfolios hold "Programme". Matching only "APL" left this
   column showing a dash for every NGO — the same mismatch that hid the
   folders panel, and the same pair visibleNgos() already treats alike. */
function aplNamesFor(ngoId){

    .filter(u=>u && (u.role==="APL" || u.role==="Programme")
              && Array.isArray(u.ngoIds) && u.ngoIds.includes(ngoId))
    .map(u=>u.name);
  return names.length ? names.join(", ") : "—";
}
/* V64: Programme-team folders panel — Dashboard, PM only. One folder
   per "Programme" role user (the role that actually carries a
   multi-NGO portfolio in this app's live data — the "APL"-coded role
   is labelled "Partner NGO (raises debit notes)" in Admin and isn't
   the concept this feature is for). Groups their assigned NGOs
   (DB.ngos filtered by apl.ngoIds — the same assignment field
   visibleNgos()/canEditNgo() already use). */
const APL_FOLDER_COLORS = ["c-green","c-amber","c-blue","c-red","c-violet"];
/* V65: the Dashboard's right margin now carries overdue Team MBO items
   instead of expiring documents. Document expiry is still surfaced by the
   count badge on the Documents nav item (docsNavCount -> docsExpiringCount)
   and in full on the Documents page. */
function tmOverdueCount(){

/* The Dashboard rail, beside the Partner NGOs table. Shows what is slipping
   and what is coming, key results and action items together.

   It deliberately ignores the Team MBO page's filter — this is a standing
   view of current urgency. It needs no month window either: "overdue"
   already excludes anything more than a month late (those sit under their
   own heading on the page), and "coming up" is by definition ahead of today. */
function tmDashRail(){
  const rows = visibleTeamMbo();
  if(!rows.length) return "";   // nothing uploaded — do not occupy a column

  const over = rows.filter(r=>tmBucket(r, TODAY_ISO)==="overdue")
                   .sort((a,b)=>tmDaysLate(b,TODAY_ISO)-tmDaysLate(a,TODAY_ISO));
  const next = rows.filter(r=>{
                     const b = tmBucket(r, TODAY_ISO);
                     return b==="week" || b==="soon";
                   })
                   .sort((a,b)=>a.deadline.localeCompare(b.deadline));

  const LIMIT = 6;
  const line = (r, right, cls) => `
    <div class="tm-rl-row" onclick="go('okrupload')">
      <div class="tm-rl-tx">
        <div class="tm-rl-t">${esc(r.title)}</div>
        <div class="tm-rl-s">${esc(tmInitials(r.ownerId))}
          <span class="tm-rl-tag ${r.type==="kr"?"tm-kr":"tm-ai"}">${r.type==="kr"?"Key result":"Action"}</span>
        </div>
      </div>

function betsForNgo(id){ return DB.bigBets.filter(b=>b.ngoId===id); }
function visibleBets(){
  const ids = new Set(visibleNgos().map(n=>n.id));
  return DB.bigBets.filter(b=>ids.has(b.ngoId));
}
/* Beneficiaries reached — sums only milestones literally denominated in
   "beneficiaries" (not households/women/students/farmers/etc — a known,
   accepted undercount, not a bug). Reuses the same cumulative-achieved
   logic the app already trusts for milestone progress. */
function totalBeneficiaries(bets){
  return bets
    .filter(b=>b.unit==="beneficiaries")
    .reduce((sum,b)=>{
      const lm = lastReportedMonth(b);
      return sum + (lm ? betCumulative(b, lm) : 0);
    }, 0);
}
/* Total impact amount — a manual per-NGO figure (Admin > Edit partner),
   NOT derived from milestones: only one existing milestone is a true
   cumulative ₹ total, the other ₹-unit milestones are average-income
   *levels* (a rate, not a sum) and can't be added together meaningfully. */
function totalImpactAmount(ngos){
  return ngos.reduce((sum,n)=>sum+(n.impactAmount||0), 0);
}

/* Is this an "income level" bet, where the achieved value is a running
   level (not additive)?  Detection is now EXPLICIT: a bet may carry
   levelType:true.  As a fallback for legacy data we also treat ₹ bets
   whose title clearly describes an income level as level-type. */
function betIsLevelType(bet){
  if(typeof bet.levelType==="boolean") return bet.levelType;
  if(bet.unit!=="₹") return false;
  const t=(bet.title||"").toLowerCase();
  return t.includes("average")||t.includes("income level")||t.includes("establish");
}

// cumulative achieved for a goal up to & including month m
function betCumulative(bet, uptoMonth){
  const months = (bet && bet.months) || {};
  if(betIsLevelType(bet)){
    let latest = bet.baseline||0;
    for(const m of FY_MONTHS){
      if(m> uptoMonth) break;
      const c = months[m];
      if(c && c.actual!=null) latest = c.actual;
    }
    return latest;
  }
  let sum = bet.baseline || 0;
  for(const m of FY_MONTHS){
    if(m > uptoMonth) break;
    const c = months[m];
    if(c && c.actual!=null) sum += c.actual;
  }
  return sum;
}
function betCumulativePlan(bet, uptoMonth){
  const months = (bet && bet.months) || {};
  if(betIsLevelType(bet)){
    let latest = bet.baseline||0;
    for(const m of FY_MONTHS){ if(m>uptoMonth)break;
      const c=months[m]; if(c&&c.plan!=null) latest=c.plan; }
    return latest;
  }
  let sum = bet.baseline||0;
  for(const m of FY_MONTHS){ if(m>uptoMonth)break;
    const c=months[m]; if(c&&c.plan!=null) sum+=c.plan; }
  return sum;
}

// progress % of a bet against annual target (cumulative over the whole FY)
function betProgress(bet){
  const cum = betCumulative(bet, FY_END);
  return pct(cum, bet.annualTarget);
}
// on-track status: cumulative achieved vs cumulative plan as of last fully-reported month
function lastReportedMonth(bet){
  const months = (bet && bet.months) || {};
  let last=null;
  for(const m of FY_MONTHS){ if(months[m] && months[m].actual!=null) last=m; }
  return last;
}
function betHealth(bet){
  const lm = lastReportedMonth(bet);
  if(!lm) return {status:"gray",label:"Not started",pace:0};
  const cumA = betCumulative(bet, lm);
  const cumP = betCumulativePlan(bet, lm);
  const pace = pct(cumA, cumP||1);
  let status = pace>=95?"green": pace>=80?"amber":"red";
  return { status, label: status==="green"?"On track":status==="amber"?"Slight slip":"Behind", pace, cumA, cumP, lm };
}

/* Budget actuals from debit notes. A debit note counts toward utilised
   budget as soon as it is logged — the budget tracker reflects all
   recorded spend regardless of which processing stage it is at. */
/* a debit note counts towards spend/actuals unless it is an email-captured
   PDF note still waiting for a human okay in the review queue */
function dnCounts(d){ return !(d && d.pendingReview); }

/* a human timestamp for the audit trail, e.g. "18 May 2026, 2:14 PM" */
function stamp(){
  const d = new Date();
  const day = d.getDate();
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  let h = d.getHours(); const ap = h>=12?"PM":"AM"; h = h%12||12;
  const mm = String(d.getMinutes()).padStart(2,"0");
  return day+" "+mon+" "+d.getFullYear()+", "+h+":"+mm+" "+ap;
}

// budget actuals for NGO/month from debit notes
function ngoSpendForMonth(ngoId, month){
  return DB.debits.filter(d=>d.ngoId===ngoId && d.month===month && dnCounts(d))
                  .reduce((s,d)=>s+(d.amount||0),0);
}
function ngoSpendUpto(ngoId, uptoMonth){
  let s=0;
  for(const m of FY_MONTHS){ if(m>uptoMonth)break; s+=ngoSpendForMonth(ngoId,m); }
  return s;
}
function ngoSpendByCat(ngoId, uptoMonth){
  const out={}; BUDGET_CATS.forEach(c=>out[c]=0);
  // only count months that are inside the financial year and at/before uptoMonth
  // — this keeps the category split consistent with ngoSpendUpto().
  DB.debits.filter(d=>d.ngoId===ngoId && dnCounts(d)
                   && FY_MONTHS.includes(d.month) && d.month<=uptoMonth)
           .forEach(d=>{
             const cat = BUDGET_CATS.includes(d.category) ? d.category : "Programme";
             out[cat]=(out[cat]||0)+(d.amount||0);
           });
  return out;
}
function budgetUtilPct(ngoId, uptoMonth){
  const b=DB.budgets[ngoId]; if(!b||!b.totalAnnual) return 0;
  return pct(ngoSpendUpto(ngoId,uptoMonth), b.totalAnnual);
}
// expected pace = months elapsed / 12
function monthsElapsed(uptoMonth){
  return FY_MONTHS.indexOf(uptoMonth)+1;
}

// scorecard status from total /40 — Green ≥35, Yellow ≥25, else Red
function scoreStatus(total){
  if(total>=35) return "green";
  if(total>=25) return "amber";
  return "red";
}
function scoreStatusLabel(total){
  return total>=35?"Green": total>=25?"Yellow":"Red";
}
/* heat-map cell class that MATCHES the status badge (green/amber/red) */
function scoreCellClass(status){
  return status==="green"?"s-hi": status==="amber"?"s-mid": status==="red"?"s-lo":"s-na";
}
// a partner's scorecard for a given month (defaults to CUR_MONTH)
function ngoScore(ngoId, month){
  const m = month || CUR_MONTH;
  const all = DB.scorecards && DB.scorecards[ngoId];
  const sc = all && all[m];
  if(!sc) return {status:"gray",pct:0,total:0,scored:false};
  let total = 0, any = false;
  SCORE_CRITERIA.forEach(c=>{
    if(typeof sc[c.key]==="number"){ total += sc[c.key]; any = true; }
  });
  const pct = Math.round(total/SCORE_MAX*100);
  return { status: any?scoreStatus(total):"gray", pct, total, scored:any };
}

function setScoreCell(ngoId, key, val){

/* V73: sign-in goes through Firebase Authentication. The username a person
   types is looked up in logins/{username}, which holds only the account's
   sign-in address — readable one key at a time, never as a list. */
function loginFail(msg){
  const errEl = el("loginErr"), btn = el("loginBtn");
  if(errEl) errEl.textContent = msg;
  const p = el("loginPass"); if(p) p.value = "";
  if(btn){ btn.disabled = false; btn.textContent = "Sign in →"; }
}
async function doLogin(){
  const errEl = el("loginErr");
  errEl.textContent = "";
  const uname = (el("loginUser").value || "").trim().toLowerCase();
  const pass = el("loginPass").value || "";
  if(!uname || !pass){ errEl.textContent = "Enter your username and password."; return; }
  if(!fb.ready || !fb.auth){ errEl.textContent = "Not connected — check your connection and reload."; return; }
  const btn = el("loginBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Signing in…"; }
  try{
    if(!/^[a-z0-9_-]+$/.test(uname)) return loginFail("Incorrect username or password.");
    const snap = await sahkarTimeout(fb.db.ref("logins/"+uname).once("value"), 12000);
    const email = snap.val();
    if(typeof email!=="string" || !email) return loginFail("Incorrect username or password.");
    await fb.auth.signInWithEmailAndPassword(email, pass);
    /* onAuthStateChanged (in init) opens the app */
  }catch(e){
    const c = (e && e.code) || "";
    if(c==="auth/too-many-requests") return loginFail("Too many attempts. Wait a few minutes and try again.");
    if(c==="timeout" || c==="auth/network-request-failed") return loginFail("Can't reach the server — check your connection.");
    return loginFail("Incorrect username or password.");
  }
}
async function doLogout(){
  cacheClear();

  el("loginUser").value=""; el("loginPass").value=""; el("loginErr").textContent="";

}

/* signed in to Firebase: find out who this is, load what they may see */
async function enterApp(user){
  let role = null, offline = false;
  try{
    const sn = await sahkarTimeout(fb.db.ref("roles/"+user.uid).once("value"), 12000);
    role = sn.val();
    try{ if(role) localStorage.setItem(ROLE_KEY+user.uid, JSON.stringify(role)); }catch(e){}
  }catch(e){
    offline = true;
    try{ role = JSON.parse(localStorage.getItem(ROLE_KEY+user.uid) || "null"); }catch(_){}
  }
  if(_authUid!==user.uid) return;            // signed out / switched meanwhile
  if(!role || !role.role){
    if(offline){ showLoginForm("⚠ Can't reach the server — check your connection and reload."); return; }
    _authUid = null;
    try{ await fb.auth.signOut(); }catch(e){}
    showLoginForm(null, "This login has no access yet. Please contact your KRSF admin.");
    return;
  }
  if(role.role==="NGO"){
    DB = emptyDB();
    ME = { id:role.userId || user.uid, role:"NGO", name:role.name || "Partner NGO",
           ngoIds:[role.ngoId], title:"Partner NGO", avatar:"N" };
    try{
      const sn = await sahkarTimeout(fb.db.ref("ngoData/"+fbKey(role.ngoId)).once("value"), 15000);
      ngoPortalApply(role.ngoId, sn.val());
      CLOUD_OK = true;
    }catch(e){
      CLOUD_OK = false;
      const cached = cacheLoad();
      if(cached) DB = Object.assign(emptyDB(), cached);
    }
    if(_authUid!==user.uid) return;
    ngoPortalListen(role.ngoId);
    const n = (DB.ngos || [])[0];
    ME.avatar = String((n && n.short) || "N").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase() || "N";
  } else {
    try{ DB = await loadDB(); }
    catch(e){ console.error("loadDB failed", e); DB = migrateDB(cacheLoad() || skeletonData()); CLOUD_OK = false; }
    if(_authUid!==user.uid) return;
    ME = userById(role.userId);
    /* V75.3: the server's role wins over the editable user list */
    if(ME && ME.role!==role.role){ console.warn("user list role differs from roles/; using roles/"); ME.role = role.role; }
    if(!ME){
      ME = null; DB = null; _authUid = null;
      _unsub.forEach(fn=>{ try{fn();}catch(e){} }); _unsub = [];
      try{ await fb.auth.signOut(); }catch(e){}
      showLoginForm(null, "This login isn't set up correctly. Please contact your KRSF admin.");
      return;
    }
  }
  setConnState(CLOUD_OK);
  _signOutMsg = "";
  watchOwnRole(user.uid, role);
  el("login").style.display = "none";
  el("app").style.display = "block";
  bootApp();
}

/* the latest FY month that actually has reported data (debit notes,
   bet actuals or scorecards) — used as the smart default reporting month */
function latestDataMonth(){
  let latest = FY_MONTHS[0];
  (DB.debits||[]).forEach(d=>{ if(FY_MONTHS.includes(d.month) && d.month>latest) latest=d.month; });
  (DB.bigBets||[]).forEach(b=>{
    FY_MONTHS.forEach(m=>{ const c=b.months&&b.months[m]; if(c&&c.actual!=null&&m>latest) latest=m; });
  });
  Object.values(DB.scorecards||{}).forEach(sc=>{
    Object.keys(sc).forEach(m=>{ if(FY_MONTHS.includes(m)&&m>latest) latest=m; });
  });
  /* prefer the live calendar month if it's inside the FY and not behind the data */
  const live = liveReportingMonth();
  return live>=latest ? live : latest;
}

/* V50: tiny UI smoke check — logs one line on boot; also callable as __uiSmoke() in the console.
   Proves the theme var is applied, the font is Inter, a representative glyph (₹) actually
   RENDERS (width>0, not fonts.check), and no font CDN links remain. */
function __uiSmoke(){
  const out={};
  out.accentViolet = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim().toLowerCase()==='#5b3fc0';
  out.fontInter = /Inter/.test(getComputedStyle(document.body).fontFamily);
  const s=document.createElement('span');
  s.style.cssText='position:absolute;left:-9999px;top:-9999px;font:700 32px Inter';
  s.textContent='₹'; document.body.appendChild(s);
  out.rupeeRenders = s.getBoundingClientRect().width>0; s.remove();
  out.noFontCDN = document.querySelectorAll('link[href*="fonts.google"],link[href*="gstatic"]').length===0;
  const pass=Object.values(out).every(Boolean);
  console.info('[UI smoke] '+(pass?'PASS':'FAIL'), out);
  return out;
}

async function init(){
  /* pre-V73 copies of the whole database, passwords included, sat in
     every browser that ever opened the app — remove them */
  try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
  if(!cloudInit()){
    showLoginForm("⚠ Couldn't load the sign-in service — check your connection and reload.");
    return;
  }
  await new Promise(resolve=>{
    let first = true;
    fb.auth.onAuthStateChanged(async user=>{
      try{
        if(user){
          if(_authUid!==user.uid){ _authUid = user.uid; await enterApp(user); }
        } else {
          if(ME) teardownSession();
          _authUid = null;
          showLoginForm();
        }
      }catch(e){
        console.error("sign-in flow failed", e);
        showLoginForm("⚠ Something went wrong opening the app — please reload.");
      }finally{
        if(first){ first = false; resolve(); }
      }
    });
  });
}

      count: DB.tasks.filter(t=>{

      }).length || null },
    { id:"daily",   label:"Daily Sheet",   ic:"🗓", sec:"Work", count: dailyNavCount() },

    { id:"docs",    label:"Documents",     ic:"▣", sec:"Work", count: docsNavCount() }
  ];
  // V47: drop the Fund Disbursement entry while the module is hidden
  if(!SHOW_FDNMS){ const _i=items.findIndex(x=>x.id==="fdnms"); if(_i>=0) items.splice(_i,1); }
  // FDNMS: KRSF finance-side staff only see Finance + Debit Notes.
  // Partnership Leads (APL) and Programme see the full app, scoped to their assigned NGOs.
  const FD_RESTRICTED = ["Accounts","Finance"];
  if(FD_RESTRICTED.includes(ME.role)){
    const allow = new Set(SHOW_FDNMS ? ["budget","fdnms"] : ["budget","debits"]);

  }

  if(!(ME.role==="PM" || ME.role==="APL" || ME.role==="Programme")){

function buildNav(){
  const items = navItems();
  if(ME && ME.role==="NGO"){ el("nav").innerHTML = ""; return; }
  const act = v4ActiveTab();
  let html=""; let lastSec=null;
  items.forEach(it=>{
    if(it.mobileOnly || it.hidden) return;
    if(it.sec!==lastSec){ if(it.sec) html+=`<div class="nav-sec">${it.sec}</div>`; lastSec=it.sec; }
    const on = it.id===CUR_PAGE || (it.id===act && it.primary);
    html+=`<button class="nav-item ${on?'active':''}" data-page="${it.id}" onclick="go('${jsArg(it.id)}')">

      ${it.count!=null?`<span class="ct ${it.hot?'hot':''}">${it.count}</span>`:''}

/* ---------- dates and deadlines ---------- */
function v4DaysTo(iso){
  return Math.round((new Date(iso+"T00:00:00Z") - new Date(TODAY_ISO+"T00:00:00Z")) / 86400000);
}
function v4MonthEnd(m){
  const y = +m.slice(0,4), mo = +m.slice(5,7);
  return new Date(Date.UTC(y, mo, 0)).toISOString().slice(0,10);
}
function v4PrevMonth(m){
  let y = +m.slice(0,4), mo = +m.slice(5,7) - 1;
  if(mo < 1){ mo = 12; y--; }
  return y+"-"+String(mo).padStart(2,"0");
}
/* an NGO key result is due on its timeline date, else at the end of its month */
function v4KrDue(r){
  if(!r) return "";
  const year = r.month ? +r.month.slice(0,4) : null;
  const d = r.timeline ? tmParseDate(r.timeline, year) : "";
  return d || (r.month ? v4MonthEnd(r.month) : "");
}
function v4Bucket(due){
  if(!due) return "none";
  const d = v4DaysTo(due);
  if(d < -30) return "old";
  if(d < 0)   return "late";
  if(d === 0) return "today";
  if(d <= 7)  return "week";
  return "later";
}
function v4DueLabel(due){
  if(!due) return "No deadline";
  const d = v4DaysTo(due);
  if(d < -1)  return (-d)+" days late";
  if(d === -1)return "1 day late";
  if(d === 0) return "Due today";
  if(d === 1) return "Due tomorrow";
  if(d <= 7)  return "Due in "+d+" days";
  return "Due "+shortDate(due);
}
function v4DueCls(due){
  const b = v4Bucket(due);
  return b==="late"||b==="old" ? "late" : b==="today" ? "today" : b==="week" ? "week" : "later";
}

  return out.sort((a,b)=> a.due<b.due ? -1 : a.due>b.due ? 1 : 0);

function v4NgoMonths(ngoId){

function v4NgoStats(ngoId){
  const months = v4NgoMonths(ngoId);
  const m = months.find(x=>x<=TODAY_MONTH) || months[0] || null;
  const krs = m ? (DB.mbo||[]).filter(r=>r && r.ngoId===ngoId && r.month===m) : [];
  const tasks = (DB.tasks||[]).filter(t=>t && t.ngoId===ngoId);

  const late = open.filter(t=>t.due && v4DaysTo(t.due)<0).length;
  const b = DB.budgets && DB.budgets[ngoId];
  const total = (b && b.totalAnnual) || 0;
  const spent = ngoSpendUpto(ngoId, FY_END);
