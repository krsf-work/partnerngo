  :root{
    --paper:#f5f6f9;
    --paper-2:#eceef3;
    --card:#ffffff;
    --ink:#1b2333;
    --ink-2:#515f78;
    --ink-3:#929fb5;
    --rule:#e7e9f0;
    --rule-2:#d6dae3;
    --accent:#5b3fc0;
    --accent-soft:#ece6fb;
    --gold:#b08400;
    --green:#1c976a;
    --green-soft:#daf2e8;
    --amber:#d6912a;
    --amber-soft:#faecd2;
    --red:#d9543f;
    --red-soft:#fadfd9;
    --blue:#3079bd;
    --blue-soft:#dbe8f5;
    --violet:#7d63cc;
    --violet-soft:#e9e3f9;
    --shadow:0 1px 2px rgba(27,35,51,.04),0 3px 12px rgba(27,35,51,.055);
    --shadow-lg:0 2px 8px rgba(27,35,51,.07),0 16px 44px rgba(27,35,51,.12);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    --display:'Inter',-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    --mono:'Inter',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{background:#f5f6fa}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:var(--display);font-optical-sizing:auto}
  .news{font-family:var(--display)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:6px;border:2px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ===== LOGIN ===== */
  #login{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);
    background-image:none;
    background-size:22px 22px;
  }
  .login-card{
    width:380px;background:var(--card);
    border:1px solid var(--rule);box-shadow:var(--shadow-lg);
    padding:42px 40px 36px;border-radius:20px;
  }
  .login-mark{
    font-family:var(--sans);font-weight:700;font-size:12px;
    letter-spacing:.3em;text-transform:uppercase;color:var(--accent);
    margin-bottom:6px;
  }
  .login-card h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.01em;margin-bottom:4px;text-align:center}
  .login-card .sub{color:var(--ink-3);font-size:13px;margin-bottom:26px;text-align:center}
  .login-card label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;font-weight:700}
  .login-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .login-opt{
    display:flex;align-items:center;gap:12px;padding:11px 13px;
    border:1px solid var(--rule);background:var(--card);border-radius:11px;
    transition:.14s;text-align:left;
  }
  .login-opt:hover{border-color:var(--ink-3)}
  .login-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .login-opt .av{
    width:32px;height:32px;flex:none;border-radius:50%;
    background:var(--ink-2);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
  }
  .login-opt.sel .av{background:var(--accent)}
  .login-opt .nm{font-weight:600;font-size:13px}
  .login-opt .rl{font-size:11px;color:var(--ink-3)}
  .login-btn{
    width:100%;padding:12px;background:var(--accent);color:#fff;border-radius:10px;
    font-weight:700;font-size:13px;letter-spacing:.02em;transition:.14s;margin-top:18px;
  }
  .login-btn:hover{background:#4a2ea8}
  .login-inp{
    width:100%;padding:11px 13px;border:1px solid var(--rule-2);border-radius:10px;
    font-size:13px;font-family:var(--sans);background:var(--card);color:var(--ink);
  }
  .login-inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .login-err{
    font-size:12px;color:var(--red);margin-top:10px;min-height:16px;font-weight:600;
  }
  /* live-connection indicator in the topbar */
  .conn{display:flex;align-items:center;margin-right:4px}
  .conn-dot{
    width:9px;height:9px;border-radius:50%;display:inline-block;
    background:var(--ink-3);transition:.2s;
  }
  .conn-dot.on{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
  .conn-dot.off{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}

  /* ===== SHELL ===== */
  #app{display:none;min-height:100vh}
  .shell{display:flex;min-height:100vh}
  .side{
    width:236px;flex:none;background:var(--card);
    border-right:1px solid var(--rule);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:22px 22px 18px;border-bottom:1px solid var(--rule)}
  .brand .mk{
    font-family:var(--display);font-weight:700;font-size:19px;
    letter-spacing:-.01em;display:flex;align-items:center;gap:9px;
  }
  .brand .mk i{
    width:28px;height:28px;background:var(--logo) center/cover no-repeat;
    flex:none;border-radius:8px;
  }
  .brand .tg{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;line-height:1.5}
  .nav{padding:14px 12px;flex:1;overflow-y:auto}
  .nav-sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:14px 10px 7px}
  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;
    color:var(--ink-2);transition:.12s;text-align:left;margin-bottom:2px;
  }
  .nav-item:hover{background:var(--paper-2);color:var(--ink)}
  .nav-item.active{background:var(--accent);color:#fff}
  .nav-item .ic{width:17px;text-align:center;font-size:14px;flex:none}
  .nav-item .ct{margin-left:auto;font-size:11px;font-weight:700;background:var(--paper-2);color:var(--ink-3);padding:1px 8px;border-radius:20px}
  .nav-item.active .ct{background:rgba(255,255,255,.22);color:#fff}
  .side-foot{border-top:1px solid var(--rule);padding:13px 16px;display:flex;align-items:center;gap:10px}
  .side-foot .av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
  .side-foot .nm{font-weight:600;font-size:12.5px;line-height:1.2}
  .side-foot .rl{font-size:10.5px;color:var(--ink-3)}
  .side-foot .out{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);padding:5px 9px;border-radius:6px;border:1px solid var(--rule);background:var(--card)}
  .side-foot .out:hover{color:var(--accent);border-color:var(--accent);background:var(--paper-2)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:none;height:50px;border-bottom:1px solid var(--rule);
    background:var(--card);align-items:center;
    padding:0 22px;position:sticky;top:0;z-index:30;
  }
  .sel-inp{
    padding:6px 10px;border:1px solid var(--rule-2);background:var(--card);
    font-size:12.5px;font-weight:500;border-radius:8px;color:var(--ink);
  }
  .sel-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* V65: was 1320px, which left a wide dead margin on a 1920px screen.
     The cap is now high enough never to bind on a normal monitor, while
     still stopping table rows becoming unreadably wide on an ultrawide. */
  .content{padding:18px 22px 48px;max-width:1800px;width:100%}

  /* ===== V72: NGO login — phone-first OKR + task view ===== */
  body.ngo-mode .side, body.ngo-mode .topbar, body.ngo-mode .side-scrim{display:none!important}
  body.ngo-mode .content{max-width:680px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
  body.ngo-mode .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .nm-head{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
  .nm-head .lg{width:38px;height:38px;border-radius:10px;background:var(--logo) center/cover no-repeat;flex:none}
  .nm-head .org{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .nm-head h1{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15;letter-spacing:-.015em}
  .nm-months{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:none}
  .nm-months::-webkit-scrollbar{display:none}
  .nm-chip{flex:none;padding:7px 13px;border-radius:20px;border:1px solid var(--rule-2);background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .nm-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nm-sum{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .nm-sum .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
  .nm-sum .big{font-family:var(--display);font-size:24px;font-weight:700;color:var(--ink)}
  .nm-bar{height:8px;border-radius:6px;background:var(--paper-2);overflow:hidden;display:flex;margin-top:10px}
  .nm-bar i{display:block;height:100%}
  .nm-obj{background:var(--card);border:1px solid var(--rule);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .nm-obj-h{display:flex;gap:10px;padding:13px 15px;border-bottom:1px solid var(--rule);align-items:flex-start}
  .nm-obj-h .n{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .nm-obj-h .t{font-weight:600;font-size:14px;line-height:1.35}
  .nm-kr{padding:13px 15px;border-bottom:1px solid var(--rule)}
  .nm-kr:last-child{border-bottom:0}
  .nm-kr .t{font-size:13.5px;line-height:1.45;color:var(--ink)}
  .nm-kr .m{font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .nm-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .nm-seg button{min-height:42px;border-radius:10px;border:1px solid var(--rule-2);background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .nm-seg button.on.s-done{background:var(--green);border-color:var(--green);color:#fff}
  .nm-seg button.on.s-prog{background:var(--amber);border-color:var(--amber);color:#fff}
  .nm-seg button.on.s-not{background:var(--red);border-color:var(--red);color:#fff}
  .nm-cmt{margin-top:9px;font-size:12.5px;color:var(--ink-2);background:var(--paper);border-radius:9px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
  .nm-link{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:0;padding:6px 0}
  .nm-kr textarea{width:100%;margin-top:9px;min-height:78px;border:1px solid var(--rule-2);border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
  .nm-act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  .nm-task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .nm-tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule-2);background:transparent;color:#fff;font-size:14px;flex:none;display:flex;align-items:center;justify-content:center}
  .nm-tick.on{background:var(--green);border-color:var(--green)}
  .nm-task .t{font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
  .nm-task.done .t{text-decoration:line-through;color:var(--ink-3)}
  .nm-task .m{font-size:12px;color:var(--ink-3);margin-top:3px}
  .nm-sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:18px 2px 8px}
  .nm-empty{text-align:center;color:var(--ink-3);font-size:13px;padding:34px 18px;background:var(--card);border:1px dashed var(--rule-2);border-radius:14px;line-height:1.6}
  .nm-tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .nm-tabs button{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:11px;font-weight:600;color:var(--ink-3);background:none;border:0;position:relative}
  .nm-tabs button .ic{font-size:18px;line-height:1.1}
  .nm-tabs button.on{color:var(--accent)}
  .nm-tabs .ct{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;min-width:16px;line-height:16px}

  /* ===== PAGE HEAD ===== */
  .phead{margin-bottom:14px}
  .phead .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
  .phead h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.015em;line-height:1.15}
  .phead .desc{color:var(--ink-2);font-size:12.5px;margin-top:3px;max-width:620px}
  .phead-row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  /* compact head — title row only, no greeting/description */
  .phead.slim{margin-bottom:14px;display:flex;align-items:baseline;gap:12px}
  .phead.slim h1{font-size:19px}
  .phead.slim .eyebrow{margin-bottom:0;font-size:10px}

  /* ===== CARDS / PANELS ===== */
  .panel{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:16px;overflow:hidden}
  .panel-h{
    padding:11px 14px;border-bottom:1px solid var(--rule);
    display:flex;align-items:center;gap:10px;
  }
  .panel-h h3{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.01em}
  .panel-h .note{font-size:11.5px;color:var(--ink-3);font-weight:500}
  .panel-h .ha{margin-left:auto;display:flex;gap:8px}
  .panel-b{padding:14px}

  /* ===== KPI ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{
    background:var(--card);border:1px solid var(--rule);padding:13px 14px 12px;
    box-shadow:var(--shadow);position:relative;border-radius:13px;transition:.16s;
  }
  .kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .kpi .ktop{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .kpi .ktile{
    width:34px;height:34px;flex:none;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .kpi .ktile.blue{background:var(--blue-soft);color:var(--blue)}
  .kpi .ktile.green{background:var(--green-soft);color:var(--green)}
  .kpi .ktile.amber{background:var(--amber-soft);color:var(--amber)}
  .kpi .ktile.red{background:var(--red-soft);color:var(--red)}
  .kpi .ktile.accent{background:var(--accent-soft);color:var(--accent)}
  .kpi .ktile.violet{background:var(--violet-soft);color:var(--violet)}
  .kpi .lab{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:0}
  .kpi .val{font-family:var(--mono);font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1.05}
  .kpi .sub{font-size:11.5px;color:var(--ink-2);margin-top:4px;font-weight:500}
  .kpi .spark{display:none}
  .kpi.accent,.kpi.green,.kpi.amber,.kpi.blue{border-left:1px solid var(--rule)}

  /* V63: Dashboard Overview summary strip — lighter-weight than .kpi-grid,
     used only on the Dashboard's Overview tab. Deliberately separate from
     .kpi/.kpi-grid, which dailyPmPage() also uses — must not affect that page. */
  .ov-summary{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);
              border-radius:13px;overflow:hidden;margin-bottom:14px}
  .ov-stat{flex:1;min-width:150px;padding:12px 14px;border-right:1px solid var(--rule);
           border-bottom:1px solid var(--rule)}
  .ov-stat:last-child{border-right:none}
  .ov-stat .otop{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .ov-stat .oico{font-size:14px}
  .ov-stat .olab{font-size:10.5px;color:var(--ink-3);font-weight:600}
  .ov-stat .oval{font-family:var(--mono);font-weight:800;font-size:18px;line-height:1.1}
  .ov-stat .osub{font-size:10.5px;color:var(--ink-2);margin-top:2px}

  /* ===== BADGES ===== */
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;letter-spacing:.01em;
    padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge.green{background:var(--green-soft);color:var(--green)}
  .badge.amber{background:var(--amber-soft);color:var(--amber)}
  .badge.red{background:var(--red-soft);color:var(--red)}
  .badge.blue{background:var(--blue-soft);color:var(--blue)}
  .badge.gray{background:var(--paper-2);color:var(--ink-3)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.gray{background:var(--ink-3)}.dot.blue{background:var(--blue)}

  /* ===== PROGRESS ===== */
  .pbar{height:7px;background:var(--paper-2);border-radius:20px;overflow:hidden;position:relative}
  .pbar i{display:block;height:100%;border-radius:20px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
  .pbar i.green{background:var(--green)}
  .pbar i.amber{background:var(--amber)}
  .pbar i.red{background:var(--red)}
  .pbar i.blue{background:var(--blue)}
  .pbar i.accent{background:var(--accent)}

  /* ===== KPI band breakdown (RYG counts in one box) ===== */
  .band-row{display:flex;gap:6px}
  .band{
    flex:1;text-align:center;padding:6px 4px 5px;border-radius:9px;
    border:1px solid transparent;
  }
  .band .bn{font-family:var(--mono);font-weight:800;font-size:19px;line-height:1;letter-spacing:-.02em}
  .band .bl{font-size:9px;letter-spacing:.03em;text-transform:uppercase;font-weight:700;margin-top:3px}
  .band.green{background:var(--green-soft)}
  .band.green .bn,.band.green .bl{color:var(--green)}
  .band.amber{background:var(--amber-soft)}
  .band.amber .bn,.band.amber .bl{color:var(--amber)}
  .band.red{background:var(--red-soft)}
  .band.red .bn,.band.red .bl{color:var(--red)}
  .kpi.split .lab{margin-bottom:7px}
  /* V44: stacked delivery bar (Milestones tile) — visually distinct from
     the scorecard dot-grid so the two tiles aren't confused */
  .sbar{display:flex;height:15px;border-radius:20px;overflow:hidden;background:var(--paper-2);margin-top:3px}
  .sbar i{display:block;height:100%;transition:width .5s cubic-bezier(.3,.8,.3,1)}
  .sbar i.green{background:var(--green-soft)} .sbar i.amber{background:var(--amber-soft)} .sbar i.red{background:var(--red-soft)}
  .sbar-leg{display:flex;gap:13px;margin-top:10px;flex-wrap:wrap}
  .sbar-leg span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2)}
  .sbar-leg b{font-family:var(--mono);font-weight:800}
  .sbar-leg i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
  .sbar-leg i.green{background:var(--green)} .sbar-leg i.amber{background:var(--amber)} .sbar-leg i.red{background:var(--red)}
  /* V44: one-line NGO health narrative below the hero */
  .ngo-health{margin:-2px 0 14px;padding:11px 15px;border-radius:11px;background:var(--paper);
              border:1px solid var(--rule);font-size:13px;line-height:1.65;color:var(--ink-2);
              display:flex;gap:9px;align-items:flex-start}
  .ngo-health .hi{font-size:15px;flex:none;line-height:1.4}
  .ngo-health b{color:var(--ink);font-weight:700}
  .ngo-health .ok{color:var(--green);font-weight:700}
  .ngo-health .warn{color:var(--amber);font-weight:700}
  .ngo-health .bad{color:var(--red);font-weight:700}
  /* V44: debit-form recap card (above the Save button) */
  .df-recap{margin-top:6px;padding:12px 14px;border-radius:11px;border:1px dashed var(--rule-2);
            background:var(--paper-2);transition:border-color .2s,background .2s}
  .df-recap.ready{border-style:solid;border-color:var(--accent);background:var(--accent-soft,#ece6fb)}
  .df-recap .dr-h{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-bottom:5px}
  .df-recap.ready .dr-h{color:var(--accent)}
  .df-recap .dr-line{font-size:14px;color:var(--ink);line-height:1.5}
  .df-recap .dr-meta{font-size:12px;color:var(--ink-2);margin-top:4px}
  .df-recap .dr-dim{color:var(--ink-3);font-weight:500}
  .df-recap .dr-miss{color:var(--amber);font-weight:600;font-style:italic}

  /* ===== expandable NGO portfolio table ===== */
  .ngo-tbl td{padding:9px 12px}
  tr.ngo-main{cursor:pointer;transition:.1s}
  tr.ngo-main:hover{background:var(--paper-2)}
  tr.ngo-main.open{background:var(--accent-soft)}
  tr.ngo-main td{border-bottom:1px solid var(--rule)}
  .caret{display:inline-block;width:14px;color:var(--ink-3);transition:transform .15s;font-size:10px}
  tr.ngo-main.open .caret{transform:rotate(90deg);color:var(--accent)}
  tr.bet-sub td{padding:0;border-bottom:1px solid var(--rule);background:var(--paper-2)}
  .bet-sub-inner{padding:10px 16px 10px 42px;display:flex;align-items:center;gap:12px}
  .bet-sub-inner:not(:last-child){border-bottom:1px dashed var(--rule-2)}
  .bet-sub-inner .bi{font-size:15px;width:20px;text-align:center}
  .bet-sub-inner .bt{flex:1;font-size:12.5px;color:var(--ink-2);font-weight:500}
  .bet-sub-inner .bv{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  .mini-bar{width:120px;height:7px;background:var(--card);border:1px solid var(--rule);border-radius:20px;overflow:hidden;flex:none}
  .mini-bar i{display:block;height:100%;border-radius:20px}
  .mini-bar i.green{background:var(--green)}
  .mini-bar i.amber{background:var(--amber)}
  .mini-bar i.red{background:var(--red)}
  .ptag{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:20px;
    border:1px solid transparent;cursor:pointer;transition:.12s;
  }
  .ptag.Active{background:var(--green-soft);color:var(--green)}
  .ptag.Passive{background:var(--paper-2);color:var(--ink-3);border-color:var(--rule-2)}
  .ptag:hover{filter:brightness(.97);border-color:var(--rule-2)}
  .ptag .pd{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ===== PARTNER SCORECARD GRID ===== */
  .sc-tabs{display:flex;gap:2px}
  .sc-tab{
    padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-3);
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s;
  }
  .sc-tab:hover{color:var(--ink)}
  .sc-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .sc-tbl{font-size:12.5px}
  .sc-tbl th.sc-c,.sc-tbl td.sc-c{text-align:center;width:58px}
  .sc-tbl th.sc-tot,.sc-tbl td.sc-tot{text-align:center;width:70px}
  .sc-tbl th.sc-st,.sc-tbl td.sc-st{text-align:center;width:82px}
  .sc-tbl td{padding:0;border-bottom:1px solid var(--rule)}
  .sc-tbl td.sc-name{padding:9px 12px}
  .sc-cell{
    display:flex;align-items:center;justify-content:center;
    height:42px;font-family:var(--mono);font-weight:500;font-size:12.5px;
    cursor:pointer;transition:.1s;border-left:1px solid var(--card);
  }
  .sc-cell:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:2;position:relative}
  .sc-cell.s-hi{background:var(--green-soft);color:var(--green)}
  .sc-cell.s-mid{background:#fbf3e0;color:var(--amber)}
  .sc-cell.s-lo{background:var(--red-soft);color:var(--red)}
  .sc-cell.s-na{background:var(--paper-2);color:var(--ink-3)}
  .sc-tot-v{font-family:var(--mono);font-weight:700;font-size:13px}
  .sc-foot td{background:var(--paper);font-weight:700;border-top:1.5px solid var(--rule-2);border-bottom:none}
  .sc-foot .sc-cell{height:38px;background:transparent;cursor:default;font-weight:700}
  .sc-foot .sc-cell:hover{outline:none}
  .sc-name .av{
    width:26px;height:26px;border-radius:7px;flex:none;display:inline-flex;
    align-items:center;justify-content:center;font-size:10px;font-weight:700;
    background:var(--accent-soft);color:var(--accent);margin-right:9px;vertical-align:middle;
  }

  /* score picker popover */
  .score-pop{
    position:fixed;z-index:140;background:var(--card);border:1px solid var(--rule-2);
    border-radius:12px;box-shadow:var(--shadow-lg);padding:9px;
    display:none;grid-template-columns:repeat(4,1fr);gap:5px;width:188px;
  }
  .score-pop.show{display:grid}
  .score-pop .sp-opt{
    padding:7px 0;text-align:center;font-family:var(--mono);
    font-size:12.5px;font-weight:600;border-radius:7px;background:var(--paper-2);
    color:var(--ink-2);transition:.1s;cursor:pointer;
  }
  .score-pop .sp-opt:hover{background:var(--accent);color:#fff}
  .score-pop .sp-head{
    grid-column:1/-1;font-size:10px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-3);padding:1px 3px 4px;
  }

  /* ===== TABLES ===== */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;text-align:left;
    padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--paper);
    white-space:nowrap;
  }
  tbody td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer;transition:.1s}
  tbody tr.click:hover{background:var(--paper-2)}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
  .tbl-foot td{background:var(--paper);font-weight:700;border-top:1px solid var(--rule)}

  /* ===== BUTTONS ===== */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border:1px solid var(--rule-2);background:var(--card);
    font-size:12px;font-weight:600;border-radius:8px;transition:.12s;color:var(--ink);
  }
  .btn:hover{border-color:var(--ink-3);background:var(--paper-2)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#4a2ea8;border-color:#4a2ea8}
  .btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.accent:hover{filter:brightness(1.07)}
  .btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.danger:hover{filter:brightness(1.06);border-color:var(--red)}
  .btn.sm{padding:5px 9px;font-size:11px}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--paper-2)}
  /* visible keyboard focus for accessibility */
  .btn:focus-visible,.nav-item:focus-visible,.tab:focus-visible,
  .sel-inp:focus-visible,.sc-cell:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ===== TABS ===== */
  .tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--rule);margin-bottom:20px}
  .tab{
    padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--ink-3);
    border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:.12s;
    display:flex;align-items:center;gap:7px;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .ct{font-size:10.5px;background:var(--paper-2);color:var(--ink-3);padding:1px 6px;border-radius:8px;font-weight:600}
  .tab.active .ct{background:var(--accent-soft);color:var(--accent)}

  /* ===== BIG BET — COMPACT COLLAPSIBLE ROWS ===== */
  .bet-list{
    background:var(--card);border:1px solid var(--rule);
    border-radius:13px;box-shadow:var(--shadow);overflow:hidden;
  }
  .bet-row{
    display:flex;align-items:center;gap:12px;padding:9px 14px;
    border-bottom:1px solid var(--rule);cursor:pointer;transition:.1s;
  }
  .bet-row:last-of-type{border-bottom:none}
  .bet-row:hover{background:var(--paper-2)}
  .bet-row.open{background:var(--accent-soft)}
  .bet-row .caret{
    width:13px;flex:none;color:var(--ink-3);font-size:9px;transition:transform .15s;
  }
  .bet-row.open .caret{transform:rotate(90deg);color:var(--accent)}
  .bet-row .bi{
    width:28px;height:28px;flex:none;border-radius:8px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .bet-row .bmain{flex:1;min-width:0}
  .bet-row .btitle{
    font-weight:600;font-size:13px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bet-row .bngo{font-size:11px;color:var(--ink-3);margin-top:1px}
  .bet-row .bbar-wrap{width:150px;flex:none;display:flex;align-items:center;gap:8px}
  .bet-row .bbar-wrap .pbar{flex:1}
  .bet-row .bpct{
    font-family:var(--mono);font-weight:700;font-size:12px;
    width:38px;text-align:right;flex:none;
  }
  .bet-row .bfig{
    width:120px;flex:none;text-align:right;
    font-family:var(--mono);
  }
  .bet-row .bfig .fv{font-weight:700;font-size:13px}
  .bet-row .bfig .ft{font-size:10px;color:var(--ink-3);margin-top:1px}
  .bet-row .bdot{width:8px;height:8px;border-radius:50%;flex:none}
  .bet-row .bdot.green{background:var(--green)}
  .bet-row .bdot.amber{background:var(--amber)}
  .bet-row .bdot.red{background:var(--red)}
  .bet-row .bdot.gray{background:var(--ink-3)}
  .bet-detail{
    border-bottom:1px solid var(--rule);background:var(--paper-2);
    padding:13px 14px 15px;
  }
  .bet-detail:last-of-type{border-bottom:none}
  .bet-detail .dhead{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--ink-3);margin-bottom:8px;
  }
  .bet-detail .dhead b{color:var(--ink)}

  /* monthly ladder grid */
  .ladder{display:flex;gap:0;overflow-x:auto;padding:2px}
  .lad-cell{
    flex:none;width:104px;border:1px solid var(--rule);border-right:none;
    background:var(--card);transition:.12s;
  }
  .lad-cell:last-child{border-right:1px solid var(--rule)}
  .lad-cell:hover{background:var(--paper)}
  .lad-cell.editable{cursor:pointer}
  .lad-cell.editable:hover{box-shadow:inset 0 0 0 2px var(--accent-soft)}
  .lad-cell.future{opacity:.5}
  .lad-cell.current{box-shadow:inset 0 2px 0 var(--accent)}
  .lad-mo{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 9px 4px;text-align:center;border-bottom:1px solid var(--rule)}
  .lad-body{padding:7px 9px}
  .lad-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
  .lad-line .k{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
  .lad-line .v{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .lad-line .v.plan{color:var(--ink-2)}
  .lad-line .v.ach{font-weight:700;font-size:13.5px}
  .lad-var{font-size:9.5px;font-weight:600;text-align:center;padding-top:4px;border-top:1px solid var(--rule);margin-top:5px}
  .lad-var.pos{color:var(--green)}
  .lad-var.neg{color:var(--red)}
  .lad-var.zero{color:var(--ink-3)}

  /* ===== MODAL ===== */
  .modal-bg{
    position:fixed;inset:0;z-index:120;background:rgba(26,34,51,.4);
    backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:30px;
  }
  .modal-bg.show{display:flex}
  #confirmBg{z-index:160}   /* V45: confirm layer sits above the main modal */
  .modal{
    background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow-lg);
    width:520px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;
    animation:pop .2s cubic-bezier(.3,.9,.3,1);border-radius:18px;overflow:hidden;
  }
  .modal.wide{width:760px}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:14px}
  .modal-h .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .modal-h h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1.15;margin-top:3px}
  .modal-h .x{margin-left:auto;font-size:20px;color:var(--ink-3);padding:3px 8px;border-radius:7px;flex:none}
  .modal-h .x:hover{background:var(--paper-2);color:var(--accent)}
  .modal-b{padding:20px 22px;overflow-y:auto}
  .modal-f{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end;background:var(--paper)}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--rule-2);background:var(--paper);
    border-radius:9px;transition:.12s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-soft)}
  .field textarea{resize:vertical;min-height:62px;line-height:1.5}
  .field .hint{font-size:11px;color:var(--ink-3);margin-top:5px}
  .frow{display:flex;gap:13px}
  .frow .field{flex:1}

  .empty{text-align:center;padding:52px 20px;color:var(--ink-3)}
  .empty .mk{font-size:34px;margin-bottom:10px;opacity:.5}
  .empty p{font-size:13px;max-width:340px;margin:0 auto}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  /* mini bar chart */
  .barchart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
  .barchart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .barchart .stack{width:100%;display:flex;flex-direction:column-reverse;height:100px;justify-content:flex-start}
  .barchart .seg{width:100%;border-radius:2px 2px 0 0;min-height:1px;transition:height .4s}
  .barchart .lbl{font-size:9.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
  .barchart .bb-plan{background:repeating-linear-gradient(45deg,var(--rule-2),var(--rule-2) 3px,transparent 3px,transparent 6px);border:1px dashed var(--ink-3)}

  /* doc / list rows */
  .lrow{display:flex;align-items:center;gap:13px;padding:11px 15px;border-bottom:1px solid var(--rule);transition:.1s}
  .lrow:last-child{border-bottom:none}
  .lrow:hover{background:var(--paper-2)}
  .lrow .ico{width:34px;height:34px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
  .lrow .meta{flex:1;min-width:0}
  .lrow .meta .t{font-weight:600;font-size:13px}
  .lrow .meta .s{font-size:11px;color:var(--ink-3)}

  .seg-toggle{display:inline-flex;border:1px solid var(--rule-2);border-radius:9px;overflow:hidden}
  .seg-toggle button{padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--card)}
  .seg-toggle button.on{background:var(--accent);color:#fff}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--paper-2);color:var(--ink-2)}

  .tag-vert{font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:20px;text-transform:uppercase}
  .tag-vert.live{background:var(--green-soft);color:var(--green)}
  .tag-vert.adv{background:var(--blue-soft);color:var(--blue)}
  .tag-vert.edu{background:var(--amber-soft);color:var(--amber)}
  .tag-vert.health{background:var(--red-soft);color:var(--red)}
  .tag-vert.climate{background:var(--green-soft);color:var(--green)}

  /* ===== focus / vertical accent colors ===== */
  .foc-livelihood,.fc-livelihood{--fc:var(--green)}
  .foc-education,.fc-education{--fc:var(--amber)}
  .foc-advocacy,.fc-advocacy{--fc:var(--blue)}
  .foc-healthcare,.fc-healthcare{--fc:var(--red)}
  .foc-climate,.fc-climate{--fc:var(--violet)}

  /* ===== PARTNER NGO CARDS (V2 style) ===== */
  .ngo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  @media(max-width:1050px){.ngo-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:680px){.ngo-grid{grid-template-columns:1fr}}
  .ngo-card{
    background:var(--card);border:1px solid var(--rule);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:.14s;
  }
  .ngo-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--rule-2)}
  .ngo-card-stripe{height:4px;background:var(--accent)}
  .ngo-card.livelihood .ngo-card-stripe,.ngo-card-stripe.livelihood{background:var(--green)}
  .ngo-card.education .ngo-card-stripe,.ngo-card-stripe.education{background:var(--amber)}
  .ngo-card.advocacy .ngo-card-stripe,.ngo-card-stripe.advocacy{background:var(--blue)}
  .ngo-card.healthcare .ngo-card-stripe,.ngo-card-stripe.healthcare{background:var(--red)}
  .ngo-card.climate .ngo-card-stripe,.ngo-card-stripe.climate{background:var(--violet)}
  .ngo-card-body{padding:15px 16px;flex:1;display:flex;flex-direction:column;gap:12px}
  .ngo-card-top{display:flex;gap:11px;align-items:flex-start}
  .ngo-avatar{
    width:42px;height:42px;flex:none;border-radius:11px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent);
  }
  .ngo-avatar.livelihood{background:var(--green-soft);color:var(--green)}
  .ngo-avatar.education{background:var(--amber-soft);color:var(--amber)}
  .ngo-avatar.advocacy{background:var(--blue-soft);color:var(--blue)}
  .ngo-avatar.healthcare{background:var(--red-soft);color:var(--red)}
  .ngo-avatar.climate{background:var(--violet-soft);color:var(--violet)}
  .risk-dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}

  /* V64: APL folders — Dashboard, PM only. Hover fans out up to 5 NGO
     avatar chips behind the folder card; click opens the full set via
     the existing modal system (see openAplFolder). */
  /* V64: folders on the left flow in their own grid; the doc widget is a
     fixed-width flex sibling pinned to the right, independent of how many
     folders there are or whether the folder grid wraps to a second row. */
  .apl-row{display:flex;gap:14px;align-items:stretch;margin-bottom:14px}
  .apl-folders{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .apl-folder{position:relative;cursor:pointer;padding-top:26px}
  .apl-folder-fan{position:absolute;top:0;left:50%;height:34px;pointer-events:none}
  .apl-fan-chip{position:absolute;top:0;left:0;margin-left:-17px;opacity:0;transition:transform .18s ease,opacity .18s ease}
  .apl-fan-chip .ngo-avatar{width:34px;height:34px;font-size:11px;border:2px solid var(--card);box-shadow:var(--shadow)}
  .apl-folder:hover .apl-fan-chip{opacity:1}
  .apl-folder:hover .apl-fan-chip:nth-child(1){transform:translate(-52px,-6px) rotate(-12deg)}
  .apl-folder:hover .apl-fan-chip:nth-child(2){transform:translate(-26px,-10px) rotate(-6deg)}
  .apl-folder:hover .apl-fan-chip:nth-child(3){transform:translate(0,-12px) rotate(0deg)}
  .apl-folder:hover .apl-fan-chip:nth-child(4){transform:translate(26px,-10px) rotate(6deg)}
  .apl-folder:hover .apl-fan-chip:nth-child(5){transform:translate(52px,-6px) rotate(12deg)}
  .apl-folder-body{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:13px;
                    padding:14px;text-align:center;
                    box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .apl-folder:hover .apl-folder-body{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.06)}
  /* V64: "docket" look — two lighter sheets peek out behind the front
     panel, like papers inside a folder, instead of a flat card. */
  .apl-folder-stack{position:relative;height:60px;margin-bottom:8px}
  .apl-folder-sheet{position:absolute;inset:6px 0 0 10px;border-radius:6px;border:1px solid var(--rule)}
  .apl-folder-sheet-2{inset:1px 0 0 3px}
  .apl-folder-sheet-1{inset:4px 0 0 7px}
  .apl-folder-glyph{position:relative;width:100%;height:100%;border-radius:8px;font-size:22px;
                     display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
                     border:1.5px solid transparent}
  /* each folder cycles through the app's existing semantic colours (same
     set used for NGO verticals) so folders read as distinct people, not
     one repeated purple block. Pastel fills throughout (matching the
     app's badge/pill/scorecard convention), with a solid-colour border
     on the front glyph panel so it still reads as "in front of" the
     lighter sheets behind it rather than blending into them. */
  .apl-folder-sheet.c-green{background:var(--green-soft)}
  .apl-folder-glyph.c-green{background:var(--green-soft);border-color:var(--green)}
  .apl-folder-sheet.c-amber{background:var(--amber-soft)}
  .apl-folder-glyph.c-amber{background:var(--amber-soft);border-color:var(--amber)}
  .apl-folder-sheet.c-blue{background:var(--blue-soft,#e7eefc)}
  .apl-folder-glyph.c-blue{background:var(--blue-soft,#e7eefc);border-color:var(--blue)}
  .apl-folder-sheet.c-red{background:var(--red-soft)}
  .apl-folder-glyph.c-red{background:var(--red-soft);border-color:var(--red)}
  .apl-folder-sheet.c-violet{background:var(--violet-soft)}
  .apl-folder-glyph.c-violet{background:var(--violet-soft);border-color:var(--violet)}
  .apl-folder-name{font-weight:700;font-size:13.5px;color:var(--ink)}
  .apl-folder-count{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .apl-modal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
  .apl-modal-card{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
  .apl-modal-card .ngo-avatar{margin:0 auto}
  .apl-modal-card .nm{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3}

         flex:none;align-self:center;white-space:nowrap}

  .tm-kr{background:var(--accent-soft);color:var(--accent)}
  .tm-ai{background:var(--blue-soft,#e7eefc);color:var(--blue)}
  .tm-dt{font-size:11.5px;font-weight:700;flex:none;align-self:center;

  .tm-late{color:var(--red)}
  .tm-dobj{font-size:11.5px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .tm-dtitle{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.45;margin-bottom:14px}
  .tm-dl{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--rule)}
  .tm-dl>span{flex:0 0 108px;color:var(--ink-3)}
  .tm-dl>div{flex:1;color:var(--ink);min-width:0;word-break:break-word}
  .tm-pv-sum{font-size:12.5px;color:var(--ink);line-height:1.6;margin-bottom:10px}
  .tm-pv-empty{font-size:12.5px;color:var(--ink-2);line-height:1.6;
               background:var(--amber-soft);border:1px solid var(--amber);
               border-radius:9px;padding:11px 13px}
  .tm-pv-m{font-size:11px;font-weight:800;color:var(--ink-3);margin:9px 0 4px;
           text-transform:uppercase;letter-spacing:.05em}
  .tm-pv-r{font-size:12px;color:var(--ink-2);padding:3px 0 3px 10px;
           border-left:2px solid var(--rule)}
  .tm-pv-more{font-size:11.5px;color:var(--ink-3);padding:3px 0 3px 12px}
  .tm-pv-flags{margin-top:13px;background:var(--amber-soft);border:1px solid var(--amber);
               border-radius:9px;padding:10px 12px}
  .tm-pv-fh{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .tm-pv-f{font-size:11.5px;color:var(--ink-2);line-height:1.55;padding:2px 0}
  .tm-pv-note{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:11px}
  /* shown to a manager on a subordinate's NGO, where Save is deliberately absent */
  .ngo-viewonly{font-size:12.5px;color:var(--ink-2);background:var(--amber-soft);
                border:1px solid var(--amber);border-radius:9px;
                padding:9px 12px;margin-bottom:12px;line-height:1.5}
  @media(max-width:920px){
    /* two filters per line, and a select tall enough to hit with a thumb */
    .tm-filters{gap:8px}

    .tm-dl>span{flex:none}

  .risk-dot.green{background:var(--green)} .risk-dot.amber{background:var(--amber)}
  .risk-dot.red{background:var(--red)} .risk-dot.gray{background:var(--ink-3)}
  .ngo-card-name{font-weight:600;font-size:14px;line-height:1.3;color:var(--ink)}
  .ngo-card-meta{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .foc-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

  .foc-dot.advocacy{background:var(--blue)} .foc-dot.healthcare{background:var(--red)}
  .foc-dot.climate{background:var(--violet)}
  .ngo-card-people{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--rule)}
  .apl-ico{
    width:28px;height:28px;flex:none;border-radius:8px;background:var(--paper-2);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--ink-2);
  }
  .apl-l{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .apl-n{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:1px}
  .ngo-card-budget{border-top:1px solid var(--rule);padding-top:11px}
  .bgt-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}

  /* ===== NGO HERO BAND (V2 detail header) ===== */
  .ngo-hero{
    background:var(--card);border:1px solid var(--rule);border-radius:15px;
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;
  }
  .ngo-hero-stripe{height:5px;background:var(--accent)}
  .ngo-hero-stripe.livelihood{background:var(--green)}
  .ngo-hero-stripe.education{background:var(--amber)}
  .ngo-hero-stripe.advocacy{background:var(--blue)}
  .ngo-hero-stripe.healthcare{background:var(--red)}
  .ngo-hero-stripe.climate{background:var(--violet)}
  .ngo-hero-content{padding:20px 22px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
  @media(max-width:720px){.ngo-hero-content{grid-template-columns:auto 1fr}}
  .ngo-hero-avatar{
    width:60px;height:60px;flex:none;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:21px;background:var(--accent-soft);color:var(--accent);
  }
  .ngo-hero-avatar.livelihood{background:var(--green-soft);color:var(--green)}
  .ngo-hero-avatar.education{background:var(--amber-soft);color:var(--amber)}
  .ngo-hero-avatar.advocacy{background:var(--blue-soft);color:var(--blue)}
  .ngo-hero-avatar.healthcare{background:var(--red-soft);color:var(--red)}
  .ngo-hero-avatar.climate{background:var(--violet-soft);color:var(--violet)}
  .ngo-hero-titles .he{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
  .ngo-hero-titles h1{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1.15}
  .ngo-hero-titles .lede{margin-top:5px;color:var(--ink-3);font-size:12.5px;max-width:560px;line-height:1.5}
  .ngo-hero-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ngo-hero-strip{
    padding:13px 22px;background:var(--paper);border-top:1px solid var(--rule);
    display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  }
  @media(max-width:720px){.ngo-hero-strip{grid-template-columns:1fr 1fr}}
  .ngo-hero-strip .l{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
  .ngo-hero-strip .v{font-size:12.5px;color:var(--ink);font-weight:600}
  .ngo-hero-strip .v.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-weight:500}

  /* ===== NGO DETAIL TABS (V2 pill style) ===== */
  .ngo-tabs{
    display:flex;gap:3px;margin-bottom:18px;background:var(--paper-2);
    border:1px solid var(--rule);border-radius:11px;padding:4px;width:fit-content;flex-wrap:wrap;
  }

  .ngo-tabs .tb .tc{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

  .dl-row .v{font-weight:600;color:var(--ink)}

    border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  .dn-hrow{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 11px;font-size:12px;border-bottom:1px solid var(--rule);
  }
  .dn-hrow:last-child{border-bottom:none}
  .dn-hrow:nth-child(odd){background:var(--paper-2)}
  .dn-hstage{font-weight:600;color:var(--ink)}
  .dn-hmeta{color:var(--ink-3);font-size:11px;font-family:var(--mono);white-space:nowrap}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-bottom:8px}
  .chart-legend span{display:flex;align-items:center;gap:5px}
  .lg-sw{width:13px;height:9px;border-radius:2px;display:inline-block}

  /* interactive chart wrapper + floating tooltip */
  .chart-wrap{position:relative}
  .chart-bar,.chart-pt,.chart-hot{cursor:pointer;transition:opacity .12s}
  .chart-hot{fill:transparent}
  .chart-wrap:hover .chart-bar{opacity:.45}
  .chart-wrap .chart-col:hover .chart-bar{opacity:1}
  .chart-wrap:hover .chart-pt{opacity:.5}
  .chart-wrap .chart-col:hover .chart-pt{opacity:1}
  .chart-col:hover .chart-vguide{opacity:1}
  .chart-vguide{opacity:0;transition:opacity .12s}
  .chart-tip{
    position:absolute;pointer-events:none;z-index:20;
    background:var(--ink);color:#fff;border-radius:9px;
    padding:9px 11px;font-size:11.5px;line-height:1.5;
    box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px);
    transition:opacity .12s,transform .12s;white-space:nowrap;
  }
  .chart-tip.show{opacity:1;transform:translateY(0)}
  .chart-tip .tt-h{font-weight:700;font-size:11px;letter-spacing:.02em;margin-bottom:4px;color:#fff}
  .chart-tip .tt-r{display:flex;align-items:center;gap:7px;justify-content:space-between;gap:14px}
  .chart-tip .tt-k{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.72)}
  .chart-tip .tt-sw{width:9px;height:9px;border-radius:2px;display:inline-block}
  .chart-tip .tt-v{font-family:var(--mono);font-weight:600}
  .chart-tip .tt-d{margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.16);font-size:10.5px}

  /* cumulative spend readout banner */
  .cum-readout{
    font-size:12.5px;line-height:1.6;color:var(--ink-2);
    padding:10px 13px;border-radius:9px;margin-bottom:12px;
    background:var(--paper-2);border-left:3px solid var(--ink-3);
  }
  .cum-readout.over{background:var(--red-soft);border-left-color:var(--red)}
  .cum-readout.under{background:var(--green-soft);border-left-color:var(--green)}
  .cum-readout b{color:var(--ink)}
  .cum-readout .cum-verdict{font-weight:700}
  .cum-readout.over .cum-verdict{color:var(--red)}
  .cum-readout.under .cum-verdict{color:var(--green)}

  /* ===== FINANCE insight cards ===== */
  .ins-card{
    background:var(--card);border:1px solid var(--rule);border-radius:13px;
    box-shadow:var(--shadow);padding:15px 16px;border-left:4px solid var(--accent);
  }
  .ins-card.green{border-left-color:var(--green)}
  .ins-card.red{border-left-color:var(--red)}
  .ins-card.amber{border-left-color:var(--amber)}
  .ins-card.blue{border-left-color:var(--blue)}
  .ins-l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .ins-v{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:4px 0 4px}
  .ins-s{font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .ins-s b{color:var(--ink)}

  .watch-row{
    display:flex;align-items:center;gap:11px;padding:9px 11px;
    border:1px solid var(--rule);border-radius:10px;cursor:pointer;transition:.1s;
  }
  .watch-row:hover{background:var(--paper-2);border-color:var(--rule-2)}
  .watch-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .watch-dot.red{background:var(--red)} .watch-dot.blue{background:var(--blue)}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:6px;
    font-size:12.5px;font-weight:500;box-shadow:var(--shadow-lg);
    opacity:0;transition:.25s;z-index:200;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .splitline{height:1px;background:var(--rule);margin:22px 0}
  a.link{color:var(--accent);text-decoration:none;font-weight:600}
  a.link:hover{text-decoration:underline}

  /* hamburger — hidden on desktop, shown on narrow screens */
  .hamburger{
    display:none;width:34px;height:34px;flex:none;border-radius:8px;
    font-size:17px;color:var(--ink-2);border:1px solid var(--rule-2);
    align-items:center;justify-content:center;
  }
  .hamburger:hover{background:var(--paper-2)}
  /* dim scrim behind an open mobile sidebar */
  .side-scrim{
    display:none;position:fixed;inset:0;z-index:55;
    background:rgba(27,35,51,.42);
  }
  .side-scrim.show{display:block}

  @media(max-width:920px){
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .grid-2,.grid-3{grid-template-columns:1fr}
    .grid-2>*,.grid-3>*{grid-column:auto!important;min-width:0}
    .side{position:fixed;z-index:60;transform:translateX(-100%);transition:transform .22s ease}
    .side.open{transform:none;box-shadow:var(--shadow-lg)}
    .hamburger{display:inline-flex}
    .content{padding:22px 16px 60px}
    .topbar{display:flex;padding:0 14px}
    .apl-row{flex-direction:column}
    /* the rail drops below the table rather than squeezing it */
    .dash-split{flex-direction:column}
    .dash-rail{flex-basis:auto;width:100%}
  }
  @media(max-width:560px){
    .kpi-grid{grid-template-columns:1fr}
    .stat-grid{grid-template-columns:1fr !important}
  }

  /* ===== FDNMS — Debit Note workflow (prefixed, additive) ===== */
  .fst{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .fst .sd{width:7px;height:7px;border-radius:50%;background:currentColor}
  .fst-Draft{background:var(--paper-2);color:var(--ink-3)}.fst-Submitted{background:var(--blue-soft);color:var(--blue)}.fst-AccountsVerification{background:var(--violet-soft);color:var(--violet)}.fst-ReturnedForCorrection{background:var(--amber-soft);color:var(--amber)}.fst-Resubmitted{background:var(--blue-soft);color:var(--blue)}.fst-FinanceReview{background:var(--accent-soft);color:var(--accent)}.fst-Approved{background:var(--green-soft);color:var(--green)}.fst-FundReleased{background:var(--green-soft);color:var(--green)}.fst-Closed{background:var(--paper-2);color:var(--ink-2)}.fst-Rejected{background:var(--red-soft);color:var(--red)}
  .fd-tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--rule);margin-bottom:18px;flex-wrap:wrap}
  .fd-tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:.12s;display:flex;align-items:center;gap:7px}
  .fd-tab:hover{color:var(--ink)}.fd-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .fd-tab .ct{font-size:10.5px;background:var(--paper-2);color:var(--ink-3);padding:1px 6px;border-radius:8px;font-weight:700}.fd-tab.on .ct{background:var(--accent-soft);color:var(--accent)}.fd-tab .ct.alert{background:var(--red);color:#fff}
  .fcheck{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1px solid var(--rule);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .fcheck:hover{border-color:var(--ink-3);background:var(--paper-2)}.fcheck.on{border-color:var(--green);background:var(--green-soft)}
  .fcheck .box{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}.fcheck.on .box{background:var(--green);border-color:var(--green)}
  .fcheck .ct{font-size:13px;font-weight:600}.fcheck .cs{font-size:11px;color:var(--ink-3);margin-top:1px}
  .ftl{position:relative;padding-left:26px}.ftl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--rule)}
  .ftl-item{position:relative;padding-bottom:15px}.ftl-item:last-child{padding-bottom:0}
  .ftl-item .pt{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
  .ftl-item.green .pt{border-color:var(--green)}.ftl-item.amber .pt{border-color:var(--amber)}.ftl-item.red .pt{border-color:var(--red)}
  .ftl-item .act{font-weight:600;font-size:13px}.ftl-item .meta{font-size:11px;color:var(--ink-3);margin-top:1px}.ftl-item .cmt{font-size:12px;color:var(--ink-2);margin-top:3px;background:var(--paper-2);padding:7px 10px;border-radius:8px;border-left:3px solid var(--rule-2)}
  .fdoc{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--rule);border-radius:10px;margin-bottom:7px}
  .fdoc .di{width:32px;height:32px;flex:none;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px}
  .fdoc .dn{font-weight:600;font-size:12.5px}.fdoc .dm{font-size:10.5px;color:var(--ink-3)}
  .finfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .finfo .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}.finfo .v{font-size:13.5px;font-weight:600}
  .fli-tbl input,.fli-tbl select{padding:6px 8px;border:1px solid var(--rule-2);border-radius:7px;width:100%;font-size:12px}.fli-tbl td{padding:5px 6px}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:900px){.fgrid2,.fgrid3{grid-template-columns:1fr}}
  .fbanner{padding:11px 14px;border-radius:11px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .fbanner.amber{background:var(--amber-soft);color:var(--amber)}.fbanner.accent{background:var(--accent-soft);color:var(--accent)}.fbanner.green{background:var(--green-soft);color:var(--green)}
  .fd-userbtn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:1px solid var(--rule);background:var(--card);border-radius:11px;margin-bottom:7px;text-align:left;cursor:pointer}
  .fd-userbtn .av,.fd-whoami .av{width:32px;height:32px;flex:none;border-radius:9px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}\n  .xlbar{display:flex;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}
  .xlbar .xf{display:flex;flex-direction:column;gap:3px;min-width:128px}
  .xlbar .xf.grow{flex:1;min-width:200px}
  .xlbar label{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .xlbar input,.xlbar select{padding:6px 8px;border:1px solid var(--rule-2);border-radius:7px;font-size:12px;background:var(--card)}
  .xl{overflow-x:auto}
  .xl table{width:100%;border-collapse:collapse}
  .xl th{background:#eef0f5;border:1px solid #dfe3ec;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:6px 9px;text-align:left}
  .xl th.xr,.xl td.xr{text-align:right}
  .xl th.xn{width:34px;text-align:center}
  .xl td{border:1px solid #e6e9f0;padding:0}
  .xl td.xn{background:#f5f6f9;text-align:center;color:var(--ink-3);font-size:11px;padding:6px 4px}
  .xl td.xla{padding:7px 9px;background:#fafbfd;font-family:var(--mono);font-size:12px}
  .xl td.xlc input{border:none;outline:none;width:100%;padding:7px 9px;font-size:12.5px;background:transparent;font-family:inherit;border-radius:0}
  .xl td.xr input{text-align:right;font-family:var(--mono);font-size:12px}
  .xl td.xlc input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
  .xl tfoot td{border:1px solid #e6e9f0;background:#f5f6f9;font-weight:700;padding:7px 9px;font-size:12px}
  .xl tfoot tr.big td{background:#ece6fb;color:var(--accent);font-size:13px}
  .xl .xdel{color:var(--red);border:none;background:none;cursor:pointer;font-size:14px;padding:4px 8px}
  .xltip{font-size:10.5px;color:var(--ink-3);padding:7px 12px;display:flex;align-items:center;gap:8px}
  .fd-whoami{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.25}

.logo-tile{background:var(--logo) center/cover no-repeat;border-radius:16px}
#introSplash{position:fixed;inset:0;z-index:400;background:#171029;display:none;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease}
#introSplash.show{display:flex}
#introSplash.gone{opacity:0;pointer-events:none}
#introLogo{width:74px;height:74px;border-radius:18px;background:var(--logo) center/cover no-repeat;box-shadow:0 10px 40px rgba(91,63,192,.5);opacity:0;transform:scale(.6);margin-bottom:30px}
#introLogo.in{animation:introPop .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes introPop{to{opacity:1;transform:none}}
#introGreet{font-size:clamp(46px,11vw,104px);line-height:1.05;color:#fff;white-space:nowrap;text-align:center;min-height:1.1em}
#introGreet .ink{display:inline-block}
#introGreet.g-draw .ink{-webkit-clip-path:inset(-40% 100% -22% 0);clip-path:inset(-40% 100% -22% 0)}
#introGreet.g-draw.play .ink{animation:introDraw 1.05s cubic-bezier(.6,.1,.25,1) forwards}
@keyframes introDraw{to{-webkit-clip-path:inset(-40% -20% -22% 0);clip-path:inset(-40% -20% -22% 0)}}
#introGreet.f-guj .ink{padding-top:.14em}
#introGreet.f-hello{font-family:'SahkarScript',cursive;font-weight:700}
#introGreet.f-deva{font-family:'HandDeva','Nirmala UI','Noto Sans Devanagari',sans-serif;font-weight:700}
#introGreet.f-guj{font-family:'HandGuj','Nirmala UI','Noto Sans Gujarati',sans-serif;font-weight:600}
#introGreet.f-bn{font-family:'HandBn','Nirmala UI','Noto Sans Bengali',sans-serif;font-weight:600}
#introGreet.exit{animation:introFadeOut .45s ease forwards!important}
@keyframes introFadeOut{to{opacity:0;transform:translateY(-12px)}}
