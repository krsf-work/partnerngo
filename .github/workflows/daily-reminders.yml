name: Daily reminders

# 9:00 am India time (03:30 UTC). GitHub may start it a few minutes late.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits (v4.4.0) so a moved tag cannot change them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Exact versions and checksums come from push/package-lock.json;
      # package install scripts are not run.
      - name: Install firebase-admin
        working-directory: push
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Send reminders
        run: node push/send-daily.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
